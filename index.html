<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bolsillo">
<meta name="description" content="Bolsillo: tu presupuesto personal, ordenado.">
<meta name="theme-color" content="#F3EDE2" id="mc">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Bolsillo</title>
<script>
// Tema antes del primer pintado (evita el destello claro/oscuro).
(function(){try{
  var t=localStorage.getItem('bolsillo_theme');
  if(!t&&localStorage.getItem('dk')==='1')t='dark';           // preferencia de la versión anterior
  var dark=t==='dark'||((!t||t==='auto')&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  if(dark){document.documentElement.setAttribute('data-theme','dark');document.getElementById('mc').content='#0C1310';}
}catch(e){}})();
</script>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/source-serif-4-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="login" hidden>
  <img src="icon.png" alt="" width="88" height="88">
  <h1>Bolsillo</h1>
  <p>Tu plata, ordenada.</p>
  <button class="btn sec2" id="btn-google" onclick="Sync.signIn()">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Continuar con Google
  </button>
  <div id="ls" role="status" aria-live="polite"></div>
</div>

<div id="app" hidden>
  <aside id="side" aria-label="Navegación principal"></aside>
  <div id="main">
    <header id="top"></header>
    <main id="con" tabindex="-1"></main>
  </div>
  <nav id="nav" aria-label="Navegación principal"></nav>
</div>

<div id="ov" onclick="closeSheet()"></div>
<section id="sh" role="dialog" aria-modal="true" aria-labelledby="sht">
  <div class="grab" aria-hidden="true"></div>
  <div id="shh">
    <button class="iconbtn" id="shback" onclick="sheetBack()" aria-label="Volver"></button>
    <h2 id="sht"></h2>
    <button class="iconbtn" id="shclose" onclick="closeSheet()" aria-label="Cerrar"></button>
  </div>
  <div id="shb"></div>
</section>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="core.js"></script>
<script src="ui.js"></script>
<script src="forms.js"></script>
<script type="module" src="sync.js"></script>
</body>
</html>
