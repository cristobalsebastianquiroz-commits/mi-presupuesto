<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Presupuesto">
<meta name="theme-color" content="#f5f0e8">
<title>Mi Presupuesto</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* ── Paleta acogedora ── */
    --bg:       #f5f0e8;          /* crema cálido */
    --surface:  #fdfaf4;          /* blanco marfil */
    --surface2: #ede8dd;          /* crema oscuro */
    --border:   #ddd5c4;          /* borde arena */
    --text:     #2c2416;          /* marrón oscuro */
    --muted:    #8c7d68;          /* marrón medio */
    --accent:   #b85c38;          /* terracota */
    --accent2:  #e8d5b7;          /* terracota claro */
    --green:    #4a7c59;          /* verde salvia */
    --green-bg: rgba(74,124,89,.12);
    --red:      #c0392b;          /* rojo ladrillo */
    --red-bg:   rgba(192,57,43,.1);
    --yellow:   #c0830a;          /* ámbar cálido */
    --yellow-bg:rgba(192,131,10,.12);
    --purple:   #7c6497;          /* lavanda */
    --safe: env(safe-area-inset-bottom, 0px);
    --radius: 16px;
    --shadow: 0 2px 12px rgba(44,36,22,.08);
    --shadow-md: 0 4px 24px rgba(44,36,22,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow: hidden;
  }

  /* ── LAYOUT ── */
  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 430px; margin: 0 auto; position: relative; }
  #header {
    padding: 52px 20px 18px;
    background: var(--bg);
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }
  #content {
    flex: 1; overflow-y: auto;
    padding: 16px 16px;
    padding-bottom: calc(88px + var(--safe));
    -webkit-overflow-scrolling: touch;
    background: var(--bg);
  }
  #nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: rgba(245,240,232,0.97);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 10px 0 calc(10px + var(--safe));
    z-index: 100;
    box-shadow: 0 -4px 20px rgba(44,36,22,.06);
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none;
    color: var(--muted);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 10px; cursor: pointer; padding: 4px 0;
    transition: color .2s;
    letter-spacing: .2px;
  }
  .nav-btn.active { color: var(--accent); }
  .nav-btn svg { width: 22px; height: 22px; }

  /* ── HEADER ── */
  .header-month {
    font-size: 12px; color: var(--muted);
    font-weight: 500; margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 1px;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .header-balance {
    font-size: 34px; font-weight: 600;
    letter-spacing: -1px;
    font-family: 'Lora', serif;
    color: var(--text);
  }
  .header-balance.pos { color: var(--green); }
  .header-balance.neg { color: var(--red); }
  .header-sub { font-size: 12px; color: var(--muted); margin-top: 5px; }

  /* ── CARDS ── */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .card-row { display: flex; justify-content: space-between; align-items: center; }
  .card-title {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted);
    margin-bottom: 12px; font-weight: 600;
  }

  /* ── SUMMARY PILLS ── */
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .pill {
    background: var(--surface);
    border-radius: 14px; padding: 14px 16px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .pill-label { font-size: 11px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  .pill-val { font-size: 20px; font-weight: 600; letter-spacing: -.5px; font-family: 'Lora', serif; }
  .pill-val.green { color: var(--green); }
  .pill-val.red { color: var(--red); }

  /* ── PROGRESS BAR ── */
  .prog-wrap { margin: 10px 0 4px; }
  .prog-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .prog-bar { height: 5px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }
  .prog-fill.green { background: var(--green); }
  .prog-fill.yellow { background: var(--yellow); }
  .prog-fill.red { background: var(--red); }
  .prog-fill.accent { background: var(--accent); }

  /* ── CATEGORY ITEMS ── */
  .cat-item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 0; border-bottom: 1px solid var(--border); cursor: pointer;
    transition: background .15s;
  }
  .cat-item:last-child { border-bottom: none; }
  .cat-icon {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .cat-info { flex: 1; }
  .cat-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .cat-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .cat-amt { text-align: right; }
  .cat-real { font-size: 15px; font-weight: 600; font-family: 'Lora', serif; }
  .cat-pres { font-size: 11px; color: var(--muted); margin-top: 1px; }

  /* ── TRANSACCIONES ── */
  .tx-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .tx-item:last-child { border-bottom: none; }
  .tx-dot {
    width: 38px; height: 38px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .tx-info { flex: 1; min-width: 0; }
  .tx-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-cat { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .tx-amt { font-size: 14px; font-weight: 600; font-family: 'Lora', serif; white-space: nowrap; }
  .tx-amt.ing { color: var(--green); }
  .tx-amt.gas { color: var(--red); }

  /* ── MODAL / SHEET ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(44,36,22,.45);
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity .25s;
    backdrop-filter: blur(2px);
  }
  .overlay.open { opacity: 1; pointer-events: all; }
  .sheet {
    position: fixed; bottom: 0; left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 100%; max-width: 430px;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 20px 20px calc(24px + var(--safe));
    z-index: 201;
    transition: transform .3s cubic-bezier(.32,1,.6,1);
    max-height: 90dvh; overflow-y: auto;
    box-shadow: 0 -8px 40px rgba(44,36,22,.15);
  }
  .sheet.open { transform: translateX(-50%) translateY(0); }
  .sheet-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 99px; margin: 0 auto 20px;
  }
  .sheet-title {
    font-size: 18px; font-weight: 600; margin-bottom: 20px;
    font-family: 'Lora', serif; color: var(--text);
  }

  /* ── FORM ELEMENTS ── */
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 11px; color: var(--muted);
    margin-bottom: 7px; text-transform: uppercase;
    letter-spacing: .8px; font-weight: 600;
  }
  .field input, .field select {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px; outline: none;
    -webkit-appearance: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(184,92,56,.12);
  }
  .field select option { background: var(--surface); }
  .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .type-btn {
    padding: 11px; border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--bg); color: var(--muted);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: all .2s;
  }
  .type-btn.active-ing { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .type-btn.active-gas { background: var(--red-bg); border-color: var(--red); color: var(--red); }
  .btn-primary {
    width: 100%; padding: 15px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 14px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px;
    box-shadow: 0 4px 16px rgba(184,92,56,.3);
    transition: transform .1s, box-shadow .2s;
  }
  .btn-primary:active { transform: scale(.98); }
  .btn-secondary {
    width: 100%; padding: 13px;
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); border-radius: 14px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 8px;
  }
  .btn-delete {
    background: var(--red-bg); color: var(--red);
    border: 1px solid rgba(192,57,43,.25);
    border-radius: 12px; padding: 10px 16px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px; cursor: pointer;
  }

  /* ── METAS ── */
  .meta-card {
    background: var(--surface); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px;
    border: 1px solid var(--border);
    cursor: pointer; transition: border-color .2s, box-shadow .2s;
    box-shadow: var(--shadow);
  }
  .meta-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
  .meta-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .meta-name { font-size: 15px; font-weight: 500; color: var(--text); }
  .meta-pct { font-size: 22px; font-weight: 600; font-family: 'Lora', serif; color: var(--accent); }
  .meta-nums { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .meta-badge {
    display: inline-block; font-size: 10px;
    padding: 2px 9px; border-radius: 99px;
    font-weight: 600; margin-top: 5px;
    letter-spacing: .3px;
  }
  .meta-badge.linked { background: rgba(184,92,56,.12); color: var(--accent); border: 1px solid rgba(184,92,56,.25); }
  .meta-badge.manual { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .meta-saving-info {
    margin-top: 10px; padding: 10px 12px;
    background: var(--bg); border-radius: 10px;
    border: 1px solid var(--border);
  }
  .meta-saving-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 3px 0; }
  .meta-saving-row span:first-child { color: var(--muted); }
  .meta-saving-row span:last-child { font-weight: 500; font-family: 'Lora', serif; }

  /* ── EMOJI PICKER ── */
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 8px; max-height: 140px; overflow-y: auto; }
  .emoji-opt { padding: 8px; border-radius: 8px; font-size: 20px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all .15s; }
  .emoji-opt:hover { background: var(--surface2); }
  .emoji-opt.selected { border-color: var(--accent); background: rgba(184,92,56,.1); }
  .color-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
  .color-opt { width: 100%; aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all .15s; }
  .color-opt.selected { border-color: var(--text); transform: scale(1.1); }

  /* ── SETTINGS ── */
  .setting-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--border);
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-label { font-size: 14px; color: var(--text); }
  .setting-val { font-size: 13px; color: var(--accent); font-weight: 600; cursor: pointer; }
  .month-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .month-btn {
    padding: 10px 6px; border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg); color: var(--muted);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px; cursor: pointer; text-align: center;
    transition: all .15s;
  }
  .month-btn.active {
    background: rgba(184,92,56,.12);
    border-color: var(--accent); color: var(--accent); font-weight: 600;
  }

  /* ── FAB ── */
  .fab {
    position: fixed; bottom: calc(76px + var(--safe));
    right: calc(50% - 200px);
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--accent); border: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(184,92,56,.45);
    cursor: pointer; z-index: 99;
    transition: transform .15s, box-shadow .2s;
  }
  .fab:active { transform: scale(.94); }
  .fab svg { width: 24px; height: 24px; color: #fff; }

  /* ── EMPTY ── */
  .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty-icon { font-size: 38px; margin-bottom: 12px; }
  .empty p { font-size: 14px; line-height: 1.7; }

  /* ── MONTH SELECTOR ── */
  .month-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .month-bar::-webkit-scrollbar { display: none; }
  .month-chip {
    flex-shrink: 0; padding: 6px 16px;
    border-radius: 99px; border: 1px solid var(--border);
    background: var(--surface); font-size: 13px;
    color: var(--muted); cursor: pointer; white-space: nowrap;
    font-weight: 500;
  }
  .month-chip.active {
    background: rgba(184,92,56,.12);
    border-color: var(--accent); color: var(--accent); font-weight: 600;
  }

  /* ── CAT MANAGE ── */
  .cat-manage-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .cat-manage-item:last-child { border-bottom: none; }
  .cat-manage-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .cat-manage-name { flex: 1; font-size: 14px; color: var(--text); }
  .cat-manage-actions { display: flex; gap: 8px; }
  .btn-icon { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 8px; color: var(--muted); font-size: 14px; transition: all .15s; }
  .btn-icon:hover { background: var(--surface2); color: var(--text); }
  .btn-icon.del:hover { color: var(--red); }

  /* ── INFO BOX ── */
  .info-box {
    background: rgba(184,92,56,.06);
    border: 1px solid rgba(184,92,56,.18);
    border-radius: 12px; padding: 12px 14px;
    margin-bottom: 14px; font-size: 12px;
    color: var(--muted); line-height: 1.7;
  }
  .info-box strong { color: var(--accent); }

  /* ── DEUDORES ── */
  .deudor-card {
    background: var(--surface); border-radius: var(--radius);
    padding: 16px; margin-bottom: 10px;
    border: 1px solid var(--border);
    cursor: pointer; transition: border-color .2s, box-shadow .2s;
    box-shadow: var(--shadow);
  }
  .deudor-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
  .deudor-card.pagado { opacity: .55; border-style: dashed; }
  .deudor-top { display: flex; align-items: center; gap: 12px; }
  .deudor-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700; flex-shrink: 0;
    background: rgba(184,92,56,.15); color: var(--accent);
    font-family: 'Lora', serif;
  }
  .deudor-info { flex: 1; min-width: 0; }
  .deudor-nombre { font-size: 15px; font-weight: 600; color: var(--text); }
  .deudor-desc { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deudor-monto { text-align: right; }
  .deudor-total { font-size: 18px; font-weight: 600; font-family: 'Lora', serif; color: var(--yellow); }
  .deudor-total.cobrado { color: var(--green); }
  .deudor-fecha { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .deudor-abonos { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .abono-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
  .abono-row span:first-child { color: var(--muted); }
  .abono-row span:last-child { color: var(--green); font-family: 'Lora', serif; }
  .deudor-status {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; padding: 3px 9px;
    border-radius: 99px; font-weight: 600; margin-top: 8px;
    letter-spacing: .2px;
  }
  .deudor-status.pendiente { background: var(--yellow-bg); color: var(--yellow); border: 1px solid rgba(192,131,10,.25); }
  .deudor-status.cobrado { background: var(--green-bg); color: var(--green); border: 1px solid rgba(74,124,89,.25); }
  .deudor-status.parcial { background: rgba(184,92,56,.1); color: var(--accent); border: 1px solid rgba(184,92,56,.25); }
  .resumen-cobro { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .resumen-cobro-pill {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; text-align: center;
    box-shadow: var(--shadow);
  }
  .resumen-cobro-pill .val { font-size: 16px; font-weight: 600; font-family: 'Lora', serif; margin-bottom: 3px; }
  .resumen-cobro-pill .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }

  /* ── MEDIO DE PAGO ── */
  .pago-toggle { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .pago-btn {
    padding: 10px 4px; border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--bg); color: var(--muted);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 12px; font-weight: 500; cursor: pointer;
    transition: all .2s; text-align: center; line-height: 1.4;
  }
  .pago-btn .pago-icon { font-size: 18px; display: block; margin-bottom: 2px; }
  .pago-btn.active-efectivo { background: rgba(74,124,89,.12); border-color: var(--green); color: var(--green); }
  .pago-btn.active-debito   { background: rgba(184,92,56,.12);  border-color: var(--accent); color: var(--accent); }
  .pago-btn.active-credito  { background: rgba(124,100,151,.14); border-color: var(--purple); color: var(--purple); }

  /* Badge inline en lista de tx */
  .pago-badge {
    display: inline-block; font-size: 9px; padding: 1px 6px;
    border-radius: 99px; font-weight: 600; margin-left: 4px;
    vertical-align: middle; letter-spacing: .2px;
  }
  .pago-badge.efectivo { background: rgba(74,124,89,.12);  color: var(--green);  border: 1px solid rgba(74,124,89,.2); }
  .pago-badge.debito   { background: rgba(184,92,56,.1);   color: var(--accent); border: 1px solid rgba(184,92,56,.2); }
  .pago-badge.credito  { background: rgba(124,100,151,.12);color: var(--purple); border: 1px solid rgba(124,100,151,.2); }

  /* Card reporte medios de pago */
  .medio-pago-row {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 0; border-bottom: 1px solid var(--border);
  }
  .medio-pago-row:last-child { border-bottom: none; }
  .medio-pago-icon {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
  }
  .medio-pago-info { flex: 1; }
  .medio-pago-name { font-size: 14px; font-weight: 500; }
  .medio-pago-count { font-size: 11px; color: var(--muted); margin-top: 1px; }

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBdozpKZrxC63eil14drCAJ1txISA702W0",
  authDomain: "mi-presupuesto-d12de.firebaseapp.com",
  projectId: "mi-presupuesto-d12de",
  storageBucket: "mi-presupuesto-d12de.firebasestorage.app",
  messagingSenderId: "418712208787",
  appId: "1:418712208787:web:2b4d769ba39c1c780c9466"
};

const app = initializeApp(firebaseConfig);
// Persistencia LOCAL: la sesión se guarda en el dispositivo
// Firebase la lee al instante sin ir al servidor → login instantáneo
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser = null;
let syncTimeout = null;
let appReady = false;

// ── SESIÓN CACHEADA: mostrar app al instante si ya había sesión ──────────────
// Guardamos el uid y datos básicos del user en localStorage
// para mostrar la app sin esperar a Firebase la próxima vez
const CACHE_KEY = 'presupuesto_session';
function getCachedSession() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch(e) { return null; }
}
function setCachedSession(user) {
  if (user) {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      uid: user.uid,
      displayName: user.displayName,
      email: user.email,
      photoURL: user.photoURL,
    }));
  } else {
    localStorage.removeItem(CACHE_KEY);
  }
}

function showApp(user) {
  window.currentUser = user;
  currentUser = user;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('nav').style.display = 'flex';
  document.getElementById('fab').style.display = 'flex';
  document.getElementById('hdr-month').title = user.displayName || user.email;
}

function hideApp() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('nav').style.display = 'none';
  document.getElementById('fab').style.display = 'none';
}

// ── INICIO INSTANTÁNEO: si hay sesión cacheada, mostrar app de inmediato ─────
const cached = getCachedSession();
if (cached) {
  // Mostrar app al instante con datos locales sin esperar Firebase
  showApp(cached);
  checkAndCopyLastMonthBudget();
  showTab('resumen');
  appReady = true;
  setTimeout(checkAutoMonthClose, 1500);
}

// ── AUTH ──────────────────────────────────────────────────────────────────────
window.signInWithGoogle = async function() {
  const btn = document.getElementById('btn-google');
  const status = document.getElementById('login-status');
  btn.style.opacity = '0.6';
  status.textContent = 'Conectando...';
  try {
    const provider = new GoogleAuthProvider();
    // Usar redirect en móvil es más rápido que popup
    await signInWithPopup(auth, provider);
  } catch(e) {
    btn.style.opacity = '1';
    status.textContent = 'Error al iniciar sesión. Intenta de nuevo.';
    console.error(e);
  }
};

window.doSignOut = async function() {
  setCachedSession(null);
  await signOut(auth);
};

// Firebase confirma la sesión en segundo plano (no bloquea la UI)
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (user) {
    setCachedSession(user); // actualizar cache con datos frescos
    showApp(user);
    // Solo sincronizar Firestore si la app no estaba ya lista (primera carga)
    if (!appReady) {
      await loadFromFirestore();
      checkAndCopyLastMonthBudget();
      showTab('resumen');
      appReady = true;
      setTimeout(checkAutoMonthClose, 1500);
    } else {
      // Ya está mostrando datos locales, sincronizar en segundo plano silencioso
      syncFromFirestoreBackground();
    }
  } else {
    // Solo ocultar si no hay sesión cacheada válida
    if (!getCachedSession()) {
      hideApp();
    }
    appReady = false;
  }
});

// ── FIRESTORE SYNC ────────────────────────────────────────────────────────────
async function loadFromFirestore() {
  if (!currentUser) return;
  try {
    const ref = doc(db, 'usuarios', currentUser.uid);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      const remote = snap.data();
      const local = loadLocal();
      const merged = { ...remote, currentMonth: local.currentMonth || remote.currentMonth };
      saveLocal(merged);
    } else {
      const local = loadLocal();
      if (Object.keys(local).length > 0) {
        await saveToFirestore(local);
      }
    }
  } catch(e) {
    console.warn('Error loading from Firestore:', e);
  }
}

// Sincronización silenciosa en segundo plano (sin bloquear UI)
async function syncFromFirestoreBackground() {
  if (!currentUser) return;
  try {
    const ref = doc(db, 'usuarios', currentUser.uid);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      const remote = snap.data();
      const local = loadLocal();
      // Solo actualizar si el remoto tiene más datos (evitar sobreescribir cambios locales recientes)
      const remoteCount = (remote.txs || []).length + (remote.metas || []).length;
      const localCount  = (local.txs  || []).length + (local.metas  || []).length;
      if (remoteCount > localCount) {
        const merged = { ...remote, currentMonth: local.currentMonth || remote.currentMonth };
        saveLocal(merged);
        // Refrescar UI silenciosamente
        showTab(window._currentTab || 'resumen');
      }
    }
  } catch(e) {
    // Fallo silencioso, no afecta al usuario
  }
}

async function saveToFirestore(data) {
  if (!currentUser) return;
  try {
    const ref = doc(db, 'usuarios', currentUser.uid);
    await setDoc(ref, data);
  } catch(e) {
    console.warn('Error saving to Firestore:', e);
  }
}

// Debounced sync: waits 1.5s after last change before uploading
window.scheduleSyncToFirestore = function() {
  if (syncTimeout) clearTimeout(syncTimeout);
  syncTimeout = setTimeout(() => {
    const d = loadLocal();
    saveToFirestore(d);
  }, 1500);
};
</script>

<script>
// ── CATEGORÍAS BASE (no borrable, siempre presentes) ─────────────────────────
const BASE_CATS = [
  { id:'ahorro',    name:'Ahorro',       icon:'💰', color:'rgba(167,139,250,.2)',  es:'gasto',   base:true },
  { id:'vivienda',  name:'Vivienda',     icon:'🏠', color:'rgba(56,189,248,.2)',   es:'gasto',   base:true },
  { id:'alimento',  name:'Alimentación', icon:'🍽️', color:'rgba(74,222,128,.2)',   es:'gasto',   base:true },
  { id:'transp',    name:'Transporte',   icon:'🚗', color:'rgba(251,191,36,.2)',   es:'gasto',   base:true },
  { id:'entret',    name:'Ocio',         icon:'🎬', color:'rgba(167,139,250,.2)',  es:'gasto',   base:true },
  { id:'deudas',    name:'Deudas',       icon:'💳', color:'rgba(248,113,113,.2)',  es:'gasto',   base:true },
  { id:'ingreso',   name:'Ingreso',      icon:'📥', color:'rgba(74,222,128,.2)',   es:'ingreso', base:true },
];

// Paleta de colores para categorías personalizadas
const CAT_COLORS = [
  'rgba(56,189,248,.25)',   // azul
  'rgba(74,222,128,.25)',   // verde
  'rgba(251,191,36,.25)',   // amarillo
  'rgba(248,113,113,.25)',  // rojo
  'rgba(167,139,250,.25)',  // morado
  'rgba(244,114,182,.25)',  // rosa
  'rgba(251,146,60,.25)',   // naranja
  'rgba(34,211,238,.25)',   // cyan
  'rgba(163,230,53,.25)',   // lima
  'rgba(209,213,219,.25)',  // gris
];

const CAT_EMOJIS = ['🏋️','✈️','🎓','💊','🐾','📚','💻','🎮','🛍️','☕','🎵','🏥','💇','🔧','🎁','🌿','🍺','🚀','🏊','🎨','📱','🏡','👶','🐶','⚡','🌊','🎯','💎','🎪','🎭'];

const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ── DATA ─────────────────────────────────────────────────────────────────────
function loadLocal() { try { return JSON.parse(localStorage.getItem('presupuesto_v1') || '{}'); } catch(e){ return {}; } }
function saveLocal(d) { localStorage.setItem('presupuesto_v1', JSON.stringify(d)); }
function load() { return loadLocal(); }
function save(d) {
  saveLocal(d);
  if (typeof window.scheduleSyncToFirestore === 'function') window.scheduleSyncToFirestore();
}

function getData() {
  let d = load();
  if (!d.txs) d.txs = [];
  if (!d.presupuestos) d.presupuestos = {};
  if (!d.metas) d.metas = [];
  if (!d.customCats) d.customCats = [];
  if (!d.deudores) d.deudores = [];
  if (!d.recurrentes) d.recurrentes = [];
  if (!d.recurrentesAplicados) d.recurrentesAplicados = {};
  if (!d.currentMonth) {
    const now = new Date();
    d.currentMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  }
  return d;
}

// Obtener TODAS las categorías (base + personalizadas)
function getAllCats() {
  const d = getData();
  return [...BASE_CATS, ...d.customCats];
}

let currentTab = 'resumen';
let editingMeta = null;
let editingCat = null;
let selectedEmoji = '🎯';
let selectedColor = CAT_COLORS[0];

// ── HELPERS ──────────────────────────────────────────────────────────────────
function fmt(n) {
  return '$' + Math.abs(Math.round(n)).toLocaleString('es-CL');
}
function fmtSigned(n) {
  return (n >= 0 ? '+' : '-') + '$' + Math.abs(Math.round(n)).toLocaleString('es-CL');
}
function monthKey(d) { return d.currentMonth || ''; }
function monthLabel(key) {
  if (!key) return '';
  const [y, m] = key.split('-');
  return MONTHS[parseInt(m)-1] + ' ' + y;
}
function getMonthTxs(d) {
  return d.txs.filter(t => t.month === monthKey(d));
}
function getCat(id) {
  return getAllCats().find(c => c.id === id) || BASE_CATS[0];
}

function getTotals(d) {
  const txs = getMonthTxs(d);
  const ingresos = txs.filter(t => t.cat === 'ingreso').reduce((a,t) => a + t.monto, 0);
  const gastos   = txs.filter(t => t.cat !== 'ingreso').reduce((a,t) => a + t.monto, 0);
  return { ingresos, gastos, balance: ingresos - gastos };
}

// Calcular cuánto se ha ahorrado REAL en el mes actual (categoría "ahorro")
function getAhorroReal(d) {
  const txs = getMonthTxs(d);
  return txs.filter(t => t.cat === 'ahorro').reduce((a,t) => a + t.monto, 0);
}

// Calcular total ahorrado histórico (todos los meses) en la categoría ahorro
function getAhorroHistorico(d) {
  return d.txs.filter(t => t.cat === 'ahorro').reduce((a,t) => a + t.monto, 0);
}

// Obtener total aportado a una meta específica (ahorros vinculados)
function getAportesMeta(d, metaId) {
  // Si la meta tiene aportación manual (campo ahorrado), suma ese + ahorros históricos si está vinculada
  const m = d.metas.find(x => x.id === metaId);
  if (!m) return 0;
  if (m.vinculado) {
    // Vinculada al ahorro real: base manual + ahorro acumulado desde creación
    return (m.baseAhorrado || 0) + (m.ahorroVinculado || 0);
  }
  return m.ahorrado || 0;
}

// ── HEADER ───────────────────────────────────────────────────────────────────
function updateHeader() {
  const d = getData();
  const { ingresos, gastos, balance } = getTotals(d);
  document.getElementById('hdr-month').textContent = monthLabel(monthKey(d));
  const hb = document.getElementById('hdr-balance');
  hb.textContent = fmt(Math.abs(balance));
  hb.className = 'header-balance ' + (balance >= 0 ? 'pos' : 'neg');
  document.getElementById('hdr-sub').textContent = balance >= 0
    ? `Disponible este mes · Ingresos ${fmt(ingresos)}`
    : `Déficit este mes · Gastos superan ingresos`;
}

// ── TABS ─────────────────────────────────────────────────────────────────────
function showTab(tab) {
  currentTab = tab;
  window._currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const tabBtn = document.getElementById('tab-'+tab);
  if (tabBtn) tabBtn.classList.add('active');
  // Marcar resumen activo por defecto si no hay tab activo
  else document.getElementById('tab-resumen').classList.add('active');

  const fab = document.getElementById('fab');
  fab.style.display = (tab === 'resumen' || tab === 'gastos') ? 'flex' : 'none';
  updateHeader();
  const c = document.getElementById('content');
  if (tab === 'resumen')   c.innerHTML = renderResumen();
  else if (tab === 'gastos')   c.innerHTML = renderGastos();
  else if (tab === 'comparar') c.innerHTML = renderComparar();
  else if (tab === 'metas')    c.innerHTML = renderMetas();
  else if (tab === 'cobros')   c.innerHTML = renderCobros();
  else if (tab === 'config')   c.innerHTML = renderConfig();
  c.scrollTop = 0;
}

// ── RESUMEN ──────────────────────────────────────────────────────────────────
function renderResumen() {
  const d = getData();
  const { ingresos, gastos, balance } = getTotals(d);
  const pres = d.presupuestos[monthKey(d)] || {};
  const txs = getMonthTxs(d);
  const allCats = getAllCats();

  let html = `<div class="summary-grid">
    <div class="pill"><div class="pill-label">Ingresos</div><div class="pill-val green">${fmt(ingresos)}</div></div>
    <div class="pill"><div class="pill-label">Gastos</div><div class="pill-val red">${fmt(gastos)}</div></div>
  </div>`;

  // Gasto por categoría
  html += `<div class="card"><div class="card-title">Gastos por categoría</div>`;
  const catIds = allCats.filter(c => c.id !== 'ingreso');
  let hasAny = false;
  catIds.forEach(cat => {
    const total = txs.filter(t => t.cat === cat.id).reduce((a,t) => a + t.monto, 0);
    const pTotal = pres[cat.id] || 0;
    if (total === 0 && pTotal === 0) return;
    hasAny = true;
    const pct = pTotal > 0 ? Math.min(total / pTotal * 100, 100) : 0;
    const color = pct > 90 ? 'red' : pct > 70 ? 'yellow' : 'green';
    html += `<div class="cat-item" onclick="openCatDetail('${cat.id}')">
      <div class="cat-icon" style="background:${cat.color}">${cat.icon}</div>
      <div class="cat-info">
        <div class="cat-name">${cat.name}</div>
        ${pTotal > 0 ? `<div class="prog-wrap"><div class="prog-bar"><div class="prog-fill ${color}" style="width:${pct}%"></div></div></div>` : ''}
      </div>
      <div class="cat-amt">
        <div class="cat-real" style="color:var(--red)">${fmt(total)}</div>
        ${pTotal > 0 ? `<div class="cat-pres">de ${fmt(pTotal)}</div>` : ''}
      </div>
    </div>`;
  });
  if (!hasAny) html += `<div class="empty"><div class="empty-icon">📊</div><p>Sin gastos este mes.<br>Toca + para agregar.</p></div>`;
  html += `</div>`;

  // Tasa de ahorro
  if (ingresos > 0) {
    const tasa = (balance / ingresos * 100);
    const color = tasa >= 20 ? 'green' : tasa >= 10 ? 'yellow' : 'red';
    html += `<div class="card">
      <div class="card-title">Tasa de ahorro</div>
      <div class="prog-label"><span>Meta recomendada: 20%</span><span style="color:var(--text);font-weight:500">${tasa.toFixed(1)}%</span></div>
      <div class="prog-bar"><div class="prog-fill ${color}" style="width:${Math.max(0,Math.min(tasa,100))}%"></div></div>
      <div style="margin-top:10px;font-size:12px;color:var(--muted)">${tasa>=20?'🟢 Excelente, estás ahorrando sobre el 20%':tasa>=10?'🟡 Bien, pero intenta llegar al 20%':'🔴 Tus gastos superan lo recomendado'}</div>
    </div>`;
  }

  // Últimas transacciones
  const last = [...txs].reverse().slice(0, 5);
  if (last.length > 0) {
    html += `<div class="card"><div class="card-title">Últimos movimientos</div>`;
    last.forEach(t => {
      const cat = getCat(t.cat);
      html += `<div class="tx-item">
        <div class="tx-dot" style="background:${cat.color}">${cat.icon}</div>
        <div class="tx-info"><div class="tx-name">${t.desc||cat.name}</div><div class="tx-cat">${cat.name} · ${t.fecha||''}</div></div>
        <div class="tx-amt ${t.cat==='ingreso'?'ing':'gas'}">${t.cat==='ingreso'?'+':'-'}${fmt(t.monto)}</div>
      </div>`;
    });
    html += `</div>`;
  }

  // Reporte por medio de pago
  const gastosTxs = txs.filter(t => t.cat !== 'ingreso');
  if (gastosTxs.length > 0) {
    const medios = [
      { key: 'efectivo', icon: '💵', label: 'Efectivo',  bg: 'var(--green-bg)',              color: 'var(--green)'  },
      { key: 'debito',   icon: '💳', label: 'Débito',    bg: 'rgba(184,92,56,.1)',             color: 'var(--accent)' },
      { key: 'credito',  icon: '🏦', label: 'Crédito',   bg: 'rgba(124,100,151,.12)',          color: 'var(--purple)' },
    ];
    const sinMedio = gastosTxs.filter(t => !t.pago);
    html += `<div class="card"><div class="card-title">Gastos por medio de pago</div>`;

    let hayDatos = false;
    medios.forEach(m => {
      const mTxs = gastosTxs.filter(t => t.pago === m.key);
      if (mTxs.length === 0) return;
      hayDatos = true;
      const total = mTxs.reduce((a,t) => a + t.monto, 0);
      const pct = gastos > 0 ? (total / gastos * 100) : 0;
      html += `<div class="medio-pago-row">
        <div class="medio-pago-icon" style="background:${m.bg}">${m.icon}</div>
        <div class="medio-pago-info">
          <div class="medio-pago-name">${m.label}</div>
          <div class="medio-pago-count">${mTxs.length} movimiento${mTxs.length!==1?'s':''} · ${pct.toFixed(0)}% del total</div>
          <div class="prog-wrap" style="margin:6px 0 0">
            <div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${m.color}"></div></div>
          </div>
        </div>
        <div class="medio-pago-amt" style="color:${m.color}">${fmt(total)}</div>
      </div>`;
    });
    if (sinMedio.length > 0) {
      const total = sinMedio.reduce((a,t) => a + t.monto, 0);
      html += `<div class="medio-pago-row">
        <div class="medio-pago-icon" style="background:var(--surface2)">❓</div>
        <div class="medio-pago-info">
          <div class="medio-pago-name" style="color:var(--muted)">Sin clasificar</div>
          <div class="medio-pago-count">${sinMedio.length} movimiento${sinMedio.length!==1?'s':''}</div>
        </div>
        <div class="medio-pago-amt" style="color:var(--muted)">${fmt(total)}</div>
      </div>`;
    }
    if (!hayDatos && sinMedio.length === 0) {
      html += `<div style="text-align:center;padding:16px;font-size:13px;color:var(--muted)">Registra gastos para ver el reporte</div>`;
    }
    html += `</div>`;
  }

  return html;
}

// ── MOVIMIENTOS ──────────────────────────────────────────────────────────────
let _searchQuery = '';

function renderGastos(query) {
  const d = getData();
  const allTxs = getMonthTxs(d).slice().reverse();
  const q = (query !== undefined ? query : _searchQuery).toLowerCase().trim();
  const txs = q ? allTxs.filter(t => {
    const cat = getCat(t.cat);
    return (t.desc||'').toLowerCase().includes(q)
      || cat.name.toLowerCase().includes(q)
      || (t.nota||'').toLowerCase().includes(q)
      || (t.fecha||'').toLowerCase().includes(q);
  }) : allTxs;

  let html = `<div class="search-bar">
    <span style="font-size:16px;color:var(--muted)">🔍</span>
    <input type="text" placeholder="Buscar movimientos..." value="${q}"
      oninput="_searchQuery=this.value; document.getElementById('content').innerHTML=renderGastos(this.value)"
      id="search-input">
    ${q ? `<span class="search-clear" onclick="_searchQuery='';document.getElementById('content').innerHTML=renderGastos('')">×</span>` : ''}
  </div>`;

  if (txs.length === 0) {
    return html + `<div class="empty" style="margin-top:40px"><div class="empty-icon">${q?'🔎':'📋'}</div><p>${q?`Sin resultados para "<b>${q}</b>"`:' Sin movimientos este mes.<br>Toca + para registrar.'}</p></div>`;
  }

  // Agrupar por fecha
  const byDate = {};
  txs.forEach(t => {
    const k = t.fecha || 'Sin fecha';
    if (!byDate[k]) byDate[k] = [];
    byDate[k].push(t);
  });

  Object.entries(byDate).forEach(([fecha, items]) => {
    html += `<div style="font-size:12px;color:var(--muted);padding:14px 4px 6px;text-transform:uppercase;letter-spacing:.6px">${fecha}</div>
    <div class="card" style="padding:0 16px">`;
    items.forEach(t => {
      const cat = getCat(t.cat);
      const pagoLabels = { efectivo:'💵 Efectivo', debito:'💳 Débito', credito:'🏦 Crédito' };
      const pagoBadge = (t.cat !== 'ingreso' && t.pago) ? `<span class="pago-badge ${t.pago}">${pagoLabels[t.pago]||t.pago}</span>` : '';
      const notaHtml = t.nota ? `<div class="tx-nota">💬 ${t.nota}</div>` : '';
      const recHtml = t.esRecurrente ? `<span style="font-size:9px;color:var(--accent)">🔁</span> ` : '';
      html += `<div class="tx-item" onclick="openEditTx('${t.id}')">
        <div class="tx-dot" style="background:${cat.color}">${cat.icon}</div>
        <div class="tx-info"><div class="tx-name">${recHtml}${t.desc||cat.name} ${pagoBadge}</div><div class="tx-cat">${cat.name}</div>${notaHtml}</div>
        <div class="tx-amt ${t.cat==='ingreso'?'ing':'gas'}">${t.cat==='ingreso'?'+':'-'}${fmt(t.monto)}</div>
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

// ── COMPARATIVA ENTRE MESES ──────────────────────────────────────────────────
function renderComparar() {
  const d = getData();

  // Obtener todos los meses con datos, ordenados
  const mesesConDatos = [...new Set(d.txs.map(t => t.month))]
    .filter(Boolean).sort();

  if (mesesConDatos.length === 0) {
    return `<div class="empty" style="margin-top:80px"><div class="empty-icon">📊</div><p>Sin datos aún.<br>Registra movimientos en al menos un mes.</p></div>`;
  }

  // Calcular totales por mes
  const resumenMeses = mesesConDatos.map(mk => {
    const txs = d.txs.filter(t => t.month === mk);
    const ingresos = txs.filter(t => t.cat === 'ingreso').reduce((a,t)=>a+t.monto,0);
    const gastos   = txs.filter(t => t.cat !== 'ingreso').reduce((a,t)=>a+t.monto,0);
    const credito  = txs.filter(t => t.cat !== 'ingreso' && t.pago === 'credito').reduce((a,t)=>a+t.monto,0);
    return { mk, ingresos, gastos, balance: ingresos - gastos, credito };
  }).reverse(); // más reciente primero

  const maxVal = Math.max(...resumenMeses.map(m => Math.max(m.ingresos, m.gastos)), 1);

  // ── GRÁFICO DE BARRAS SVG ──
  const n = Math.min(resumenMeses.length, 6);
  const mesesGrafico = resumenMeses.slice(0, n).reverse();
  const W = Math.max(n * 72, 280);
  const H = 130;
  const barW = 22;
  const gap = W / n;

  let bars = '';
  mesesGrafico.forEach((m, i) => {
    const x = i * gap + gap / 2;
    const hIng = m.ingresos > 0 ? Math.max((m.ingresos / maxVal) * (H - 30), 4) : 0;
    const hGas = m.gastos > 0   ? Math.max((m.gastos   / maxVal) * (H - 30), 4) : 0;
    const label = monthLabel(m.mk).slice(0,3) + '\n' + m.mk.slice(0,4);
    bars += `
      <rect x="${x - barW - 2}" y="${H - 20 - hIng}" width="${barW}" height="${hIng}" rx="4" fill="var(--green)" opacity=".85"/>
      <rect x="${x + 2}"         y="${H - 20 - hGas}" width="${barW}" height="${hGas}" rx="4" fill="var(--red)"   opacity=".75"/>
      <text x="${x}" y="${H - 4}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="Plus Jakarta Sans">${MONTHS[parseInt(m.mk.slice(5))-1].slice(0,3)}</text>
    `;
  });

  let html = `<div class="card">
    <div class="card-title">Evolución mensual</div>
    <div style="display:flex;gap:12px;margin-bottom:10px;font-size:11px">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--green);border-radius:3px;margin-right:4px;opacity:.85"></span>Ingresos</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--red);border-radius:3px;margin-right:4px;opacity:.75"></span>Gastos</span>
    </div>
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="display:block;min-width:${W}px">
        <line x1="0" y1="${H-20}" x2="${W}" y2="${H-20}" stroke="var(--border)" stroke-width="1"/>
        ${bars}
      </svg>
    </div>
  </div>`;

  // ── TABLA DE MESES ──
  html += `<div class="card"><div class="card-title">Detalle por mes</div>`;
  resumenMeses.forEach(m => {
    const isCurrent = m.mk === monthKey(d);
    const balPos = m.balance >= 0;
    const pctGas = m.ingresos > 0 ? Math.min(m.gastos / m.ingresos * 100, 100) : 0;
    html += `<div class="comp-month-row" onclick="setMonth('${m.mk}');showTab('resumen')" style="${isCurrent?'background:rgba(184,92,56,.04);border-radius:10px;padding:12px 8px;':''}">
      <div class="comp-month-label">
        <div style="font-weight:${isCurrent?'600':'400'};color:${isCurrent?'var(--accent)':'var(--text)'}">${MONTHS[parseInt(m.mk.slice(5))-1].slice(0,3)}</div>
        <div style="font-size:11px;color:var(--muted)">${m.mk.slice(0,4)}</div>
        ${isCurrent ? `<div style="font-size:9px;color:var(--accent);font-weight:600;margin-top:2px">ACTIVO</div>` : ''}
      </div>
      <div class="comp-bars">
        <div class="comp-bar-row">
          <div class="comp-bar-bg"><div class="comp-bar-fill" style="width:${m.ingresos/maxVal*100}%;background:var(--green)"></div></div>
          <div class="comp-val" style="color:var(--green)">${fmt(m.ingresos)}</div>
        </div>
        <div class="comp-bar-row">
          <div class="comp-bar-bg"><div class="comp-bar-fill" style="width:${pctGas}%;background:var(--red)"></div></div>
          <div class="comp-val" style="color:var(--red)">${fmt(m.gastos)}</div>
        </div>
        <div style="font-size:11px;color:${balPos?'var(--green)':'var(--red)'};margin-top:2px;font-weight:600;text-align:right">
          ${balPos?'▲':'▼'} ${fmt(Math.abs(m.balance))}
        </div>
      </div>
    </div>`;
  });
  html += `</div>`;

  // ── DESGLOSE CRÉDITO ──
  const creditoTotal = resumenMeses.reduce((a,m)=>a+m.credito,0);
  if (creditoTotal > 0) {
    html += `<div class="card"><div class="card-title">💳 Gastos en crédito por mes</div>`;
    const maxCred = Math.max(...resumenMeses.map(m=>m.credito),1);
    resumenMeses.filter(m=>m.credito>0).forEach(m => {
      const pct = m.credito / maxCred * 100;
      html += `<div class="credito-item">
        <div style="width:68px;font-size:12px;color:var(--muted)">${MONTHS[parseInt(m.mk.slice(5))-1].slice(0,3)} ${m.mk.slice(2,4)}</div>
        <div style="flex:1">
          <div class="comp-bar-bg"><div class="comp-bar-fill" style="width:${pct}%;background:var(--purple)"></div></div>
        </div>
        <div style="font-size:13px;font-weight:600;font-family:'Lora',serif;color:var(--purple);width:80px;text-align:right">${fmt(m.credito)}</div>
      </div>`;
    });
    html += `<div style="display:flex;justify-content:space-between;padding:10px 0 0;border-top:1px solid var(--border);margin-top:4px">
      <span style="font-size:13px;font-weight:600;color:var(--muted)">Total histórico en crédito</span>
      <span style="font-size:15px;font-weight:600;font-family:'Lora',serif;color:var(--purple)">${fmt(creditoTotal)}</span>
    </div></div>`;
  }

  // ── PROMEDIO MENSUAL ──
  const n2 = resumenMeses.length;
  if (n2 > 1) {
    const avgIng = resumenMeses.reduce((a,m)=>a+m.ingresos,0)/n2;
    const avgGas = resumenMeses.reduce((a,m)=>a+m.gastos,0)/n2;
    const mejorMes = [...resumenMeses].sort((a,b)=>b.balance-a.balance)[0];
    html += `<div class="card"><div class="card-title">Promedios (${n2} meses)</div>
      <div class="summary-grid" style="margin-bottom:10px">
        <div class="pill"><div class="pill-label">Ingreso prom.</div><div class="pill-val green">${fmt(avgIng)}</div></div>
        <div class="pill"><div class="pill-label">Gasto prom.</div><div class="pill-val red">${fmt(avgGas)}</div></div>
      </div>
      <div style="font-size:13px;color:var(--muted)">🏆 Mejor mes: <strong style="color:var(--green)">${monthLabel(mejorMes.mk)}</strong> · Balance ${fmt(mejorMes.balance)}</div>
    </div>`;
  }

  return html;
}

function renderMetas() {
  const d = getData();
  const ahorroHistorico = getAhorroHistorico(d);

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-top:4px">
    <span style="font-size:16px;font-weight:600">Mis metas</span>
    <button onclick="openAddMeta()" style="background:rgba(184,92,56,.12);border:1px solid rgba(184,92,56,.3);color:var(--accent);border-radius:10px;padding:7px 14px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;cursor:pointer;font-weight:600">+ Nueva</button>
  </div>`;

  // Resumen de ahorro disponible
  if (ahorroHistorico > 0) {
    html += `<div class="card" style="margin-bottom:14px;background:rgba(184,92,56,.06);border-color:rgba(184,92,56,.2)">
      <div class="card-title" style="color:var(--accent)">Ahorro total acumulado</div>
      <div style="font-size:24px;font-weight:600;font-family:'Lora',serif;color:var(--accent)">${fmt(ahorroHistorico)}</div>
      <div style="font-size:12px;color:var(--muted);margin-top:4px">Registrado en categoría Ahorro · todos los meses</div>
    </div>`;
  }

  if (d.metas.length === 0) {
    return html + `<div class="empty" style="margin-top:20px"><div class="empty-icon">🎯</div><p>Sin metas todavía.<br>Crea una para empezar.</p></div>`;
  }

  // Calcular cuánto ahorro ya está "comprometido" en metas vinculadas
  let ahorroComprometido = 0;
  d.metas.forEach(m => {
    if (m.vinculado) ahorroComprometido += (m.ahorroVinculado || 0);
  });

  d.metas.forEach(m => {
    const totalAhorrado = m.vinculado
      ? (m.baseAhorrado || 0) + (m.ahorroVinculado || 0)
      : (m.ahorrado || 0);
    const pct = m.objetivo > 0 ? Math.min(totalAhorrado / m.objetivo * 100, 100) : 0;
    const barColor = pct >= 100 ? 'green' : 'accent';
    const restante = Math.max(m.objetivo - totalAhorrado, 0);
    const mesesRestantes = m.mensual > 0 ? Math.ceil(restante / m.mensual) : null;

    html += `<div class="meta-card" onclick="openEditMeta('${m.id}')">
      <div class="meta-top">
        <div>
          <div class="meta-name">${m.emoji || '🎯'} ${m.nombre}</div>
          <span class="meta-badge ${m.vinculado ? 'linked' : 'manual'}">${m.vinculado ? '🔗 Vinculada al ahorro' : '✏️ Manual'}</span>
        </div>
        <div class="meta-pct">${pct.toFixed(0)}%</div>
      </div>
      <div class="prog-bar"><div class="prog-fill ${barColor}" style="width:${pct}%"></div></div>
      <div class="meta-nums">
        <span>${fmt(totalAhorrado)} ahorrado</span>
        <span>Objetivo: ${fmt(m.objetivo)}</span>
      </div>
      <div class="meta-saving-info" style="margin-top:10px">
        ${m.vinculado ? `
          <div class="meta-saving-row"><span>Base inicial</span><span>${fmt(m.baseAhorrado||0)}</span></div>
          <div class="meta-saving-row"><span>Ahorro vinculado</span><span style="color:var(--accent)">${fmt(m.ahorroVinculado||0)}</span></div>
          <div class="meta-saving-row" style="padding-top:6px;border-top:1px solid var(--border);margin-top:4px"><span style="font-weight:500;color:var(--text)">Falta para la meta</span><span style="color:${restante>0?'var(--yellow)':'var(--green)'};font-weight:600">${restante > 0 ? fmt(restante) : '🎉 ¡Completada!'}</span></div>
        ` : `
          <div class="meta-saving-row"><span>Ahorrado</span><span>${fmt(m.ahorrado||0)}</span></div>

function saveTx() {
  const monto = parseFloat(document.getElementById('f-monto').value);
  if (!monto || monto <= 0) { alert('Ingresa un monto válido'); return; }
  const d = getData();
  const fecha = document.getElementById('f-fecha').value;
  const [y,m,day] = fecha.split('-');
  const fechaLabel = `${parseInt(day)} ${MONTHS[parseInt(m)-1].slice(0,3)} ${y}`;
  const catId = txType === 'ing' ? 'ingreso' : document.getElementById('f-cat').value;
  const nota = (document.getElementById('f-nota') ? document.getElementById('f-nota').value.trim() : '') || '';
  const esRecurrente = document.getElementById('f-recurrente') ? document.getElementById('f-recurrente').checked : false;

  const tx = {
    id: Date.now().toString(),
    monto,
    desc: document.getElementById('f-desc').value.trim(),
    cat: catId,
    fecha: fechaLabel,
    month: monthKey(d),
    pago: txType === 'ing' ? null : txPago,
    nota: nota || null,
  };
  d.txs.push(tx);

  // Guardar como recurrente si se marcó
  if (esRecurrente) {
    d.recurrentes.push({
      id: 'rec_' + Date.now().toString(),
      monto,
      desc: tx.desc,
      cat: catId,
      pago: tx.pago,
      nota: tx.nota,
      tipo: txType,
      creadoEn: monthKey(d),
    });
  }

  if (catId === 'ahorro') actualizarMetasVinculadas(d, monto);

  save(d);
  closeSheet();
  showTab(currentTab);
}

// Distribuir ahorro nuevo entre metas vinculadas (en orden de creación)
function actualizarMetasVinculadas(d, montoNuevo) {
  let disponible = montoNuevo;
  d.metas.forEach(m => {
    if (!m.vinculado || disponible <= 0) return;
    const totalActual = (m.baseAhorrado || 0) + (m.ahorroVinculado || 0);
    const restante = Math.max(m.objetivo - totalActual, 0);
    if (restante <= 0) return;
    const aportar = Math.min(disponible, restante);
    m.ahorroVinculado = (m.ahorroVinculado || 0) + aportar;
    disponible -= aportar;
  });
}

// ── RECURRENTES: aplicar al inicio de un mes ──────────────────────────────────
function aplicarRecurrentesMes(d, mk) {
  if (!d.recurrentes || d.recurrentes.length === 0) return false;
  if (d.recurrentesAplicados[mk]) return false; // ya aplicados

  const now = new Date();
  const [y, m] = mk.split('-').map(Number);
  const diaLabel = `1 ${MONTHS[m-1].slice(0,3)} ${y}`;

  let aplicados = 0;
  d.recurrentes.forEach(r => {
    if (r.creadoEn === mk) return; // no aplicar en el mismo mes que se creó
    d.txs.push({
      id: `rec_${r.id}_${mk}`,
      monto: r.monto,
      desc: r.desc,
      cat: r.cat,
      fecha: diaLabel,
      month: mk,
      pago: r.pago,
      nota: r.nota,
      esRecurrente: true,
      recurrenteId: r.id,
    });
    aplicados++;
    if (r.cat === 'ahorro') actualizarMetasVinculadas(d, r.monto);
  });

  d.recurrentesAplicados[mk] = true;
  return aplicados > 0;
}

function saveEditTx(id) {
  const monto = parseFloat(document.getElementById('ef-monto').value);
  if (!monto || monto <= 0) { alert('Ingresa un monto válido'); return; }
  const d = getData();
  const t = d.txs.find(x => x.id === id);
  if (!t) return;

  const tipo = window._editTipo || (t.cat === 'ingreso' ? 'ing' : 'gas');
  const catId = tipo === 'ing' ? 'ingreso' : document.getElementById('ef-cat').value;

  const fechaVal = document.getElementById('ef-fecha').value;

function saveMeta() {
  const nombre = document.getElementById('m-nombre').value.trim();
  if (!nombre) { alert('Ingresa un nombre'); return; }
  const d = getData();
  const objetivo = parseFloat(document.getElementById('m-objetivo').value)||0;
  const ahorrado = parseFloat(document.getElementById('m-ahorrado').value)||0;
  const mensual  = parseFloat(document.getElementById('m-mensual').value)||0;

  if (editingMeta) {
    const m = d.metas.find(x => x.id === editingMeta);
    if (m) {
      m.nombre = nombre;
      m.emoji = document.getElementById('me-emoji') ? document.getElementById('me-emoji').value : (m.emoji||'🎯');
      m.objetivo = objetivo;
      m.mensual = mensual;
      if (m.vinculado) {
        m.baseAhorrado = ahorrado;
      } else {
        m.ahorrado = ahorrado;
      }
    }
  } else {
    const vinculado = document.getElementById('m-vinculado') ? document.getElementById('m-vinculado').checked : false;
    const emoji = document.getElementById('m-emoji') ? document.getElementById('m-emoji').value : '🎯';
    d.metas.push({
      id: Date.now().toString(),
      nombre,
      emoji: emoji || '🎯',
      objetivo,
      ahorrado: vinculado ? 0 : ahorrado,
      baseAhorrado: vinculado ? ahorrado : 0,
      ahorroVinculado: 0,
      mensual,
      vinculado,
    });
  }
  save(d);
  closeSheet();
  showTab('metas');
}

// ── CIERRE AUTOMÁTICO DE MES ──────────────────────────────────────────────────
function checkAutoMonthClose() {
  const d = getData();
  const now = new Date();
  const realKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const currentKey = monthKey(d);

  // Si el mes activo no es el mes real del calendario, preguntar si cambiar
  if (currentKey && currentKey !== realKey) {
    const [cy, cm] = currentKey.split('-').map(Number);
    const [ry, rm] = realKey.split('-').map(Number);
    const esAnterior = (cy < ry) || (cy === ry && cm < rm);
    if (esAnterior && !sessionStorage.getItem('monthCloseAsked_' + realKey)) {
      sessionStorage.setItem('monthCloseAsked_' + realKey, '1');
      setTimeout(() => {
        const banner = document.createElement('div');
        banner.id = 'month-close-banner';
        const mesLabel = monthLabel(currentKey);
        const nuevoLabel = monthLabel(realKey);
        banner.innerHTML = `
          <div style="flex:1">
            <div style="font-weight:600;font-size:13px">📅 Estamos en ${nuevoLabel}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">Aún tienes activo ${mesLabel}. ¿Cerrar y pasar al mes actual?</div>
          </div>
          <div style="display:flex;gap:8px;flex-shrink:0">
            <button onclick="document.getElementById('month-close-banner').remove()"
              style="background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer">Ahora no</button>
            <button onclick="setMonth('${realKey}');document.getElementById('month-close-banner').remove()"
              style="background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer">Cambiar</button>
          </div>`;
        banner.style.cssText = `position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);
          width:calc(100% - 32px);max-width:400px;background:var(--surface);border:1px solid var(--border);
          border-radius:16px;padding:14px 16px;z-index:999;display:flex;align-items:center;gap:12px;
          box-shadow:0 8px 32px rgba(44,36,22,.18);`;
        document.body.appendChild(banner);
      }, 1200);
    }
  }

  // Si el mes activo ES el mes real, asegurarse de que los recurrentes estén aplicados
  if (currentKey === realKey) {
    const aplicados = aplicarRecurrentesMes(d, realKey);
    if (aplicados) save(d);
  }
}

// ── COBROS (Personas que me deben) ───────────────────────────────────────────
function renderCobros() {
  const d = getData();
  const deudores = d.deudores || [];

  const totalPendiente = deudores.reduce((a, x) => {
    if (x.cobrado) return a;
    const abonado = (x.abonos || []).reduce((s, ab) => s + ab.monto, 0);
    return a + Math.max(x.monto - abonado, 0);
  }, 0);
  const totalCobrado = deudores.reduce((a, x) => {
    if (!x.cobrado) return a;
    return a + x.monto;
  }, 0);
  const countPendiente = deudores.filter(x => !x.cobrado).length;

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-top:4px">
    <span style="font-size:16px;font-weight:600">💸 Me deben</span>
    <button onclick="openAddDeudor()" style="background:rgba(192,131,10,.12);border:1px solid rgba(192,131,10,.3);color:var(--yellow);border-radius:10px;padding:7px 14px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;cursor:pointer;font-weight:600">+ Agregar</button>
  </div>`;

  if (deudores.length > 0) {
    html += `<div class="resumen-cobro">
      <div class="resumen-cobro-pill">
        <div class="val" style="color:var(--yellow)">${fmt(totalPendiente)}</div>
        <div class="lbl">Por cobrar</div>
      </div>
      <div class="resumen-cobro-pill">
        <div class="val" style="color:var(--green)">${fmt(totalCobrado)}</div>
        <div class="lbl">Cobrado</div>
      </div>
      <div class="resumen-cobro-pill">
        <div class="val" style="color:var(--muted)">${countPendiente}</div>
        <div class="lbl">Pendientes</div>
      </div>
    </div>`;
  }

  if (deudores.length === 0) {
    return html + `<div class="empty" style="margin-top:30px"><div class="empty-icon">🤝</div><p>Sin deudas registradas.<br>Toca + para agregar.</p></div>`;
  }

  // Pendientes primero
  const pendientes = deudores.filter(x => !x.cobrado);
  const cobrados   = deudores.filter(x => x.cobrado);

  if (pendientes.length > 0) {
    html += `<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:4px 2px 8px">Pendientes</div>`;
    pendientes.forEach(x => { html += renderDeudorCard(x); });
  }

  if (cobrados.length > 0) {
    html += `<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:14px 2px 8px">Cobrados ✓</div>`;
    cobrados.forEach(x => { html += renderDeudorCard(x); });
  }

  return html;
}

function renderDeudorCard(x) {
  const abonado = (x.abonos || []).reduce((s, ab) => s + ab.monto, 0);
  const restante = Math.max(x.monto - abonado, 0);
  const pct = x.monto > 0 ? Math.min((abonado / x.monto) * 100, 100) : 0;
  const inicial = x.nombre.trim().charAt(0).toUpperCase();

  let statusClass = 'pendiente', statusLabel = '⏳ Pendiente';
  if (x.cobrado) { statusClass = 'cobrado'; statusLabel = '✓ Cobrado'; }
  else if (abonado > 0) { statusClass = 'parcial'; statusLabel = `💧 Abonado ${fmt(abonado)}`; }

  let html = `<div class="deudor-card${x.cobrado?' pagado':''}" onclick="openEditDeudor('${x.id}')">
    <div class="deudor-top">
      <div class="deudor-avatar">${inicial}</div>
      <div class="deudor-info">
        <div class="deudor-nombre">${x.nombre}</div>
        ${x.desc ? `<div class="deudor-desc">${x.desc}</div>` : ''}
        <span class="deudor-status ${statusClass}">${statusLabel}</span>
      </div>
      <div class="deudor-monto">
        <div class="deudor-total${x.cobrado?' cobrado':''}">${fmt(restante > 0 ? restante : x.monto)}</div>
        <div class="deudor-fecha">${x.fecha || ''}</div>
      </div>
    </div>`;

  if (!x.cobrado && x.monto > 0 && abonado > 0) {
    html += `<div style="margin-top:12px">
      <div class="prog-bar"><div class="prog-fill accent" style="width:${pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:5px">
        <span>Abonado: ${fmt(abonado)}</span><span>Total: ${fmt(x.monto)}</span>
      </div>
    </div>`;
  }

  if (x.abonos && x.abonos.length > 0 && !x.cobrado) {
    html += `<div class="deudor-abonos">`;
    x.abonos.slice().reverse().forEach(ab => {
      html += `<div class="abono-row"><span>🟢 ${ab.fecha || 'Abono'}</span><span>+${fmt(ab.monto)}</span></div>`;
    });
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

function openAddDeudor() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('sheet-content').innerHTML = `
    <div class="sheet-title">💸 Nueva deuda</div>
    <div class="field"><label>Nombre de la persona</label><input type="text" id="d-nombre" placeholder="Ej: Juan Pérez"></div>
    <div class="field"><label>Motivo / descripción</label><input type="text" id="d-desc" placeholder="Ej: Préstamo para comida, Cuota viaje..."></div>
    <div class="field"><label>Monto total ($)</label><input type="number" id="d-monto" placeholder="0" inputmode="numeric"></div>
    <div class="field"><label>Fecha del préstamo</label><input type="date" id="d-fecha" value="${today}"></div>
    <button class="btn-primary" onclick="saveDeudor()">Guardar</button>
  `;
  openSheet();
}

function openEditDeudor(id) {
  const d = getData();
  const x = d.deudores.find(e => e.id === id);
  if (!x) return;
  const abonado = (x.abonos || []).reduce((s, ab) => s + ab.monto, 0);
  const restante = Math.max(x.monto - abonado, 0);

  let abonosHtml = '';
  if (x.abonos && x.abonos.length > 0) {
    abonosHtml = `<div style="margin-bottom:14px">
      <div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px">Historial de abonos</div>
      <div class="card" style="padding:0 16px;margin-bottom:0">`;
    x.abonos.slice().reverse().forEach(ab => {
      abonosHtml += `<div class="abono-row" style="padding:10px 0;border-bottom:1px solid var(--border)">
        <span>${ab.fecha || '—'} · ${ab.nota || 'Abono'}</span>
        <span>+${fmt(ab.monto)}</span>
      </div>`;
    });
    abonosHtml += `</div></div>`;
  }

  document.getElementById('sheet-content').innerHTML = `
    <div class="sheet-title">✏️ ${x.nombre}</div>
    <div class="summary-grid" style="margin-bottom:16px">
      <div class="pill"><div class="pill-label">Deuda total</div><div class="pill-val" style="color:var(--yellow)">${fmt(x.monto)}</div></div>
      <div class="pill"><div class="pill-label">${restante > 0 ? 'Pendiente' : '¡Cobrado!'}</div><div class="pill-val" style="color:${restante>0?'var(--red)':'var(--green)'}">${fmt(restante > 0 ? restante : x.monto)}</div></div>
    </div>
    ${!x.cobrado && restante > 0 ? `
    <div style="background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:14px;border:1px solid var(--border)">
      <div style="font-size:13px;font-weight:600;margin-bottom:10px">Registrar abono</div>
      <div class="field" style="margin-bottom:8px"><label>Monto del abono ($)</label><input type="number" id="ab-monto" placeholder="0" inputmode="numeric"></div>
      <div class="field" style="margin-bottom:8px"><label>Nota</label><input type="text" id="ab-nota" placeholder="Ej: Me pagó en efectivo..."></div>
      <button onclick="saveAbono('${id}')" style="width:100%;padding:11px;background:var(--green-bg);border:1px solid rgba(74,124,89,.3);color:var(--green);border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer">✓ Registrar abono</button>
    </div>
    ` : ''}
    ${abonosHtml}
    ${!x.cobrado ? `<button onclick="marcarCobrado('${id}')" style="width:100%;padding:12px;background:var(--green-bg);border:1px solid rgba(74,124,89,.3);color:var(--green);border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px">🎉 Marcar como cobrado</button>` : `<button onclick="marcarPendiente('${id}')" style="width:100%;padding:12px;background:var(--yellow-bg);border:1px solid rgba(192,131,10,.25);color:var(--yellow);border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;cursor:pointer;margin-bottom:10px">↩️ Reabrir deuda</button>`}
    <button class="btn-delete" style="width:100%" onclick="deleteDeudor('${id}')">🗑️ Eliminar registro</button>
  `;
  openSheet();
}

function saveDeudor() {
  const nombre = document.getElementById('d-nombre').value.trim();
  if (!nombre) { alert('Ingresa el nombre de la persona'); return; }
  const monto = parseFloat(document.getElementById('d-monto').value);
  if (!monto || monto <= 0) { alert('Ingresa un monto válido'); return; }
  const fecha = document.getElementById('d-fecha').value;
  const [y, m, day] = fecha.split('-');
  const fechaLabel = `${parseInt(day)} ${MONTHS[parseInt(m)-1].slice(0,3)} ${y}`;
  const d = getData();
  d.deudores.push({
    id: Date.now().toString(),
    nombre,
    desc: document.getElementById('d-desc').value.trim(),
    monto,
    fecha: fechaLabel,
    cobrado: false,
    abonos: [],
  });
  save(d);
  closeSheet();
  showTab('cobros');
}

function saveAbono(id) {
  const monto = parseFloat(document.getElementById('ab-monto').value);
  if (!monto || monto <= 0) { alert('Ingresa un monto válido'); return; }
  const nota = document.getElementById('ab-nota').value.trim();
  const today = new Date();
  const fechaLabel = `${today.getDate()} ${MONTHS[today.getMonth()].slice(0,3)} ${today.getFullYear()}`;
  const d = getData();
  const x = d.deudores.find(e => e.id === id);
  if (!x) return;
  if (!x.abonos) x.abonos = [];
  x.abonos.push({ monto, nota, fecha: fechaLabel });
  // Si el abono cubre el restante, marcar como cobrado automáticamente
  const abonado = x.abonos.reduce((s, ab) => s + ab.monto, 0);
  if (abonado >= x.monto) x.cobrado = true;
  save(d);
  closeSheet();
  showTab('cobros');
}

function marcarCobrado(id) {
  const d = getData();
  const x = d.deudores.find(e => e.id === id);
  if (x) x.cobrado = true;
  save(d);
  closeSheet();
  showTab('cobros');
}

function marcarPendiente(id) {
  const d = getData();
  const x = d.deudores.find(e => e.id === id);
  if (x) x.cobrado = false;
  save(d);
  closeSheet();
  showTab('cobros');
}

function deleteDeudor(id) {
  if (!confirm('¿Eliminar este registro?')) return;
  const d = getData();
  d.deudores = d.deudores.filter(e => e.id !== id);
  save(d);
  closeSheet();
  showTab('cobros');
}
// ── INIT ──────────────────────────────────────────────────────────────────────
// Auth handles init
// Si no hay sesión cacheada, ocultar app hasta que Firebase confirme
if (!getCachedSession()) {
  document.getElementById('app').style.display = 'none';
  document.getElementById('nav').style.display = 'none';
  document.getElementById('fab').style.display = 'none';
}

// ── PRESUPUESTO: COPIAR MES ANTERIOR ─────────────────────────────────────────
function getPrevMonthKey(key) {
  const [y, m] = key.split('-').map(Number);
  const d = new Date(y, m - 2, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function checkAndCopyLastMonthBudget() {
  const d = getData();
  const mk = monthKey(d);
  if (!mk) return;
  const currentPres = d.presupuestos[mk] || {};
  const hasPres = Object.values(currentPres).some(v => v > 0);
  if (hasPres) return; // Ya tiene presupuesto este mes

  const prevKey = getPrevMonthKey(mk);
  const prevPres = d.presupuestos[prevKey] || {};
  const hasPrev = Object.values(prevPres).some(v => v > 0);
  if (!hasPrev) return; // No hay mes anterior

  // Copiar automáticamente
  d.presupuestos[mk] = { ...prevPres };
  save(d);
  // Mostrar notificación suave
  setTimeout(() => {
    const banner = document.createElement('div');
    banner.innerHTML = `📋 Presupuesto copiado del mes anterior · <span onclick="this.parentElement.remove()" style="cursor:pointer;text-decoration:underline">Cerrar</span>`;
    banner.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--accent);color:var(--text);padding:10px 18px;border-radius:12px;font-size:13px;z-index:999;max-width:380px;text-align:center;box-shadow:0 4px 20px rgba(44,36,22,.15)';
    document.body.appendChild(banner);
    setTimeout(() => banner.remove(), 5000);
  }, 800);
}

// ── CUENTA DE USUARIO EN AJUSTES ──────────────────────────────────────────────

  const u = window.currentUser;
  return `<div class="card" style="margin-bottom:12px">
    <div class="card-title">Mi cuenta</div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
      ${u.photoURL ? `<img src="${u.photoURL}" style="width:42px;height:42px;border-radius:50%;border:2px solid var(--border)">` : `<div style="width:42px;height:42px;border-radius:50%;background:rgba(56,189,248,.2);display:flex;align-items:center;justify-content:center;font-size:20px">👤</div>`}
      <div>
        <div style="font-size:14px;font-weight:600">${u.displayName || 'Usuario'}</div>
        <div style="font-size:12px;color:var(--muted)">${u.email}</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
      <div style="width:8px;height:8px;border-radius:50%;background:var(--green)"></div>
      <span style="font-size:12px;color:var(--muted)">Datos sincronizados con Firebase</span>
    </div>
    <button onclick="doSignOut()" style="width:100%;padding:10px;background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.25);color:var(--red);border-radius:10px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;cursor:pointer">Cerrar sesión</button>
  </div>`;
}
window.currentUser = null;

document.addEventListener('DOMContentLoaded', () => {
  initDarkMode();

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {

    // ── Detectar nueva versión disponible ────────────────────────────────────
    reg.addEventListener('updatefound', () => {
      const newSW = reg.installing;
      newSW.addEventListener('statechange', () => {
        // Hay una nueva versión instalada y lista
        if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
          showUpdateBanner();
        }
      });
    });

    // Verificar actualizaciones cada vez que la app vuelve al primer plano
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        reg.update(); // comprueba silenciosamente si hay una versión nueva
      }
    });

  });

  // ── Escuchar mensajes del Service Worker ─────────────────────────────────
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data?.type === 'SW_VERSION') {
      console.log('App versión:', e.data.version);
    }
  });

  // ── Cuando el SW nuevo toma el control, recargar automáticamente ──────────
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) {
      refreshing = true;
      window.location.reload(); // recarga con la versión nueva
    }
  });
}

// ── Banner de actualización disponible ───────────────────────────────────────
function showUpdateBanner() {
  // Evitar duplicados
  if (document.getElementById('update-banner')) return;

  const banner = document.createElement('div');
  banner.id = 'update-banner';
  banner.style.cssText = `
    position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px; background: #fdfaf4;
    border-bottom: 2px solid #b85c38; color: #2c2416;
    padding: 12px 20px; z-index: 9999;
    display: flex; justify-content: space-between; align-items: center;
    font-family: Plus Jakarta Sans, sans-serif; font-size: 13px;
    box-shadow: 0 4px 20px rgba(44,36,22,.15);
  `;
  banner.innerHTML = `
    <span>🆕 Nueva versión disponible</span>
    <button onclick="applyUpdate()" style="
      background: #b85c38; color: #fff; border: none;
      border-radius: 8px; padding: 6px 14px;
      font-family: Plus Jakarta Sans, sans-serif; font-size: 13px;
      font-weight: 600; cursor: pointer;
    ">Actualizar</button>
  `;
  document.body.appendChild(banner);
}

// Forzar activación del nuevo SW y recargar
function applyUpdate() {
  navigator.serviceWorker.getRegistration().then(reg => {
    if (reg?.waiting) {
      reg.waiting.postMessage('SKIP_WAITING');
    }
    window.location.reload();
  });
}
</script>
