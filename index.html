      </div>
      <div id="f-pago-wrap">
        <label style="display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mu);font-weight:500;margin-bottom:7px">Medio de pago</label>
        <div class="pr">
          <button class="pb sc" id="p-cash" onclick="setPago('cash')"><em>💵</em>Efectivo</button>
          <button class="pb" id="p-debit" onclick="setPago('debit')"><em>💳</em>Débito</button>
          <button class="pb" id="p-credit" onclick="setPago('credit')"><em>🏦</em>Crédito</button>
        </div>
      </div>
      <div id="f-credit-panel" style="display:none"></div>
      <div id="f-meta-panel" style="display:none">
        <label style="display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--mu);font-weight:500;margin-bottom:8px">Abonar a meta</label>
        ${metas.length===0?`<div style="font-size:12px;color:var(--mu);margin-bottom:14px">Sin metas activas.</div>`:
          metas.map(m=>`<button id="ms-${m.id}" onclick="selMeta('${m.id}',this)" style="width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--rs);border:1.5px solid var(--bd);background:var(--s2);margin-bottom:8px;text-align:left;font-family:var(--fb);">
            <div id="mc-${m.id}" style="width:22px;height:22px;border-radius:50%;border:1.5px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0"></div>
            <div style="flex:1"><div style="font-size:13px;font-weight:500">${m.emoji||'🎯'} ${m.name}</div>
            <div style="font-size:11px;color:var(--mu)">${pct(m.saved||0,m.target)}% · faltan ${fmt(Math.max(m.target-(m.saved||0),0))}</div></div>
          </button>`).join('')}
      </div>
      <details class="more-opts">
        <summary>Más opciones (fecha, nota, repetir)</summary>
        <div class="fld" style="margin-top:14px"><label>Fecha</label><input type="date" id="f-dt" value="${today()}"></div>
        <div class="fld"><label>Nota (opcional)</label><input type="text" id="f-n" placeholder="Ej: cuota 3/12, con descuento..."></div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--s2);border-radius:var(--rs);margin-bottom:14px">
          <div><div style="font-size:13px;font-weight:500">🔁 Repetir cada mes</div><div style="font-size:11px;color:var(--mu);margin-top:2px">Se agrega automáticamente</div></div>
          <button onclick="swToggle(this)" data-on="0" id="sw-r" style="width:44px;height:24px;border-radius:99px;background:var(--bd);position:relative;flex-shrink:0">
            <span id="sw-k" style="position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:3px;left:3px;transition:.25s"></span>
          </button>
        </div>
      </details>
      <button class="btn btnp" onclick="saveTx()">Guardar</button>`;
  }

  // ── EDITAR MOVIMIENTO ───────────────────────────
  if(name==='edit-tx'){
    EID=data;
    const t=d.txs.find(x=>x.id===data);
    if(!t) return`<div class="stl">Error</div>`;
    const cat=getCat(t.cat);
    const pl={cash:'💵 Efectivo',debit:'💳 Débito',credit:'🏦 Crédito'}[t.pago]||'';
    return`<div class="stl">Editar movimiento</div>
      <div class="card" style="margin-bottom:16px"><div class="cb" style="text-align:center">
        <div style="font-size:32px;margin-bottom:8px">${cat.icon}</div>
        <div class="fn" style="font-size:22px;color:${t.type==='inc'?'var(--gn)':'var(--rd)'}">${t.type==='inc'?'+':'-'}${fmt(t.amount)}</div>
        <div style="font-size:13px;color:var(--mu);margin-top:4px">${t.desc||cat.name} · ${cat.name}</div>
        <div style="font-size:12px;color:var(--mu);margin-top:2px">${t.dateLabel||''} ${pl?'· '+pl:''}</div>
        ${t.note?`<div style="font-size:12px;color:var(--mu);font-style:italic;margin-top:4px">💬 ${t.note}</div>`:''}
      </div></div>
      <div class="fld"><label>Monto ($)</label><input type="text" id="e-a" value="${(t.amount||0).toLocaleString('es-CL')}" inputmode="numeric" oninput="onMoneyInput(this)"></div>
      <div class="fld"><label>Descripción</label><input type="text" id="e-d" value="${t.desc||''}"></div>
      <div class="fld"><label>Nota</label><input type="text" id="e-n" value="${t.note||''}"></div>
      <div class="fld"><label>Categoría</label><select id="e-c">
        ${cats.map(c=>`<option value="${c.id}" ${c.id===t.cat?'selected':''}>${c.icon} ${c.name}</option>`).join('')}
      </select></div>
      <div class="fld"><label>Medio de pago</label><select id="e-p">
        <option value="cash" ${t.pago==='cash'?'selected':''}>💵 Efectivo</option>
        <option value="debit" ${t.pago==='debit'?'selected':''}>💳 Débito</option>
        <option value="credit" ${t.pago==='credit'?'selected':''}>🏦 Crédito</option>
      </select></div>
      <div class="fld"><label>Fecha</label><input type="date" id="e-dt" value="${t.date||today()}"></div>
      <button class="btn btnp" onclick="updateTx()">Guardar cambios</button>
      <button class="btn btnd" onclick="deleteTx()">Eliminar movimiento</button>`;
  }

  // ── DETALLE CATEGORÍA ───────────────────────────
  if(name==='cat-detail'){
    const cat=getCat(data);
    const txs=mTxs(d,d.month).filter(t=>t.cat===data);
    const total=txs.reduce((a,t)=>a+t.amount,0);
    const budget=(d.budgets[d.month]||{})[data]||0;
    const p=pct(total,budget);
    return`<div class="stl">${cat.icon} ${cat.name}</div>
      <div style="text-align:center;padding:8px 0 16px">
        <div class="fn" style="font-size:36px;color:var(--rd)">${fmt(total)}</div>
        ${budget>0?`<div style="font-size:13px;color:var(--mu);margin-top:4px">de ${fmt(budget)} (${p}%)</div><div class="pg" style="margin:10px 0"><div class="pf ${p>=90?'r':p>=70?'y':'g'}" style="width:${p}%"></div></div>`:''}
      </div>
      ${txs.length===0?`<div class="empty"><div class="eico">📭</div><p>Sin movimientos.</p></div>`:txs.map(t=>txRow(t,true)).join('')}`;
  }

  // ── METAS ────────────────────────────────────────
  if(name==='add-goal'){
    const emojis=['🎯','🏖️','🚗','🏠','✈️','💻','🎓','💊','🐾','📚','💎','🎮','🏋️','👶','🌿'];
    return`<div class="stl">Nueva meta</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        ${emojis.map(e=>`<button data-em="${e}" onclick="selEm(this,'${e}')" style="font-size:22px;padding:6px;border-radius:8px;border:2px solid transparent;">${e}</button>`).join('')}
      </div>
      <div class="fld"><label>Nombre</label><input type="text" id="g-n" placeholder="Ej: Viaje, Fondo emergencia..."></div>
      <div class="fld"><label>Objetivo ($)</label><input type="text" id="g-t" placeholder="0" inputmode="numeric" oninput="onMoneyInput(this)"></div>
      <div class="fld"><label>Ya tengo ahorrado ($)</label><input type="text" id="g-s" value="0" inputmode="numeric" oninput="onMoneyInput(this)"></div>
      <button class="btn btnp" onclick="saveGoal()">Crear meta</button>`;
  }

  if(name==='edit-goal'){
    EID=data;
    const m=d.metas.find(x=>x.id===data);
    if(!m) return'';
    const p=pct(m.saved||0,m.target);
    const contrib=d.txs.filter(t=>t.cat==='savings'&&t.metaId===data).reduce((a,t)=>a+t.amount,0);
    return`<div class="stl">${m.emoji||'🎯'} ${m.name}</div>
      <div style="text-align:center;padding:8px 0 16px">
        <div class="fn" style="font-size:36px;color:var(--ac)">${p}%</div>
        <div style="font-size:14px;color:var(--mu);margin-top:4px">${fmt(m.saved||0)} de ${fmt(m.target)}</div>
        <div class="pg" style="margin:10px 0"><div class="pf a" style="width:${p}%"></div></div>
        ${contrib>0?`<div style="font-size:12px;color:var(--mu)">💰 ${fmt(contrib)} aportados desde movimientos</div>`:''}
      </div>
      <div class="fld"><label>Nombre</label><input type="text" id="g-n" value="${m.name}"></div>
      <div class="fld"><label>Objetivo ($)</label><input type="text" id="g-t" value="${(m.target||0).toLocaleString('es-CL')}" inputmode="numeric" oninput="onMoneyInput(this)"></div>
      <div class="fld"><label>Ahorrado hasta ahora ($)</label><input type="text" id="g-s" value="${(m.saved||0).toLocaleString('es-CL')}" inputmode="numeric" oninput="onMoneyInput(this)"></div>
      <button class="btn btnp" onclick="updateGoal()">Guardar</button>
      <button class="btn btng" onclick="markGoalDone('${data}')">${m.done?'↩️ Reabrir meta':'🎉 Marcar completada'}</button>
      <button class="btn btnd" onclick="deleteGoal('${data}')">Eliminar meta</button>`;
  }

  // ── COBROS ────────────────────────────────────────
  if(name==='cobros'){
    const pend=d.cobros.filter(c=>!c.done);
    const done2=d.cobros.filter(c=>c.done);
    let h=`<div class="stl">💸 Me deben</div>
      <button onclick="openSheet('add-cobro')" class="btn btnp" style="margin-bottom:16px">+ Agregar deuda</button>`;
    if(d.cobros.length===0){ h+=`<div class="empty"><div class="eico">🤝</div><p>Sin deudas registradas.</p></div><button class="btn btnp" onclick="openSheet('add-cobro')">+ Registrar deuda</button>`; return h; }
    pend.forEach(c=>h+=cobroCard(c));
    if(done2.length>0){ h+=`<div class="date-sep">✓ Cobrados</div>`; done2.forEach(c=>h+=cobroCard(c)); }
    return h;
  }
  if(name==='add-cobro'){
    return`<div class="stl">Agregar deuda</div>
      <div class="fld"><label>Nombre / quién debe</label><input type="text" id="co-n" placeholder="Ej: Juan, María..."></div>
      <div class="fld"><label>Monto ($)</label><input type="text" id="co-a" placeholder="0" inputmode="numeric" oninput="onMoneyInput(this)"></div>
      <div class="fld"><label>Motivo</label><input type="text" id="co-d" placeholder="Ej: Préstamo, cena..."></div>
      <div class="fld"><label>Fecha</label><input type="date" id="co-dt" value="${today()}"></div>
      <button class="btn btnp" onclick="saveCobro()">Guardar</button>`;
  }
  if(name==='edit-cobro'){
    EID=data;
    const c=d.cobros.find(x=>x.id===data);
    if(!c) return'';
    const paid=c.paid||0; const left=Math.max(c.amount-paid,0);
    return`<div class="stl">${c.name}</div>
      <div style="text-align:center;padding:8px 0 16px">
        <div class="fn" style="font-size:34px;color:var(--go)">${fmt(left||c.amount)}</div>
        <div style="font-size:13px;color:var(--mu);margin-top:4px">de ${fmt(c.amount)}${paid>0?` · ${fmt(paid)} ya cobrado`:''}</div>
        <div style="font-size:12px;color:var(--mu);margin-top:2px">${c.desc||''} · ${c.date||''}</div>
      </div>
      ${(c.abonos||[]).length>0?`<div class="card"><div class="cb"><div class="ct">Abonos</div>${(c.abonos||[]).map(a=>`<div class="row"><span style="font-size:13px">${a.date}</span><span class="fn" style="color:var(--gn)">${fmt(a.amount)}</span></div>`).join('')}</div></div>`:''}
      <div class="fld"><label>Registrar abono ($)</label><input type="text" id="co-ab" placeholder="0" inputmode="numeric" oninput="onMoneyInput(this)"></div>
      <button class="btn btnp" onclick="saveAbono('${data}')">✓ Registrar abono</button>
      <button class="btn btng" onclick="markCobrado('${data}')">${c.done?'↩️ Reabrir':'🎉 Marcar como cobrado'}</button>
      <button class="btn btnd" onclick="deleteCobro('${data}')">Eliminar</button>`;
  }

  // ── COMPARAR ──────────────────────────────────────
  if(name==='compare'){
    const allMks=[...new Set(d.txs.map(t=>t.month).filter(Boolean))].sort().reverse();
    if(allMks.length===0) return`<div class="stl">Comparar meses</div><div class="empty"><div class="eico">📊</div><p>Sin datos históricos.</p></div>`;
    const dm=allMks.slice(0,8).reverse().map(mk=>{
      const txs=d.txs.filter(t=>t.month===mk);
      const{inc,exp,bal}=totals(txs);
      const sav=txs.filter(t=>t.cat==='savings').reduce((a,t)=>a+t.amount,0);
      return{mk,inc,exp,bal,sav};
    });
    const mx=Math.max(...dm.map(m=>Math.max(m.inc,m.exp)),1);
    const avgInc=dm.reduce((a,m)=>a+m.inc,0)/dm.length;
    const avgExp=dm.reduce((a,m)=>a+m.exp,0)/dm.length;
    const best=[...dm].sort((a,b)=>b.bal-a.bal)[0];
    let h=`<div class="stl">Comparar meses</div>
      <div class="pills" style="margin-bottom:14px">
        <div class="pill"><div class="plb">Ingreso prom.</div><div class="pv g ff">${fmt(avgInc)}</div></div>
        <div class="pill"><div class="plb">Gasto prom.</div><div class="pv r ff">${fmt(avgExp)}</div></div>
      </div>
      <div style="font-size:12px;color:var(--mu);margin-bottom:14px">🏆 Mejor mes: <strong style="color:var(--gn)">${mlabel(best.mk)}</strong> · ${fmt(best.bal)}</div>`;
    [...dm].reverse().forEach(m=>{
      const isc=m.mk===d.month;
      h+=`<button class="crow" onclick="changeMonth('${m.mk}')" style="${isc?'background:var(--ad);border-radius:var(--rs);':''}">
        <div class="crlb"><div style="font-size:12px;font-weight:${isc?'600':'400'};color:${isc?'var(--ac)':'var(--tx)'}">${MS[parseInt(m.mk.slice(5))-1]}</div><div style="font-size:10px;color:var(--mu)">${m.mk.slice(0,4)}</div>${isc?`<div style="font-size:9px;color:var(--ac);font-weight:600">HOY</div>`:''}</div>
        <div class="crb">
          <div class="crbb"><div class="crbf" style="width:${pct(m.inc,mx)}%;background:var(--gn)"></div></div>
          <div class="crbb" style="margin-top:3px"><div class="crbf" style="width:${pct(m.exp,mx)}%;background:var(--rd)"></div></div>
          ${m.sav>0?`<div class="crbb" style="margin-top:3px"><div class="crbf" style="width:${pct(m.sav,mx)}%;background:var(--go)"></div></div>`:''}
        </div>
        <div style="text-align:right;flex-shrink:0;width:68px">
          <div class="fn" style="font-size:12px;color:var(--gn)">${fmt(m.inc)}</div>
          <div class="fn" style="font-size:12px;color:var(--rd)">${fmt(m.exp)}</div>
          <div style="font-size:11px;color:${m.bal>=0?'var(--gn)':'var(--rd)'};font-weight:600">${m.bal>=0?'▲':'▼'}${fmt(Math.abs(m.bal))}</div>
        </div>
      </button>`;
    });
    return h+`<div style="display:flex;gap:12px;font-size:11px;padding:12px 4px;color:var(--mu)"><span>▬ <span style="color:var(--gn)">Ingresos</span></span><span>▬ <span style="color:var(--rd)">Gastos</span></span><span>▬ <span style="color:var(--go)">Ahorro</span></span></div>`;
  }

  // ── CAMBIAR MES ───────────────────────────────────
  if(name==='change-month'){
    const allMks=[...new Set([...d.txs.map(t=>t.month).filter(Boolean),d.month,nowMk()])].sort().reverse();
    return`<div class="stl">Período activo</div>
      <div class="ibox">Al cambiar de mes, el anterior queda en solo lectura.</div>
      ${allMks.map(mk=>`<button onclick="changeMonth('${mk}')" style="width:100%;display:flex;justify-content:space-between;align-items:center;padding:14px;border-radius:var(--rs);border:1.5px solid ${mk===d.month?'var(--ac)':'var(--bd)'};background:${mk===d.month?'var(--ad)':'var(--sf)'};margin-bottom:8px;font-family:var(--fb);">
        <span style="font-size:14px;font-weight:${mk===d.month?'600':'400'};color:${mk===d.month?'var(--ac)':'var(--tx)'}">${mlabel(mk)}</span>
        ${mk===d.month?`<span style="font-size:11px;color:var(--ac)">● ACTIVO</span>`:''}
        ${mk===nowMk()&&mk!==d.month?`<span style="font-size:11px;color:var(--mu)">Mes actual</span>`:''}
      </button>`).join('')}
      <button onclick="openSheet('new-month')" class="btn btng">+ Abrir nuevo período</button>`;
  }
  if(name==='new-month'){
    return`<div class="stl">Nuevo período</div>
      <div class="fld"><label>Mes y año</label><input type="month" id="nm-v" value="${nowMk()}"></div>
      <button class="btn btnp" onclick="createMonth()">Abrir período</button>`;
  }

  // ── PRESUPUESTO ───────────────────────────────────
  if(name==='budgets'){
    const budget=d.budgets[d.month]||{};
    const expCats=cats.filter(c=>c.id!=='income');
    return`<div class="stl">Presupuesto<br><span style='font-size:14px;font-weight:400;color:var(--mu);font-style:normal'>${mlabel(d.month)}</span></div>
      <div class="ibox">Define cuánto quieres gastar en cada categoría.</div>
      ${expCats.map(cat=>`<div class="fld"><label>${cat.icon} ${cat.name}</label>
        <input type="text" id="b-${cat.id}" value="${budget[cat.id]||0}" placeholder="0" inputmode="numeric" oninput="onMoneyInput(this)">
      </div>`).join('')}
      <button class="btn btnp" onclick="saveBudgets()">Guardar presupuesto</button>`;
  }

  // ── CATEGORÍAS ────────────────────────────────────
  if(name==='cats'){
    let h=`<div class="stl">Categorías</div><div class="card"><div class="cb"><div class="ct">Predeterminadas</div>`;
    BASE_CATS.forEach(c=>{ h+=`<div class="row"><span>${c.icon} ${c.name}</span><span style="font-size:12px;color:var(--mu)">Base</span></div>`; });
    h+=`</div></div>`;
    if(d.cats.length>0){
      h+=`<div class="card"><div class="cb"><div class="ct">Personalizadas</div>`;
      d.cats.forEach(c=>{ h+=`<button class="li" onclick="openSheet('edit-cat','${c.id}')">
        <div class="lii" style="background:var(--s2)">${c.icon}</div>
        <div class="lin"><div class="lim">${c.name}</div></div>
        <div style="color:var(--mu);font-size:18px;flex-shrink:0">›</div>
      </button>`; });
      h+=`</div></div>`;
    }
    return h+`<button onclick="openSheet('add-cat')" class="btn btng">+ Nueva categoría</button>`;
  }
  if(name==='edit-cat'){
    const cat=d.cats.find(c=>c.id===data); if(!cat) return'';
    return`<div class="stl">Editar categoría</div>
      <div class="fld"><label>Emoji</label><input type="text" id="cat-ico" value="${cat.icon}" style="width:70px"></div>
      <div class="fld"><label>Nombre</label><input type="text" id="cat-nm" value="${cat.name}" placeholder="Ej: Mascotas, Ropa..."></div>
      <button class="btn btnp" onclick="saveCatEdit('${cat.id}')">Guardar cambios</button>
      <button class="btn btnd" style="margin-top:10px" onclick="delCat('${cat.id}')">Eliminar categoría</button>`;
  }
  if(name==='add-cat'){
    return`<div class="stl">Nueva categoría</div>
      <div class="fld"><label>Emoji</label><input type="text" id="cat-ico" value="📌" style="width:70px"></div>
      <div class="fld"><label>Nombre</label><input type="text" id="cat-nm" placeholder="Ej: Mascotas, Ropa..."></div>
      <button class="btn btnp" onclick="saveCat()">Crear</button>`;
  }

  // ── RECURRENTES ───────────────────────────────────
  if(name==='recur'){
    let h=`<div class="stl">🔁 Recurrentes</div><div class="ibox">Se agregan automáticamente al inicio de cada mes.</div>`;
    if(d.recur.length===0){ h+=`<div class="empty"><div class="eico">🔁</div><p>Sin recurrentes.<br>Activa la opción al crear un movimiento.</p></div>`; return h; }
    const recInc=d.recur.filter(r=>r.type==='inc').reduce((a,r)=>a+r.amount,0);
    const recExp=d.recur.filter(r=>r.type==='exp').reduce((a,r)=>a+r.amount,0);
    h+=`<div class="pills" style="margin-bottom:14px">
      <div class="pill"><div class="plb">Ingreso fijo/mes</div><div class="pv g ff">${fmt(recInc)}</div></div>
      <div class="pill"><div class="plb">Gasto fijo/mes</div><div class="pv r ff">${fmt(recExp)}</div></div>
    </div>`;
    d.recur.forEach(r=>{
      const cat=getCat(r.cat);
      h+=`<div class="row"><span>${cat.icon} ${r.desc||cat.name} · <span style="color:var(--mu)">${fmt(r.amount)}/mes</span></span><button onclick="delRecur('${r.id}')" style="color:var(--rd);font-size:20px;line-height:1;padding:4px">×</button></div>`;
    });
    return h;
  }

  // ── REPORTE MENSUAL IMPRIMIBLE ─────────────────────
  // Usa exactamente los mismos cálculos que Home (totals, categoryBreakdown)
  // para no tener una segunda fuente de verdad. El botón "Imprimir / PDF"
  // abre el diálogo nativo del navegador; en iOS Safari, Compartir → Imprimir
  // → pellizcar para previsualizar permite guardarlo como PDF sin librerías.
  if(name==='report'){
    const txs=mTxs(d,d.month);
    const{inc,exp,bankExp,creditExp,bankBal}=totals(txs);
    const{catData,legendRows}=categoryBreakdown(d);
    const budget=d.budgets[d.month]||{};
    const totalBudget=Object.values(budget).reduce((a,v)=>a+(v||0),0);
    const genDate=new Date().toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'});
    return`<div class="stl">🧾 Reporte mensual</div>
      <div class="ibox no-print">Genera un resumen listo para imprimir o guardar como PDF desde el navegador.</div>
      <div id="report-print">
        <div class="card"><div class="cb">
          <div class="ct">Bolsillo · ${mlabel(d.month)}</div>
          <div class="rpt-row"><span>Ingreso</span><span style="color:var(--gn);font-weight:700">${fmt(inc)}</span></div>
          <div class="rpt-row"><span>Gasto total (incl. TC)</span><span style="color:var(--rd);font-weight:700">${fmt(exp)}</span></div>
          ${creditExp>0?`<div class="rpt-row"><span style="color:var(--mu)">　de los cuales, tarjeta de crédito</span><span style="color:var(--mu)">${fmt(creditExp)}</span></div>`:''}
          <div class="rpt-row"><span>Saldo de cuenta</span><span style="color:${bankBal>=0?'var(--gn)':'var(--rd)'};font-weight:700">${fmt(bankBal)}</span></div>
          ${totalBudget>0?`<div class="rpt-row"><span>Presupuesto total</span><span style="font-weight:700">${fmt(totalBudget)}</span></div>`:''}
        </div></div>
        ${legendRows.length>0?`<div class="card" style="margin-top:12px"><div class="cb">
          <div class="ct">Gastos por categoría</div>
          ${legendRows.map(({name,spent})=>{
            const p=pct(spent,exp);
            return`<div class="rpt-row"><span>${name}</span><span>${fmt(spent)} · ${p}%</span></div>`;
          }).join('')}
        </div></div>`:''}
        ${catData.length>0?`<div class="card" style="margin-top:12px"><div class="cb">
          <div class="ct">Detalle de presupuesto</div>
          ${catData.map(({c,spent,b})=>`<div class="rpt-row"><span>${c.name}</span><span>${fmt(spent)}${b>0?' de '+fmt(b):''}</span></div>`).join('')}
        </div></div>`:''}
        <div style="font-size:10px;color:var(--mu);text-align:center;margin-top:14px">Generado el ${genDate} con Bolsillo</div>
      </div>
      <button class="btn btnp no-print" style="margin-top:16px" onclick="window.print()">🖨️ Imprimir / Guardar como PDF</button>`;
  }

  // ── TARJETA: WIZARD ───────────────────────────────
  if(name==='add-card-step1'){
    return`<div class="stl">Agregar tarjeta</div>
      <div style="font-size:13px;color:var(--mu);margin-bottom:20px">¿De qué banco es tu tarjeta?</div>
      <button class="wbk" onclick="openSheet('add-card-step2','Banco de Chile')">
        <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#2a1a00,#5a3800);display:flex;align-items:center;justify-content:center;font-size:24px">🏦</div>
        <div style="flex:1;text-align:left"><div style="font-size:15px;font-weight:500">Banco de Chile</div><div style="font-size:12px;color:var(--mu);margin-top:2px">Visa FAN, Dorada, Platinum, Signature...</div></div>
        <span style="color:var(--mu);font-size:22px">›</span>
      </button>
      <button class="wbk" onclick="openSheet('add-card-step2','Scotiabank Chile')">
        <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#1a0040,#3d0080);display:flex;align-items:center;justify-content:center;font-size:24px">🏦</div>
        <div style="flex:1;text-align:left"><div style="font-size:15px;font-weight:500">Scotiabank Chile</div><div style="font-size:12px;color:var(--mu);margin-top:2px">Gold Zero, Platinum, Signature, Black...</div></div>
        <span style="color:var(--mu);font-size:22px">›</span>
      </button>`;
  }
  if(name==='add-card-step2'){
    const banco=data;
    const tarjs=TARIFAS[banco]||[];
    return`<button onclick="openSheet('add-card-step1')" style="color:var(--ac);font-size:15px;margin-bottom:8px;display:block">‹ Volver</button>
      <div class="stl">Selecciona tu tarjeta</div>
      <div style="font-size:13px;color:var(--mu);margin-bottom:16px">${banco}</div>
      ${tarjs.map(t=>`<button class="wtc" onclick="openSheet('add-card-step3','${banco}||${t.tipo}')">
        <div class="tcp" style="background:linear-gradient(${ccGrad(t.tipo)})"></div>
        <div style="flex:1;text-align:left">
          <div style="font-size:14px;font-weight:500">${t.tipo}</div>
          <div style="font-size:11px;color:var(--mu);margin-top:2px">${t.mant===0?'✅ Sin mantención':`📅 UF ${t.mant.toFixed(2)}/mes`}${t.sem>0?` + UF ${t.sem.toFixed(2)} sem.`:''}</div>
        </div>
        <span style="color:var(--mu);font-size:20px">›</span>
      </button>`).join('')}`;
  }
  if(name==='add-card-step3'){
    const[banco,tipo]=data.split('||');
    const info=(TARIFAS[banco]||[]).find(t=>t.tipo===tipo)||{};
    const mantEst=Math.round((info.mant||0)*UF);
    return`<button onclick="openSheet('add-card-step2','${banco}')" style="color:var(--ac);font-size:15px;margin-bottom:8px;display:block">‹ Volver</button>
      <div class="stl">Configurar tarjeta</div>
      <div style="height:75px;border-radius:16px;background:linear-gradient(${ccGrad(tipo)});padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:18px;overflow:hidden;position:relative">
        <div style="position:absolute;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06);right:-20px;top:-20px;pointer-events:none"></div>
        <div style="font-size:9px;color:rgba(255,255,255,.6);letter-spacing:2px;text-transform:uppercase">${banco}</div>
        <div style="font-size:15px;font-weight:500;color:#fff">${tipo}</div>
      </div>
      <div class="ibox">
        ${info.mant===0?'✅ <strong>Sin mantención mensual</strong>.':`📅 Mantención: <strong>${fmt(mantEst)}/mes</strong>`}
        ${info.sem>0?` + <strong>${fmt(Math.round(info.sem*UF))}</strong> semestral.`:''}<br>
        💳 Tasa: <strong>${(info.tasa||1.5).toFixed(2)}%</strong> mensual.
      </div>
      <div class="fld"><label>Alias (opcional)</label><input type="text" id="wz-al" placeholder="Ej: Mi Visa Dorada"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="fld"><label>Día de corte</label><input type="number" id="wz-ct" value="5" min="1" max="28" inputmode="numeric"></div>
        <div class="fld"><label>Días al vencimiento</label><input type="number" id="wz-du" value="12" min="1" max="30" inputmode="numeric"></div>
      </div>
      <div class="fld"><label>Límite de crédito ($)</label><input type="text" id="wz-lm" value="0" inputmode="numeric" oninput="onMoneyInput(this)"></div>
      <button class="btn btnp" onclick="saveNewCard('${banco}','${tipo}')">Agregar tarjeta ✓</button>`;
  }

  // ── TARJETA: EDITAR ───────────────────────────────
  if(name==='edit-card'){
    EID=data;
    const card=d.cards.find(c=>c.id===data);
    if(!card) return'';
    return`<div class="stl">⚙️ ${card.alias||card.tipo}</div>
      <div class="fld"><label>Alias</label><input type="text" id="ec-al" value="${card.alias||''}"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="fld"><label>Día de corte</label><input type="number" id="ec-ct" value="${card.cut||5}" inputmode="numeric"></div>
        <div class="fld"><label>Días al vencimiento</label><input type="number" id="ec-du" value="${card.due||12}" inputmode="numeric"></div>
      </div>
      <div class="fld"><label>Límite de crédito ($)</label><input type="text" id="ec-lm" value="${(card.limit||0).toLocaleString('es-CL')}" inputmode="numeric" oninput="onMoneyInput(this)"></div>
      <button class="btn btnp" onclick="updateCard()">Guardar</button>
      ${d.cards.length>1?`<button class="btn btnd" onclick="deleteCard('${data}')">Eliminar tarjeta</button>`:''}`;
  }

  // ── TARJETA: AGREGAR COMPRA ───────────────────────
  if(name==='add-purchase'){
    const card=d.cards.find(c=>c.id===data);
    if(!card) return'';
    const EMOJIS=['🛍️','🛒','🏪','🍔','✈️','⛽','💊','🎬','📱','💻','👕','🏠','🚗','🎁','🔧','🌐'];
    const now=new Date();
    const defCyc=billingCycle(card);
    const cycs=[0,1,2,3].map(off=>{
      const dd=new Date(now.getFullYear(),now.getMonth()+off,1);
      const k=`${dd.getFullYear()}-${String(dd.getMonth()+1).padStart(2,'0')}`;
      return`<option value="${k}" ${k===defCyc?'selected':''}>${MS[dd.getMonth()]} ${dd.getFullYear()} (vence día ${(card.cut||5)+(card.due||12)})</option>`;
    }).join('');
    return`<div class="stl">Nueva compra · ${card.alias||card.tipo}</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
        ${EMOJIS.map(e=>`<button data-pe="${e}" onclick="selPEm(this,'${e}')" style="font-size:20px;padding:5px;border-radius:8px;border:2px solid transparent;">${e}</button>`).join('')}
      </div>
      <div class="fld"><label>Descripción</label><input type="text" id="pu-d" placeholder="Ej: TV, Ropa..."></div>
      <div class="fld"><label>Monto total ($)</label><input type="text" id="pu-a" placeholder="0" inputmode="numeric" oninput="onMoneyInput(this);prevPurch('${card.id}')"></div>
      <div class="fld"><label>Tipo</label>
        <select id="pu-t" onchange="prevPurch('${card.id}')">
          <option value="cash">Contado (sin cuotas)</option>
          <option value="no">Cuotas sin interés</option>
          <option value="yes">Cuotas con interés</option>
        </select>
      </div>
      <div class="fld" id="pu-iw" style="display:none"><label>Número de cuotas</label>
        <select id="pu-i" onchange="prevPurch('${card.id}')">
          ${[2,3,4,6,9,10,12,18,24,36,48].map(n=>`<option value="${n}">${n} cuotas</option>`).join('')}
        </select>
      </div>
      <div class="fld"><label>Ciclo de inicio (1ª cuota)</label><select id="pu-f">${cycs}</select></div>
      <div id="pu-pv"></div>
      <button class="btn btnp" onclick="savePurch('${card.id}')">Agregar compra</button>`;
  }

  // ── TARJETA: ESTADO ANTERIOR ──────────────────────
  if(name==='add-history'){
    const card=d.cards.find(c=>c.id===data);
    if(!card) return'';
    return`<div class="stl">📄 Estado de cuenta anterior</div>
      <div class="ibox">Ingresa compras o deudas en cuotas que aún tienes pendientes. Usa el mismo Nº de cuota que aparece en tu estado de cuenta (ej. "03/12").</div>
      <div class="fld"><label>Descripción</label><input type="text" id="h-d" placeholder="Ej: Refrigerador, Avance en efectivo..."></div>
      <div class="fld"><label>Monto total original ($)</label><input type="text" id="h-a" placeholder="0" inputmode="numeric" oninput="onMoneyInput(this);prevHist('${card.id}')"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="fld"><label>Total cuotas pactadas</label>
          <select id="h-i" onchange="prevHist('${card.id}')">
            ${[2,3,4,6,9,10,12,18,24,36,48].map(n=>`<option value="${n}">${n} cuotas</option>`).join('')}
          </select>
        </div>
        <div class="fld"><label>Vas en la cuota Nº</label><input type="number" id="h-cur" value="1" min="1" inputmode="numeric" oninput="prevHist('${card.id}')"></div>
      </div>
      <div class="fld"><label>Tipo</label>
        <select id="h-t" onchange="prevHist('${card.id}')">
          <option value="no">Sin interés</option><option value="yes">Con interés</option>
        </select>
      </div>
      <div id="h-pv"></div>
      <button class="btn btnp" onclick="saveHist('${card.id}')">Agregar</button>`;
  }

  // ── TARJETA: COTEJAR CON ESTADO DE CUENTA ─────────
  if(name==='reconcile-card'){
    const card=d.cards.find(c=>c.id===data);
    if(!card) return'';
    const mo=calcMonthly(card);
    const mantEst=Math.round((card.mant||0)*UF);
    return`<div class="stl">🧾 Cotejar con tu estado de cuenta</div>
      <div class="ibox">Ingresa el <strong>monto total facturado a pagar</strong> que aparece en tu EECC (sección "III. Información de pago"). Bolsillo lo compara al instante con lo que tienes registrado en este ciclo.</div>
      <div class="card" style="margin-bottom:16px"><div class="cb">
        <div class="row" style="border:none"><span>Calculado por Bolsillo este ciclo</span><span class="fn" style="color:var(--ac)">${fmt(mo.total)}</span></div>
      </div></div>
      <div class="fld"><label>Monto total facturado a pagar ($)</label><input type="text" id="rc-t" placeholder="0" inputmode="numeric" oninput="onMoneyInput(this);prevReconcile('${card.id}')"></div>
      <div class="fld"><label>Pagar hasta (fecha de vencimiento)</label><input type="date" id="rc-dt"></div>
      <details class="more-opts">
        <summary>Desglosar cargos reales (opcional)</summary>
        <div class="fld" style="margin-top:14px"><label>Mantención cobrada ($)</label><input type="text" id="rc-m" value="${mantEst.toLocaleString('es-CL')}" inputmode="numeric" oninput="onMoneyInput(this)"></div>
        <div class="fld"><label>Impuesto DL3475 cobrado ($)</label><input type="text" id="rc-x" value="${mo.tax.toLocaleString('es-CL')}" inputmode="numeric" oninput="onMoneyInput(this)"></div>
        <div class="fld"><label>Interés rotativo / avances / otros ($)</label><input type="text" id="rc-o" placeholder="0" inputmode="numeric" oninput="onMoneyInput(this)"></div>
      </details>
      <div id="rc-pv"></div>
      <button class="btn btnp" onclick="saveReconcile('${card.id}')">Guardar cotejo</button>
      ${(card.reconciliations||[]).length>0?reconcileHistory(card):''}`;
  }

  // ── TARJETA: EDITAR COMPRA ────────────────────────
  if(name==='edit-purchase'){
    const[cardId,purchId]=data.split('|');
    const card=d.cards.find(c=>c.id===cardId);
    const p=(card?.purchases||[]).find(x=>x.id===purchId);
    if(!p||!card) return'';
    const nk=billingCycle(card);
    const[py,pm]=p.from.split('-').map(Number);
    const[ny,nm]=nk.split('-').map(Number);
    const el=(ny-py)*12+(nm-pm); const cur=el+1; const rem=Math.max(p.installments-el,0);
    return`<div class="stl">${p.emoji||'🛍️'} ${p.desc}</div>
      <div style="text-align:center;padding:8px 0 16px">
        <div class="fn" style="font-size:28px">${fmt(p.amount)}</div>
        <div style="font-size:13px;color:var(--mu);margin-top:4px">${p.installments>1?`Cuota ${cur}/${p.installments} · ${rem} restantes`:'Pago único'}</div>
        <div class="fn" style="font-size:20px;color:var(--rd);margin-top:6px">${fmt(p.instAmt)}/mes</div>
        <div style="font-size:12px;color:var(--mu)">${fmt(p.instAmt*rem)} restante total</div>
      </div>
      <button class="btn btnd" onclick="delPurch('${cardId}','${purchId}')">Eliminar esta compra</button>`;
  }

  // ── GESTIONAR TARJETAS ────────────────────────────
  if(name==='manage-cards'){
    let h=`<div class="stl">Mis tarjetas</div>`;
    d.cards.forEach((card,i)=>{
      h+=`<button onclick="CC_IDX=${i};closeSheet();go('card')" style="width:100%;display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r);margin-bottom:10px;background:linear-gradient(${ccGrad(card.tipo)});border:none;text-align:left;font-family:var(--fb);box-shadow:var(--sh)">
        <div style="flex:1"><div style="font-size:14px;font-weight:600;color:#fff">${card.alias||card.tipo}</div><div style="font-size:11px;color:rgba(255,255,255,.65);margin-top:2px">${card.banco}</div></div>
        ${i===CC_IDX?`<span style="font-size:10px;background:rgba(255,255,255,.2);color:#fff;padding:3px 10px;border-radius:99px;font-weight:600">ACTIVA</span>`:`<span style="color:rgba(255,255,255,.5);font-size:14px">›</span>`}
      </button>`;
    });
    return h+`<button class="btn btng" onclick="openSheet('add-card-step1')">+ Agregar nueva tarjeta</button>`;
  }

  return`<div class="stl">En construcción</div>`;
}
</script>

<script>
// ══════════════════════════════════════════════════
// ACCIONES — mutación de datos
// ══════════════════════════════════════════════════

// ── Formulario nuevo movimiento ────────────────────
function setTxType(t){
  TXT=t;
  document.getElementById('b-exp').className='sb'+(t==='exp'?' sr':'');
  document.getElementById('b-inc').className='sb'+(t==='inc'?' sg':'');
  const amt=document.getElementById('f-a');
  if(amt)amt.className='amt-val '+(t==='inc'?'income':'expense');
  const cw=document.getElementById('f-cat-wrap');
  const pw=document.getElementById('f-pago-wrap');
  const cp=document.getElementById('f-credit-panel');
  const mp=document.getElementById('f-meta-panel');
  if(cw)cw.style.display=t==='inc'?'none':'block';
  if(pw)pw.style.display=t==='inc'?'none':'block';
  if(cp)cp.style.display='none';
  if(mp)mp.style.display='none';
}

function filterCatChips(q){
  q=q.toLowerCase().trim();
  document.querySelectorAll('#catgrid-box .catchip').forEach(b=>{
    b.style.display=(!q||b.dataset.name.includes(q))?'flex':'none';
  });
}

function selCatChip(el){
  document.querySelectorAll('.catchip').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  const catId=el.dataset.cat;
  document.getElementById('f-c').value=catId;
  const mp=document.getElementById('f-meta-panel');
  if(mp)mp.style.display=catId==='savings'?'block':'none';
}

function setPago(p){
  PAGO=p;
  ['cash','debit','credit'].forEach(x=>{
    const btn=document.getElementById('p-'+x);
    if(btn)btn.className='pb'+(x===p?' '+(x==='cash'?'sc':x==='debit'?'sd':'sk'):'');
  });
  const cp=document.getElementById('f-credit-panel');
  if(!cp)return;
  if(p==='credit'){
    const d=getData();
    if(d.cards.length===0){
      cp.innerHTML=`<div class="ibox">⚠️ Sin tarjetas. <button onclick="closeSheet();openSheet('add-card-step1')" style="color:var(--ac);font-weight:500">Agregar →</button></div>`;
      cp.style.display='block'; return;
    }
    const selCards=d.cards.length>1
      ?`<div class="fld"><label>¿Con qué tarjeta?</label><select id="cr-cs" onchange="updCrInfo()">${d.cards.map(c=>`<option value="${c.id}">${c.alias||c.tipo} · ${c.banco}</option>`).join('')}</select></div>`
      :`<input type="hidden" id="cr-cs" value="${d.cards[0].id}">`;
    cp.innerHTML=`<div style="background:var(--pd);border:1px solid rgba(112,84,168,.2);border-radius:var(--rs);padding:14px;margin-bottom:14px">
      <div style="font-size:11px;font-weight:600;color:var(--pu);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px">💳 Detalles de la compra</div>
      ${selCards}
      <div class="fld"><label>Tipo de cuotas</label>
        <select id="cr-ct" onchange="updCrInfo()">
          <option value="cash">Sin cuotas (cargo directo)</option>
          <option value="no">Cuotas sin interés</option>
          <option value="yes">Cuotas con interés</option>
        </select>
      </div>
      <div class="fld" id="cr-iw" style="display:none"><label>Número de cuotas</label>
        <select id="cr-ci" onchange="updCrInfo()">
          ${[2,3,4,6,9,10,12,18,24,36,48].map(n=>`<option value="${n}">${n} cuotas</option>`).join('')}
        </select>
      </div>
      <div id="cr-info"></div>
    </div>`;
    cp.style.display='block';
    updCrInfo();
  } else {
    cp.style.display='none';
    cp.innerHTML='';
  }
}

function updCrInfo(){
  const te=document.getElementById('cr-ct');
  const iw=document.getElementById('cr-iw');
  const ie=document.getElementById('cr-info');
  const ae=document.getElementById('f-a');
  if(!te||!ie)return;
  const type=te.value;
  if(iw)iw.style.display=type==='cash'?'none':'block';
  const amt=moneyVal('f-a');
  const inst=type==='cash'?1:(parseInt(document.getElementById('cr-ci')?.value)||2);
  if(amt<=0){ie.innerHTML='';return;}
  const d=getData();
  const cardId=document.getElementById('cr-cs')?.value;
  const card=d.cards.find(c=>c.id===cardId)||d.cards[0];
  if(!card)return;
  const rate=(card.tasa||1.5)/100; const S=0.0008;
  let monthly,interest=0;
  if(type==='cash'||type==='no'){monthly=amt/inst;}
  else{monthly=amt*(rate*Math.pow(1+rate,inst))/(Math.pow(1+rate,inst)-1);interest=monthly*inst-amt;}
  const stamps=inst>1?Math.round(amt*S*inst):0;
  const mant=Math.round((card.mant||0)*UF);
  ie.innerHTML=`<div style="background:var(--s2);border-radius:var(--rs);padding:12px;border:1px solid var(--bd)">
    <div style="font-size:11px;font-weight:600;color:var(--pu);margin-bottom:8px">${card.banco} · ${card.alias||card.tipo}</div>
    <div class="cr"><span>Cuota mensual</span><span class="fn" style="color:var(--ac)">${fmt(Math.round(monthly))}</span></div>
    ${stamps>0?`<div class="cr"><span>Timbres (DL3475)</span><span>${fmt(stamps)}</span></div>`:''}
    ${interest>0?`<div class="cr"><span style="color:var(--rd)">Interés total</span><span style="color:var(--rd)">${fmt(Math.round(interest))}</span></div>`:''}
    <div class="cr"><span>Mantención ${card.tipo}</span><span>${fmt(mant)}/mes</span></div>
    <div class="cr tot"><span>Total próximo estado</span><span>${fmt(Math.round(monthly+(inst>1?stamps:0)+mant))}</span></div>
    ${type==='yes'&&interest>0?`<div style="font-size:11px;color:var(--rd);margin-top:6px">⚠️ ${fmt(Math.round(interest+stamps))} extra por financiar</div>`:''}
  </div>`;
}

function onAmtCh(){if(PAGO==='credit')updCrInfo();}


function selMeta(id,el){
  SEL_META=id===SEL_META?null:id;
  document.querySelectorAll('[id^="ms-"]').forEach(b=>{

// Envío rápido de sobrante de presupuesto a la categoría Ahorro (versión
// ligera de "envelope budgeting"): registra directamente una transacción sin
// pasar por el formulario completo, reusando la misma forma de tx que saveTx.
function quickSaveSurplus(amount){
  amount=Math.round(amount);
  if(!amount||amount<=0)return;
  if(!confirm(`¿Registrar ${fmt(amount)} como ahorro de este mes?`))return;
  const d=getData();
  const tx={
    id:uid(),type:'exp',amount,cat:'savings',pago:'cash',
    desc:'Sobrante de presupuesto',note:'',
    date:today(),dateLabel:mkLabel(today()),month:d.month,
    metaId:null,isRecur:false,
  };
  d.txs.push(tx);
  save(d);go(TAB);
}

function saveTx(){
  const amt=moneyVal('f-a');
  if(!amt||amt<=0){alert('Ingresa un monto válido');return;}
  const d=getData();
  const dateVal=document.getElementById('f-dt')?.value||today();
  const catId=TXT==='inc'?'income':(document.getElementById('f-c')?.value||BASE_CATS[0].id);
  const isRec=document.getElementById('sw-r')?.dataset.on==='1';
  const tx={
    id:uid(),type:TXT,amount:amt,cat:catId,pago:TXT==='inc'?null:PAGO,
    desc:document.getElementById('f-d')?.value.trim()||'',
    note:document.getElementById('f-n')?.value.trim()||'',
    date:dateVal,dateLabel:mkLabel(dateVal),month:d.month,
    metaId:(catId==='savings'&&SEL_META)?SEL_META:null,isRecur:false,
  };
  d.txs.push(tx);
  // Abonar a meta
  if(catId==='savings'&&SEL_META){
    const meta=d.metas.find(m=>m.id===SEL_META);
    if(meta){meta.saved=(meta.saved||0)+amt;if(meta.saved>=meta.target)meta.done=true;}
  }
  // Recurrente
  if(isRec) d.recur.push({id:uid(),type:TXT,amount:amt,cat:catId,pago:tx.pago,desc:tx.desc,note:tx.note,startMonth:d.month});
  // Registro en tarjeta si pago con crédito
  if(TXT==='exp'&&PAGO==='credit'){
    const cardId=document.getElementById('cr-cs')?.value;
    const card=d.cards.find(c=>c.id===cardId)||d.cards[0];
    if(card){
      const crType=document.getElementById('cr-ct')?.value||'cash';
      const inst=crType==='cash'?1:(parseInt(document.getElementById('cr-ci')?.value)||1);
      const rate=(card.tasa||1.5)/100; const S=0.0008;
      let monthly;
      if(crType==='cash'||crType==='no'){monthly=Math.round(amt/inst);}
      else{monthly=Math.round(amt*(rate*Math.pow(1+rate,inst))/(Math.pow(1+rate,inst)-1));}
      const stamps=inst>1?Math.round(amt*S*inst):0;
      if(!card.purchases)card.purchases=[];
      card.purchases.push({id:uid(),desc:tx.desc||'Compra',amount:amt,type:crType,installments:inst,instAmt:monthly,stamps,from:billingCycle(card),emoji:'🛍️',active:true,fromTx:true});
    }
  }
  save(d);closeSheet();go(TAB);
}

  const d=getData();

function prevReconcile(cardId){
  const real=moneyVal('rc-t');
  const pv=document.getElementById('rc-pv');
  if(!pv)return;
  if(!real||real<=0){pv.innerHTML='';return;}
  const d=getData(); const card=d.cards.find(c=>c.id===cardId); if(!card)return;
  const mo=calcMonthly(card);
  const diff=real-mo.total;
  const abs=Math.abs(diff);
  const pctD=mo.total>0?((abs/mo.total)*100).toFixed(1):0;
  let msg;
  if(abs<=500) msg=`<div style="font-size:12px;color:var(--gn);margin-top:8px">✅ Calza con lo registrado en Bolsillo.</div>`;
  else if(diff>0) msg=`<div style="font-size:12px;color:var(--rd);margin-top:8px">⚠️ El banco cobra ${fmt(abs)} más (${pctD}%) de lo registrado. Puede ser una compra, avance o interés que falta ingresar este ciclo.</div>`;
  else msg=`<div style="font-size:12px;color:var(--gn);margin-top:8px">ℹ️ El banco cobra ${fmt(abs)} menos (${pctD}%) de lo registrado. Revisa si alguna cuota ya terminó o si mantención/impuesto estimados difieren.</div>`;
  pv.innerHTML=`<div class="calcbox">
    <div class="cr"><span>Calculado por Bolsillo</span><span>${fmt(mo.total)}</span></div>
    <div class="cr"><span>Real (tu EECC)</span><span>${fmt(real)}</span></div>
    <div class="cr tot"><span>Diferencia</span><span style="color:${abs<=500?'var(--gn)':'var(--rd)'}">${diff>0?'+':''}${fmt(diff)}</span></div>
    ${msg}
  </div>`;
}

async function fetchUF(){

    const n=new Date();
    const url=`https://mindicador.cl/api/uf/${String(n.getDate()).padStart(2,'0')}-${String(n.getMonth()+1).padStart(2,'0')}-${n.getFullYear()}`;
    const res=await fetch(url); if(!res.ok)return;
    const json=await res.json();
    const val=json?.serie?.[0]?.valor;
    if(val&&val>0){UF=Math.round(val);localStorage.setItem('uf_v',UF);}
  }catch(e){}
}

// ── AUTO MES ───────────────────────────────────────
function checkAutoMonth(){
  const d=getData(); const real=nowMk();
  if(d.month===real)return;
  const[dy,dm]=d.month.split('-').map(Number);
  const[ry,rm]=real.split('-').map(Number);
  if(dy>ry||(dy===ry&&dm>=rm))return;
  if(sessionStorage.getItem('ma_'+real))return;
  sessionStorage.setItem('ma_'+real,'1');
  setTimeout(()=>{
    const banner=document.createElement('div');
    banner.style.cssText=`position:fixed;bottom:calc(var(--nh)+12px);left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:400px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;z-index:200;display:flex;align-items:center;gap:12px;box-shadow:var(--sm)`;
    banner.innerHTML=`<div style="flex:1"><div style="font-size:13px;font-weight:500">📅 Estamos en ${mlabel(real)}</div><div style="font-size:11px;color:var(--mu);margin-top:2px">Activo: ${mlabel(d.month)}</div></div>
      <button onclick="changeMonth('${real}');this.parentElement.remove()" style="background:var(--ac);color:#fff;border-radius:var(--rs);padding:7px 14px;font-size:12px;font-weight:500;white-space:nowrap">Cambiar</button>
      <button onclick="this.parentElement.remove()" style="color:var(--mu);padding:6px;font-size:18px">×</button>`;
    document.body.appendChild(banner);
  },1000);
}

function copyPrevBudget(){
  const d=getData();
  if(Object.values(d.budgets[d.month]||{}).some(v=>v>0))return;
  const prev=prevMk(d.month);
  const pb=d.budgets[prev];
  if(!pb||!Object.values(pb).some(v=>v>0))return;
  d.budgets[d.month]={...pb};save(d);
}

// ── DARK MODE ──────────────────────────────────────


// Init UF desde localStorage
const _uf=parseFloat(localStorage.getItem('uf_v')||0);
if(_uf>0)UF=_uf;

</script>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app=initializeApp({
  apiKey:"AIzaSyBdozpKZrxC63eil14drCAJ1txISA702W0",
  authDomain:"mi-presupuesto-d12de.firebaseapp.com",
  projectId:"mi-presupuesto-d12de",
  storageBucket:"mi-presupuesto-d12de.firebasestorage.app",
  messagingSenderId:"418712208787",
  appId:"1:418712208787:web:2b4d769ba39c1c780c9466"
});
const auth=getAuth(app);
const db=getFirestore(app);
const SESS='bolsillo_sess';
let syncT=null,ready=false;

const getCached=()=>{try{return JSON.parse(localStorage.getItem(SESS)||'null')}catch(e){return null}};
const setCached=u=>u?localStorage.setItem(SESS,JSON.stringify({uid:u.uid,displayName:u.displayName,email:u.email})):localStorage.removeItem(SESS);

function showApp(user){
  window.currentUser=user;
  document.getElementById('login').style.display='none';
  const app=document.getElementById('app');
  app.style.display='flex';
  document.getElementById('nav').style.display='flex';
  document.getElementById('fab').style.display='flex';

}
function hideApp(){
  document.getElementById('login').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('nav').style.display='none';
  document.getElementById('fab').style.display='none';
  window.currentUser=null;
}

async function loadCloud(){
  if(!window.currentUser)return;
  try{
    const snap=await getDoc(doc(db,'usuarios',window.currentUser.uid));
    const local=JSON.parse(localStorage.getItem('bolsillo_v1')||'{}');
    if(snap.exists()){
      const remote=snap.data();
      const localTime=local.updatedAt||0;
      const remoteTime=remote.updatedAt||0;
      if(localTime>=remoteTime){
        // Lo local es igual o más reciente: nunca lo pisamos.
        // Si la nube está atrasada, la actualizamos con lo local (sin tocar la UI).
        if(remoteTime<localTime)saveCloud(local);
        return;
      }
      // La nube tiene una versión más reciente (ej: editaste desde otro dispositivo).
      // Se reemplaza el documento completo (última escritura gana), conservando
      // únicamente el mes que se estaba viendo en este dispositivo para no
      // descolocar al usuario en medio de su sesión.
      const merged={...remote};
      if(local.month)merged.month=local.month;
      localStorage.setItem('bolsillo_v1',JSON.stringify(merged));
      go(TAB);
    } else if(Object.keys(local).length>0){
      await saveCloud(local);
    }
  }catch(e){console.warn('Cloud load:',e);}
}

async function saveCloud(data){
  if(!window.currentUser)return;
  try{await setDoc(doc(db,'usuarios',window.currentUser.uid),data);}
  catch(e){console.error('No se pudo respaldar en la nube:',e);}
}

window._sync=function(){
  if(syncT)clearTimeout(syncT);
  syncT=setTimeout(()=>{
    syncT=null;
    const d=JSON.parse(localStorage.getItem('bolsillo_v1')||'{}');
    saveCloud(d);
  },2500);
};

// Si la app se va a segundo plano o se cierra con un guardado pendiente,
// lo subimos de inmediato para no perder los últimos cambios.
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'&&syncT){
    clearTimeout(syncT);syncT=null;
    const d=JSON.parse(localStorage.getItem('bolsillo_v1')||'{}');
    saveCloud(d);
  }
});

window.signInWithGoogle=async function(){
  const btn=document.getElementById('btn-google');
  const st=document.getElementById('ls');
  btn.style.opacity='.6';
  if(st)st.textContent='Conectando...';
  try{await signInWithPopup(auth,new GoogleAuthProvider());}
  catch(e){btn.style.opacity='1';if(st)st.textContent='Error al conectar. Intenta de nuevo.';}
};

window.doSignOut=async function(){
  setCached(null);await signOut(auth);hideApp();
};

// Inicio instantáneo con sesión cacheada
const cached=getCached();
if(cached){
  showApp(cached);
  copyPrevBudget();
  applyRecurrents();
  go('home');
  ready=true;
  setTimeout(checkAutoMonth,1500);
  setTimeout(fetchUF,2000);
}

onAuthStateChanged(auth,async user=>{
  if(user){
    setCached(user);
    showApp(user);
    if(!ready){
      await loadCloud();
      copyPrevBudget();
      applyRecurrents();
      go('home');
      ready=true;
      setTimeout(checkAutoMonth,1500);
      setTimeout(fetchUF,2000);
    } else {
      setTimeout(loadCloud,3000);
    }
  } else {
    if(!getCached())hideApp();
    ready=false;
  }
});
</script>
