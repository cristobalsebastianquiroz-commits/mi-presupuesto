<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Presupuesto">
<meta name="theme-color" content="#f5f0e8" id="meta-theme-color">
<title>Mi Presupuesto</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* ── Paleta acogedora ── */
    --bg:       #f5f0e8;          /* crema cálido */
    --surface:  #fdfaf4;          /* blanco marfil */
    --surface2: #ede8dd;          /* crema oscuro */
    --border:   #ddd5c4;          /* borde arena */
    --text:     #2c2416;          /* marrón oscuro */
    --muted:    #8c7d68;          /* marrón medio */
    --accent:   #b85c38;          /* terracota */
    --accent2:  #e8d5b7;          /* terracota claro */
    --green:    #4a7c59;          /* verde salvia */
    --green-bg: rgba(74,124,89,.12);
    --red:      #c0392b;          /* rojo ladrillo */
    --red-bg:   rgba(192,57,43,.1);
    --yellow:   #c0830a;          /* ámbar cálido */
    --yellow-bg:rgba(192,131,10,.12);
    --purple:   #7c6497;          /* lavanda */
    --safe: env(safe-area-inset-bottom, 0px);
    --radius: 16px;
    --shadow: 0 2px 12px rgba(44,36,22,.08);
    --shadow-md: 0 4px 24px rgba(44,36,22,.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow: hidden;
  }
  /* Aplicar modo oscuro inmediatamente antes que cargue JS (evita flash blanco) */
  html.dark-init body, html.dark-init #header, html.dark-init #nav, html.dark-init #content {
    background: #141414 !important;
    color: #f0ece4 !important;
    border-color: #2a2a2a !important;
  }

  /* ── LAYOUT ── */
  #app { display: flex; flex-direction: column; height: 100dvh; max-width: 430px; margin: 0 auto; position: relative; }
  #header {
    padding: 52px 20px 18px;
    background: var(--bg);
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }
  #content {
    flex: 1; overflow-y: auto;
    padding: 16px 16px;
    padding-bottom: calc(88px + var(--safe));
    -webkit-overflow-scrolling: touch;
    background: var(--bg);
  }
  #nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 430px;
    background: rgba(245,240,232,0.97);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 10px 0 calc(10px + var(--safe));
    z-index: 100;
    box-shadow: 0 -4px 20px rgba(44,36,22,.06);
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none;
    color: var(--muted);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 10px; cursor: pointer; padding: 4px 0;
    transition: color .2s;
    letter-spacing: .2px;
  }
  .nav-btn.active { color: var(--accent); }
  .nav-btn svg { width: 22px; height: 22px; }

  /* ── HEADER ── */
  .header-month {
    font-size: 12px; color: var(--muted);
    font-weight: 500; margin-bottom: 4px;
    text-transform: uppercase; letter-spacing: 1px;
    font-family: 'Plus Jakarta Sans', sans-serif;
  }
  .header-balance {
    font-size: 34px; font-weight: 600;
    letter-spacing: -1px;
    font-family: 'Lora', serif;
    color: var(--text);
  }
  .header-balance.pos { color: var(--green); }
  .header-balance.neg { color: var(--red); }
  .header-sub { font-size: 12px; color: var(--muted); margin-top: 5px; }

  /* ── CARDS ── */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .card-row { display: flex; justify-content: space-between; align-items: center; }
  .card-title {
    font-size: 10px; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted);
    margin-bottom: 12px; font-weight: 600;
  }

  /* ── SUMMARY PILLS ── */
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .pill {
    background: var(--surface);
    border-radius: 14px; padding: 14px 16px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
  }
  .pill-label { font-size: 11px; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  .pill-val { font-size: 20px; font-weight: 600; letter-spacing: -.5px; font-family: 'Lora', serif; }
  .pill-val.green { color: var(--green); }
  .pill-val.red { color: var(--red); }

  /* ── PROGRESS BAR ── */
  .prog-wrap { margin: 10px 0 4px; }
  .prog-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .prog-bar { height: 5px; background: var(--surface2); border-radius: 99px; overflow: hidden; }
  .prog-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }
  .prog-fill.green { background: var(--green); }
  .prog-fill.yellow { background: var(--yellow); }
  .prog-fill.red { background: var(--red); }
  .prog-fill.accent { background: var(--accent); }

  /* ── CATEGORY ITEMS ── */
  .cat-item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 0; border-bottom: 1px solid var(--border); cursor: pointer;
    transition: background .15s;
  }
  .cat-item:last-child { border-bottom: none; }
  .cat-icon {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .cat-info { flex: 1; }
  .cat-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .cat-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .cat-amt { text-align: right; }
  .cat-real { font-size: 15px; font-weight: 600; font-family: 'Lora', serif; }
  .cat-pres { font-size: 11px; color: var(--muted); margin-top: 1px; }

  /* ── TRANSACCIONES ── */
  .tx-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .tx-item:last-child { border-bottom: none; }
  .tx-dot {
    width: 38px; height: 38px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .tx-info { flex: 1; min-width: 0; }
  .tx-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-cat { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .tx-amt { font-size: 14px; font-weight: 600; font-family: 'Lora', serif; white-space: nowrap; }
  .tx-amt.ing { color: var(--green); }
  .tx-amt.gas { color: var(--red); }

  /* ── MODAL / SHEET ── */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(44,36,22,.45);
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity .25s;
    backdrop-filter: blur(2px);
  }
  .overlay.open { opacity: 1; pointer-events: all; }
  .sheet {
    position: fixed; bottom: 0; left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 100%; max-width: 430px;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 20px 20px calc(24px + var(--safe));
    z-index: 201;
    transition: transform .3s cubic-bezier(.32,1,.6,1);
    max-height: 90dvh; overflow-y: auto;
    box-shadow: 0 -8px 40px rgba(44,36,22,.15);
  }
  .sheet.open { transform: translateX(-50%) translateY(0); }
  .sheet-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 99px; margin: 0 auto 20px;
  }
  .sheet-title {
    font-size: 18px; font-weight: 600; margin-bottom: 20px;
    font-family: 'Lora', serif; color: var(--text);
  }

  /* ── FORM ELEMENTS ── */
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 11px; color: var(--muted);
    margin-bottom: 7px; text-transform: uppercase;
    letter-spacing: .8px; font-weight: 600;
  }
  .field input, .field select {
    width: 100%;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px; outline: none;
    -webkit-appearance: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(184,92,56,.12);
  }
  .field select option { background: var(--surface); }
  .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .type-btn {
    padding: 11px; border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--bg); color: var(--muted);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px; font-weight: 500; cursor: pointer;
    transition: all .2s;
  }
  .type-btn.active-ing { background: var(--green-bg); border-color: var(--green); color: var(--green); }
  .type-btn.active-gas { background: var(--red-bg); border-color: var(--red); color: var(--red); }
  .btn-primary {
    width: 100%; padding: 15px;
    background: var(--accent); color: #fff;
    border: none; border-radius: 14px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px;
    box-shadow: 0 4px 16px rgba(184,92,56,.3);
    transition: transform .1s, box-shadow .2s;
  }
  .btn-primary:active { transform: scale(.98); }
  .btn-secondary {
    width: 100%; padding: 13px;
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); border-radius: 14px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 15px; font-weight: 500; cursor: pointer; margin-top: 8px;
  }
  .btn-delete {
    background: var(--red-bg); color: var(--red);
    border: 1px solid rgba(192,57,43,.25);
    border-radius: 12px; padding: 10px 16px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14px; cursor: pointer;
  }

  /* ── METAS ── */
  .meta-card {
    background: var(--surface); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px;
    border: 1px solid var(--border);
    cursor: pointer; transition: border-color .2s, box-shadow .2s;
    box-shadow: var(--shadow);
  }
  .meta-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
  .meta-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .meta-name { font-size: 15px; font-weight: 500; color: var(--text); }
  .meta-pct { font-size: 22px; font-weight: 600; font-family: 'Lora', serif; color: var(--accent); }
  .meta-nums { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .meta-badge {
    display: inline-block; font-size: 10px;
    padding: 2px 9px; border-radius: 99px;
    font-weight: 600; margin-top: 5px;
    letter-spacing: .3px;
  }
  .meta-badge.linked { background: rgba(184,92,56,.12); color: var(--accent); border: 1px solid rgba(184,92,56,.25); }
  .meta-badge.manual { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }
  .meta-saving-info {
    margin-top: 10px; padding: 10px 12px;
    background: var(--bg); border-radius: 10px;
    border: 1px solid var(--border);
  }
  .meta-saving-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 3px 0; }
  .meta-saving-row span:first-child { color: var(--muted); }
  .meta-saving-row span:last-child { font-weight: 500; font-family: 'Lora', serif; }

  /* ── EMOJI PICKER ── */
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 8px; max-height: 140px; overflow-y: auto; }
  .emoji-opt { padding: 8px; border-radius: 8px; font-size: 20px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all .15s; }
  .emoji-opt:hover { background: var(--surface2); }
  .emoji-opt.selected { border-color: var(--accent); background: rgba(184,92,56,.1); }
  .color-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; }
  .color-opt { width: 100%; aspect-ratio: 1; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: all .15s; }
  .color-opt.selected { border-color: var(--text); transform: scale(1.1); }

  /* ── SETTINGS ── */
  .setting-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0; border-bottom: 1px solid var(--border);
  }
  .setting-row:last-child { border-bottom: none; }
  .setting-label { font-size: 14px; color: var(--text); }
  .setting-val { font-size: 13px; color: var(--accent); font-weight: 600; cursor: pointer; }
  .month-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .month-btn {
    padding: 10px 6px; border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg); color: var(--muted);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 13px; cursor: pointer; text-align: center;
    transition: all .15s;
  }
  .month-btn.active {
    background: rgba(184,92,56,.12);
    border-color: var(--accent); color: var(--accent); font-weight: 600;
  }

  /* ── FAB ── */
  .fab {
    position: fixed; bottom: calc(76px + var(--safe));
    right: calc(50% - 200px);
    width: 54px; height: 54px; border-radius: 50%;
    background: var(--accent); border: none;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(184,92,56,.45);
    cursor: pointer; z-index: 99;
    transition: transform .15s, box-shadow .2s;
  }
  .fab:active { transform: scale(.94); }
  .fab svg { width: 24px; height: 24px; color: #fff; }

  /* ── EMPTY ── */
  .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty-icon { font-size: 38px; margin-bottom: 12px; }
  .empty p { font-size: 14px; line-height: 1.7; }

  /* ── MONTH SELECTOR ── */
  .month-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .month-bar::-webkit-scrollbar { display: none; }
  .month-chip {
    flex-shrink: 0; padding: 6px 16px;
    border-radius: 99px; border: 1px solid var(--border);
    background: var(--surface); font-size: 13px;
    color: var(--muted); cursor: pointer; white-space: nowrap;
    font-weight: 500;
  }
  .month-chip.active {
    background: rgba(184,92,56,.12);
    border-color: var(--accent); color: var(--accent); font-weight: 600;
  }

  /* ── CAT MANAGE ── */
  .cat-manage-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .cat-manage-item:last-child { border-bottom: none; }
  .cat-manage-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .cat-manage-name { flex: 1; font-size: 14px; color: var(--text); }
  .cat-manage-actions { display: flex; gap: 8px; }
  .btn-icon { background: none; border: none; cursor: pointer; padding: 6px; border-radius: 8px; color: var(--muted); font-size: 14px; transition: all .15s; }
  .btn-icon:hover { background: var(--surface2); color: var(--text); }
  .btn-icon.del:hover { color: var(--red); }

  /* ── INFO BOX ── */
  .info-box {
    background: rgba(184,92,56,.06);
    border: 1px solid rgba(184,92,56,.18);
    border-radius: 12px; padding: 12px 14px;
    margin-bottom: 14px; font-size: 12px;
    color: var(--muted); line-height: 1.7;
  }
  .info-box strong { color: var(--accent); }

  /* ── DEUDORES ── */
  .deudor-card {
    background: var(--surface); border-radius: var(--radius);
    padding: 16px; margin-bottom: 10px;
    border: 1px solid var(--border);
    cursor: pointer; transition: border-color .2s, box-shadow .2s;
    box-shadow: var(--shadow);
  }
  .deudor-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
  .deudor-card.pagado { opacity: .55; border-style: dashed; }
  .deudor-top { display: flex; align-items: center; gap: 12px; }
  .deudor-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700; flex-shrink: 0;
    background: rgba(184,92,56,.15); color: var(--accent);
    font-family: 'Lora', serif;
  }
  .deudor-info { flex: 1; min-width: 0; }
  .deudor-nombre { font-size: 15px; font-weight: 600; color: var(--text); }
  .deudor-desc { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deudor-monto { text-align: right; }
  .deudor-total { font-size: 18px; font-weight: 600; font-family: 'Lora', serif; color: var(--yellow); }
  .deudor-total.cobrado { color: var(--green); }
  .deudor-fecha { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .deudor-abonos { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
  .abono-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
  .abono-row span:first-child { color: var(--muted); }
  .abono-row span:last-child { color: var(--green); font-family: 'Lora', serif; }
  .deudor-status {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10px; padding: 3px 9px;
    border-radius: 99px; font-weight: 600; margin-top: 8px;
    letter-spacing: .2px;
  }
  .deudor-status.pendiente { background: var(--yellow-bg); color: var(--yellow); border: 1px solid rgba(192,131,10,.25); }
  .deudor-status.cobrado { background: var(--green-bg); color: var(--green); border: 1px solid rgba(74,124,89,.25); }
  .deudor-status.parcial { background: rgba(184,92,56,.1); color: var(--accent); border: 1px solid rgba(184,92,56,.25); }
  .resumen-cobro { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .resumen-cobro-pill {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px; text-align: center;
    box-shadow: var(--shadow);
  }
  .resumen-cobro-pill .val { font-size: 16px; font-weight: 600; font-family: 'Lora', serif; margin-bottom: 3px; }
  .resumen-cobro-pill .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }

  /* ── MEDIO DE PAGO ── */
  .pago-toggle { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .pago-btn {
    padding: 10px 4px; border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--bg); color: var(--muted);
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 12px; font-weight: 500; cursor: pointer;
    transition: all .2s; text-align: center; line-height: 1.4;
  }
  .pago-btn .pago-icon { font-size: 18px; display: block; margin-bottom: 2px; }
  .pago-btn.active-efectivo { background: rgba(74,124,89,.12); border-color: var(--green); color: var(--green); }
  .pago-btn.active-debito   { background: rgba(184,92,56,.12);  border-color: var(--accent); color: var(--accent); }
  .pago-btn.active-credito  { background: rgba(124,100,151,.14); border-color: var(--purple); color: var(--purple); }

  /* Badge inline en lista de tx */
  .pago-badge {
    display: inline-block; font-size: 9px; padding: 1px 6px;
    border-radius: 99px; font-weight: 600; margin-left: 4px;
    vertical-align: middle; letter-spacing: .2px;
  }
  .pago-badge.efectivo { background: rgba(74,124,89,.12);  color: var(--green);  border: 1px solid rgba(74,124,89,.2); }
  .pago-badge.debito   { background: rgba(184,92,56,.1);   color: var(--accent); border: 1px solid rgba(184,92,56,.2); }
  .pago-badge.credito  { background: rgba(124,100,151,.12);color: var(--purple); border: 1px solid rgba(124,100,151,.2); }

  /* Card reporte medios de pago */
  .medio-pago-row {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 0; border-bottom: 1px solid var(--border);
  }
  .medio-pago-row:last-child { border-bottom: none; }
  .medio-pago-icon {
    width: 40px; height: 40px; border-radius: 12px;

  .meta-sel-info { flex: 1; }

<!-- Firebase -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyBdozpKZrxC63eil14drCAJ1txISA702W0",
  authDomain: "mi-presupuesto-d12de.firebaseapp.com",
  projectId: "mi-presupuesto-d12de",
  storageBucket: "mi-presupuesto-d12de.firebasestorage.app",
  messagingSenderId: "418712208787",
  appId: "1:418712208787:web:2b4d769ba39c1c780c9466"
};

const app = initializeApp(firebaseConfig);
// Persistencia LOCAL: la sesión se guarda en el dispositivo
// Firebase la lee al instante sin ir al servidor → login instantáneo
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser = null;
let syncTimeout = null;
let appReady = false;

// ── SESIÓN CACHEADA: mostrar app al instante si ya había sesión ──────────────
// Guardamos el uid y datos básicos del user en localStorage
// para mostrar la app sin esperar a Firebase la próxima vez
const CACHE_KEY = 'presupuesto_session';
function getCachedSession() {
  try { return JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch(e) { return null; }
}
function setCachedSession(user) {
  if (user) {
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      uid: user.uid,
      displayName: user.displayName,
      email: user.email,
      photoURL: user.photoURL,
    }));
  } else {
    localStorage.removeItem(CACHE_KEY);
  }
}

function showApp(user) {
  window.currentUser = user;
  currentUser = user;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('nav').style.display = 'flex';
  document.getElementById('fab').style.display = 'flex';
  document.getElementById('hdr-month').title = user.displayName || user.email;
}

function hideApp() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('nav').style.display = 'none';
  document.getElementById('fab').style.display = 'none';
}

// ── INICIO INSTANTÁNEO: si hay sesión cacheada, mostrar app de inmediato ─────
const cached = getCachedSession();
if (cached) {
  // Mostrar app al instante con datos locales sin esperar Firebase
  showApp(cached);
  checkAndCopyLastMonthBudget();
  showTab('resumen');
  appReady = true;
  setTimeout(checkAutoMonthClose, 1500);
}

// ── AUTH ──────────────────────────────────────────────────────────────────────
window.signInWithGoogle = async function() {
  const btn = document.getElementById('btn-google');
  const status = document.getElementById('login-status');
  btn.style.opacity = '0.6';
  status.textContent = 'Conectando...';
  try {
    const provider = new GoogleAuthProvider();
    // Usar redirect en móvil es más rápido que popup
    await signInWithPopup(auth, provider);
  } catch(e) {
    btn.style.opacity = '1';
    status.textContent = 'Error al iniciar sesión. Intenta de nuevo.';
    console.error(e);
  }
};

window.doSignOut = async function() {
  setCachedSession(null);
  await signOut(auth);
};

// Firebase confirma la sesión en segundo plano (no bloquea la UI)
onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (user) {
    setCachedSession(user); // actualizar cache con datos frescos
    showApp(user);
    // Solo sincronizar Firestore si la app no estaba ya lista (primera carga)
    if (!appReady) {
      await loadFromFirestore();
      checkAndCopyLastMonthBudget();
      showTab('resumen');
      appReady = true;
      setTimeout(checkAutoMonthClose, 1500);
      fetchUFActual(); // actualizar UF desde CMF
    } else {
      // Ya está mostrando datos locales, sincronizar en segundo plano silencioso
      syncFromFirestoreBackground();
    }
  } else {
    // Solo ocultar si no hay sesión cacheada válida
    if (!getCachedSession()) {
      hideApp();
    }
    appReady = false;
  }
});

// ── FIRESTORE SYNC ────────────────────────────────────────────────────────────
async function loadFromFirestore() {
  if (!currentUser) return;
  try {
    const ref = doc(db, 'usuarios', currentUser.uid);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      const remote = snap.data();
      const local = loadLocal();
      const merged = { ...remote, currentMonth: local.currentMonth || remote.currentMonth };
      saveLocal(merged);
    } else {
      const local = loadLocal();
      if (Object.keys(local).length > 0) {
        await saveToFirestore(local);
      }
    }
  } catch(e) {
    console.warn('Error loading from Firestore:', e);
  }
}

// Sincronización silenciosa en segundo plano (sin bloquear UI)
async function syncFromFirestoreBackground() {
  if (!currentUser) return;
  try {
    const ref = doc(db, 'usuarios', currentUser.uid);
    const snap = await getDoc(ref);
    if (snap.exists()) {
      const remote = snap.data();
      const local = loadLocal();
      // Solo actualizar si el remoto tiene más datos (evitar sobreescribir cambios locales recientes)
      const remoteCount = (remote.txs || []).length + (remote.metas || []).length;
      const localCount  = (local.txs  || []).length + (local.metas  || []).length;
      if (remoteCount > localCount) {
        const merged = { ...remote, currentMonth: local.currentMonth || remote.currentMonth };
        saveLocal(merged);
        // Refrescar UI silenciosamente
        showTab(window._currentTab || 'resumen');
      }
    }
  } catch(e) {
    // Fallo silencioso, no afecta al usuario
  }
}

async function saveToFirestore(data) {
  if (!currentUser) return;
  try {
    const ref = doc(db, 'usuarios', currentUser.uid);
    await setDoc(ref, data);
  } catch(e) {
    console.warn('Error saving to Firestore:', e);
  }
}

// Debounced sync: waits 1.5s after last change before uploading
window.scheduleSyncToFirestore = function() {
  if (syncTimeout) clearTimeout(syncTimeout);
  syncTimeout = setTimeout(() => {
    const d = loadLocal();
    saveToFirestore(d);
  }, 1500);
};
</script>

<script>
// ── CATEGORÍAS BASE (no borrable, siempre presentes) ─────────────────────────
const BASE_CATS = [
  { id:'ahorro',    name:'Ahorro',       icon:'💰', color:'rgba(167,139,250,.2)',  es:'gasto',   base:true },
  { id:'vivienda',  name:'Vivienda',     icon:'🏠', color:'rgba(56,189,248,.2)',   es:'gasto',   base:true },
  { id:'alimento',  name:'Alimentación', icon:'🍽️', color:'rgba(74,222,128,.2)',   es:'gasto',   base:true },
  { id:'transp',    name:'Transporte',   icon:'🚗', color:'rgba(251,191,36,.2)',   es:'gasto',   base:true },
  { id:'entret',    name:'Ocio',         icon:'🎬', color:'rgba(167,139,250,.2)',  es:'gasto',   base:true },
  { id:'deudas',    name:'Deudas',       icon:'💳', color:'rgba(248,113,113,.2)',  es:'gasto',   base:true },
  { id:'ingreso',   name:'Ingreso',      icon:'📥', color:'rgba(74,222,128,.2)',   es:'ingreso', base:true },
];

// Paleta de colores para categorías personalizadas
const CAT_COLORS = [
  'rgba(56,189,248,.25)',   // azul
  'rgba(74,222,128,.25)',   // verde
  'rgba(251,191,36,.25)',   // amarillo
  'rgba(248,113,113,.25)',  // rojo
  'rgba(167,139,250,.25)',  // morado
  'rgba(244,114,182,.25)',  // rosa
  'rgba(251,146,60,.25)',   // naranja
  'rgba(34,211,238,.25)',   // cyan
  'rgba(163,230,53,.25)',   // lima
  'rgba(209,213,219,.25)',  // gris
];

const CAT_EMOJIS = ['🏋️','✈️','🎓','💊','🐾','📚','💻','🎮','🛍️','☕','🎵','🏥','💇','🔧','🎁','🌿','🍺','🚀','🏊','🎨','📱','🏡','👶','🐶','⚡','🌊','🎯','💎','🎪','🎭'];

const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ── DATA ─────────────────────────────────────────────────────────────────────
function loadLocal() { try { return JSON.parse(localStorage.getItem('presupuesto_v1') || '{}'); } catch(e){ return {}; } }
function saveLocal(d) { localStorage.setItem('presupuesto_v1', JSON.stringify(d)); }
function load() { return loadLocal(); }
function save(d) {
  saveLocal(d);
  if (typeof window.scheduleSyncToFirestore === 'function') window.scheduleSyncToFirestore();
}

function getData() {
  let d = load();
  if (!d.txs) d.txs = [];
  if (!d.presupuestos) d.presupuestos = {};
  if (!d.metas) d.metas = [];
  if (!d.customCats) d.customCats = [];
  if (!d.deudores) d.deudores = [];
  if (!d.recurrentes) d.recurrentes = [];
  if (!d.recurrentesAplicados) d.recurrentesAplicados = {};
  if (!d.monthSnapshots) d.monthSnapshots = {};

  // Migrar tarjeta singular → array de tarjetas
  if (d.tarjeta && !d.tarjetas) {
    d.tarjetas = [{ ...d.tarjeta, id: 'tc_1', banco: 'Banco de Chile' }];
    delete d.tarjeta;
  }
  if (!d.tarjetas) {
    d.tarjetas = [{
      id: 'tc_1',
      banco: 'Banco de Chile',
      tipo: 'Visa Dorada',
      diaCorte: 5,
      diasVencimiento: 12,
      limiteCredito: 0,
      mantencionUF: 0.21,
      mantencionSemestralUF: 0,
      ufValue: 38500,
      compras: [],
      cargosExtra: [],
    }];
  }
  // Asegurar campos nuevos en tarjetas existentes
  d.tarjetas.forEach(tc => {
    if (!tc.id) tc.id = 'tc_' + Date.now();
    if (!tc.banco) tc.banco = 'Banco de Chile';
    if (!tc.compras) tc.compras = [];
    if (!tc.cargosExtra) tc.cargosExtra = [];
    if (tc.mantencionSemestralUF === undefined) tc.mantencionSemestralUF = 0;
  });

  if (!d.currentMonth) {
    const now = new Date();
    d.currentMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  }
  return d;
}

// Obtener TODAS las categorías (base + personalizadas)
function getAllCats() {
  const d = getData();
  return [...BASE_CATS, ...d.customCats];
}

let currentTab = 'resumen';
let editingMeta = null;
let editingCat = null;
let selectedEmoji = '🎯';
let selectedColor = CAT_COLORS[0];

// ── HELPERS ──────────────────────────────────────────────────────────────────
function fmt(n) {
  return '$' + Math.abs(Math.round(n)).toLocaleString('es-CL');
}
function fmtSigned(n) {
  return (n >= 0 ? '+' : '-') + '$' + Math.abs(Math.round(n)).toLocaleString('es-CL');
}
function monthKey(d) { return d.currentMonth || ''; }
function monthLabel(key) {
  if (!key) return '';
  const [y, m] = key.split('-');
  return MONTHS[parseInt(m)-1] + ' ' + y;
}
function getMonthTxs(d) {
  return d.txs.filter(t => t.month === monthKey(d));
}
function getCat(id) {
  return getAllCats().find(c => c.id === id) || BASE_CATS[0];
}

function getTotals(d) {
  const txs = getMonthTxs(d);
  const ingresos = txs.filter(t => t.cat === 'ingreso').reduce((a,t) => a + t.monto, 0);
  const gastos   = txs.filter(t => t.cat !== 'ingreso').reduce((a,t) => a + t.monto, 0);
  return { ingresos, gastos, balance: ingresos - gastos };
}

// Calcular cuánto se ha ahorrado REAL en el mes actual (categoría "ahorro")
function getAhorroReal(d) {
  const txs = getMonthTxs(d);
  return txs.filter(t => t.cat === 'ahorro').reduce((a,t) => a + t.monto, 0);
}

// Calcular total ahorrado histórico (todos los meses) en la categoría ahorro
function getAhorroHistorico(d) {
  return d.txs.filter(t => t.cat === 'ahorro').reduce((a,t) => a + t.monto, 0);
}

// Obtener total aportado a una meta específica (ahorros vinculados)
function getAportesMeta(d, metaId) {
  // Si la meta tiene aportación manual (campo ahorrado), suma ese + ahorros históricos si está vinculada
  const m = d.metas.find(x => x.id === metaId);
  if (!m) return 0;
  if (m.vinculado) {
    // Vinculada al ahorro real: base manual + ahorro acumulado desde creación
    return (m.baseAhorrado || 0) + (m.ahorroVinculado || 0);
  }
  return m.ahorrado || 0;
}

// ── HEADER ───────────────────────────────────────────────────────────────────
function updateHeader() {
  const d = getData();
  const { ingresos, gastos, balance } = getTotals(d);
  document.getElementById('hdr-month').textContent = monthLabel(monthKey(d));
  const hb = document.getElementById('hdr-balance');
  hb.textContent = fmt(Math.abs(balance));
  hb.className = 'header-balance ' + (balance >= 0 ? 'pos' : 'neg');
  document.getElementById('hdr-sub').textContent = balance >= 0
    ? `Disponible este mes · Ingresos ${fmt(ingresos)}`
    : `Déficit este mes · Gastos superan ingresos`;
}

// ── TABS ─────────────────────────────────────────────────────────────────────
function showTab(tab) {
  currentTab = tab;
  window._currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const tabBtn = document.getElementById('tab-'+tab);
  if (tabBtn) tabBtn.classList.add('active');
  // Marcar resumen activo por defecto si no hay tab activo
  else document.getElementById('tab-resumen').classList.add('active');

  const fab = document.getElementById('fab');
  fab.style.display = (tab === 'resumen' || tab === 'gastos') ? 'flex' : 'none';
  updateHeader();
  const c = document.getElementById('content');
  if (tab === 'resumen')   c.innerHTML = renderResumen();
  else if (tab === 'gastos')   c.innerHTML = renderGastos();
  else if (tab === 'comparar') c.innerHTML = renderComparar();
  else if (tab === 'metas')    c.innerHTML = renderMetas();
  else if (tab === 'tarjeta')  c.innerHTML = renderTarjeta();
  else if (tab === 'cobros')   c.innerHTML = renderCobros();
  else if (tab === 'config')   c.innerHTML = renderConfig();
  c.scrollTop = 0;
}

// ── RESUMEN ──────────────────────────────────────────────────────────────────
function renderResumen() {
  const d = getData();
  const { ingresos, gastos, balance } = getTotals(d);
  const pres = d.presupuestos[monthKey(d)] || {};
  const txs = getMonthTxs(d);
  const allCats = getAllCats();

  let html = `<div class="summary-grid">
    <div class="pill"><div class="pill-label">Ingresos</div><div class="pill-val green">${fmt(ingresos)}</div></div>
    <div class="pill"><div class="pill-label">Gastos</div><div class="pill-val red">${fmt(gastos)}</div></div>
  </div>`;

  // Gasto por categoría
  html += `<div class="card"><div class="card-title">Gastos por categoría</div>`;
  const catIds = allCats.filter(c => c.id !== 'ingreso');
  let hasAny = false;
  catIds.forEach(cat => {
    const total = txs.filter(t => t.cat === cat.id).reduce((a,t) => a + t.monto, 0);
    const pTotal = pres[cat.id] || 0;
    if (total === 0 && pTotal === 0) return;
    hasAny = true;
    const pct = pTotal > 0 ? Math.min(total / pTotal * 100, 100) : 0;
    const color = pct > 90 ? 'red' : pct > 70 ? 'yellow' : 'green';
    html += `<div class="cat-item" onclick="openCatDetail('${cat.id}')">
      <div class="cat-icon" style="background:${cat.color}">${cat.icon}</div>
      <div class="cat-info">
        <div class="cat-name">${cat.name}</div>
        ${pTotal > 0 ? `<div class="prog-wrap"><div class="prog-bar"><div class="prog-fill ${color}" style="width:${pct}%"></div></div></div>` : ''}
      </div>
      <div class="cat-amt">
        <div class="cat-real" style="color:var(--red)">${fmt(total)}</div>
        ${pTotal > 0 ? `<div class="cat-pres">de ${fmt(pTotal)}</div>` : ''}
      </div>
    </div>`;
  });
  if (!hasAny) html += `<div class="empty"><div class="empty-icon">📊</div><p>Sin gastos este mes.<br>Toca + para agregar.</p></div>`;
  html += `</div>`;

  // Tasa de ahorro
  if (ingresos > 0) {
    const tasa = (balance / ingresos * 100);
    const color = tasa >= 20 ? 'green' : tasa >= 10 ? 'yellow' : 'red';
    html += `<div class="card">
      <div class="card-title">Tasa de ahorro</div>
      <div class="prog-label"><span>Meta recomendada: 20%</span><span style="color:var(--text);font-weight:500">${tasa.toFixed(1)}%</span></div>
      <div class="prog-bar"><div class="prog-fill ${color}" style="width:${Math.max(0,Math.min(tasa,100))}%"></div></div>
      <div style="margin-top:10px;font-size:12px;color:var(--muted)">${tasa>=20?'🟢 Excelente, estás ahorrando sobre el 20%':tasa>=10?'🟡 Bien, pero intenta llegar al 20%':'🔴 Tus gastos superan lo recomendado'}</div>
    </div>`;
  }

  // Últimas transacciones
  const last = [...txs].reverse().slice(0, 5);
  if (last.length > 0) {
    html += `<div class="card"><div class="card-title">Últimos movimientos</div>`;
    last.forEach(t => {
      const cat = getCat(t.cat);
      html += `<div class="tx-item">
        <div class="tx-dot" style="background:${cat.color}">${cat.icon}</div>
        <div class="tx-info"><div class="tx-name">${t.desc||cat.name}</div><div class="tx-cat">${cat.name} · ${t.fecha||''}</div></div>
        <div class="tx-amt ${t.cat==='ingreso'?'ing':'gas'}">${t.cat==='ingreso'?'+':'-'}${fmt(t.monto)}</div>
      </div>`;
    });
    html += `</div>`;
  }

  // Reporte por medio de pago
  const gastosTxs = txs.filter(t => t.cat !== 'ingreso');
  if (gastosTxs.length > 0) {
    const medios = [
      { key: 'efectivo', icon: '💵', label: 'Efectivo',  bg: 'var(--green-bg)',              color: 'var(--green)'  },
      { key: 'debito',   icon: '💳', label: 'Débito',    bg: 'rgba(184,92,56,.1)',             color: 'var(--accent)' },
      { key: 'credito',  icon: '🏦', label: 'Crédito',   bg: 'rgba(124,100,151,.12)',          color: 'var(--purple)' },
    ];
    const sinMedio = gastosTxs.filter(t => !t.pago);
    html += `<div class="card"><div class="card-title">Gastos por medio de pago</div>`;

    let hayDatos = false;
    medios.forEach(m => {
      const mTxs = gastosTxs.filter(t => t.pago === m.key);
      if (mTxs.length === 0) return;
      hayDatos = true;
      const total = mTxs.reduce((a,t) => a + t.monto, 0);
      const pct = gastos > 0 ? (total / gastos * 100) : 0;
      html += `<div class="medio-pago-row">
        <div class="medio-pago-icon" style="background:${m.bg}">${m.icon}</div>
        <div class="medio-pago-info">
          <div class="medio-pago-name">${m.label}</div>
          <div class="medio-pago-count">${mTxs.length} movimiento${mTxs.length!==1?'s':''} · ${pct.toFixed(0)}% del total</div>
          <div class="prog-wrap" style="margin:6px 0 0">
            <div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${m.color}"></div></div>
          </div>
        </div>
        <div class="medio-pago-amt" style="color:${m.color}">${fmt(total)}</div>
      </div>`;
    });
    if (sinMedio.length > 0) {
      const total = sinMedio.reduce((a,t) => a + t.monto, 0);
      html += `<div class="medio-pago-row">
        <div class="medio-pago-icon" style="background:var(--surface2)">❓</div>
        <div class="medio-pago-info">
          <div class="medio-pago-name" style="color:var(--muted)">Sin clasificar</div>
          <div class="medio-pago-count">${sinMedio.length} movimiento${sinMedio.length!==1?'s':''}</div>
        </div>
        <div class="medio-pago-amt" style="color:var(--muted)">${fmt(total)}</div>
      </div>`;
    }
    if (!hayDatos && sinMedio.length === 0) {
      html += `<div style="text-align:center;padding:16px;font-size:13px;color:var(--muted)">Registra gastos para ver el reporte</div>`;
    }
    html += `</div>`;
  }

  return html;
}

// ── MOVIMIENTOS ──────────────────────────────────────────────────────────────
let _searchQuery = '';

function renderGastos(query) {
  const d = getData();
  const allTxs = getMonthTxs(d).slice().reverse();
  const q = (query !== undefined ? query : _searchQuery).toLowerCase().trim();
  const txs = q ? allTxs.filter(t => {
    const cat = getCat(t.cat);
    return (t.desc||'').toLowerCase().includes(q)
      || cat.name.toLowerCase().includes(q)
      || (t.nota||'').toLowerCase().includes(q)
      || (t.fecha||'').toLowerCase().includes(q);
  }) : allTxs;

  let html = `<div class="search-bar">
    <span style="font-size:16px;color:var(--muted)">🔍</span>
    <input type="text" placeholder="Buscar movimientos..." value="${q}"
      oninput="_searchQuery=this.value; document.getElementById('content').innerHTML=renderGastos(this.value)"
      id="search-input">
    ${q ? `<span class="search-clear" onclick="_searchQuery='';document.getElementById('content').innerHTML=renderGastos('')">×</span>` : ''}
  </div>`;

  if (txs.length === 0) {
    return html + `<div class="empty" style="margin-top:40px"><div class="empty-icon">${q?'🔎':'📋'}</div><p>${q?`Sin resultados para "<b>${q}</b>"`:' Sin movimientos este mes.<br>Toca + para registrar.'}</p></div>`;
  }

  // Agrupar por fecha
  const byDate = {};
  txs.forEach(t => {
    const k = t.fecha || 'Sin fecha';
    if (!byDate[k]) byDate[k] = [];
    byDate[k].push(t);
  });

  Object.entries(byDate).forEach(([fecha, items]) => {
    html += `<div style="font-size:12px;color:var(--muted);padding:14px 4px 6px;text-transform:uppercase;letter-spacing:.6px">${fecha}</div>
    <div class="card" style="padding:0 16px">`;
    items.forEach(t => {
      const cat = getCat(t.cat);
      const pagoLabels = { efectivo:'💵 Efectivo', debito:'💳 Débito', credito:'🏦 Crédito' };
      const pagoBadge = (t.cat !== 'ingreso' && t.pago) ? `<span class="pago-badge ${t.pago}">${pagoLabels[t.pago]||t.pago}</span>` : '';
      const notaHtml = t.nota ? `<div class="tx-nota">💬 ${t.nota}</div>` : '';
      const recHtml = t.esRecurrente ? `<span style="font-size:9px;color:var(--accent)">🔁</span> ` : '';
      html += `<div class="tx-item" onclick="openEditTx('${t.id}')">
        <div class="tx-dot" style="background:${cat.color}">${cat.icon}</div>
        <div class="tx-info"><div class="tx-name">${recHtml}${t.desc||cat.name} ${pagoBadge}</div><div class="tx-cat">${cat.name}</div>${notaHtml}</div>
        <div class="tx-amt ${t.cat==='ingreso'?'ing':'gas'}">${t.cat==='ingreso'?'+':'-'}${fmt(t.monto)}</div>
      </div>`;
    });
    html += `</div>`;
  });
  return html;
}

// ── TARJETA DE CRÉDITO BANCO DE CHILE ────────────────────────────────────────
// Tasa TMC referencial para cuotas con interés (Banco de Chile, actualizable)
// Fuente: CMF Chile — Tasa Máxima Convencional vigente ~2.2% mensual
const TC_TASA_MENSUAL_DEFAULT = 0.0220; // 2.20% mensual ≈ TMC crédito consumo
const TIMBRES_ESTAMPILLAS = 0.000800;   // Impuesto DL 3475: 0.066% × n° meses

function getTCData() {
  return getData().tarjeta;
}

// Calcula cuánto cae en un ciclo específico dado un array de compras
function calcCicloTC(compras, cargosExtra, tc, cicloKey) {
  // cicloKey = "YYYY-MM" del ciclo de facturación
  let totalCiclo = 0;
  const detalles = [];

  compras.forEach(c => {
    if (!c.activa) return;
    // Determinar cuántas cuotas han pasado hasta este ciclo
    const [cy, cm] = cicloKey.split('-').map(Number);
    const [py, pm] = c.cicloInicio.split('-').map(Number);
    const mesesTranscurridos = (cy - py) * 12 + (cm - pm);
    const cuotaActual = mesesTranscurridos + 1; // 1-based

    if (cuotaActual < 1 || cuotaActual > c.cuotas) return;

    let montoCuota = 0;
    if (c.tipo === 'contado') {
      if (cuotaActual === 1) montoCuota = c.monto;
    } else {
      montoCuota = c.montoCuota; // pre-calculado al guardar
    }

    // Impuesto timbres y estampillas (solo cuotas con plazo > 1)
    const timbres = c.cuotas > 1 ? Math.round(montoCuota * TIMBRES_ESTAMPILLAS * c.cuotas) : 0;
    const totalCuota = montoCuota + (cuotaActual === 1 ? timbres : 0);

    totalCiclo += montoCuota;
    detalles.push({ ...c, cuotaActual, montoCuota, timbres: cuotaActual === 1 ? timbres : 0 });
  });

  // ── MANTENCIÓN BANCO DE CHILE ──────────────────────────────────────────────
  // Banco de Chile cobra la mantención SIEMPRE, a todo evento, sin bonificación
  // por uso. Es un cargo fijo mensual independiente de si usas o no la tarjeta.
  // Fuente: tarifario oficial bancochile.cl
  const mantencion = Math.round(tc.mantencionUF * tc.ufValue);

  // Cargos extra del ciclo
  const cargos = cargosExtra.filter(x => x.activo);
  const totalCargos = cargos.reduce((a, x) => a + x.monto, 0);

  return {
    totalCompras: totalCiclo,
    mantencion,
    totalCargos,
    total: totalCiclo + mantencion + totalCargos,
    detalles,
    cargos,
  };
}

// Obtiene el ciclo actual y el siguiente según fecha de corte
function getCiclosTC(tc) {
  const now = new Date();
  const d = now.getDate();
  const m = now.getMonth() + 1;
  const y = now.getFullYear();

  // Si hoy ya pasó el día de corte, el ciclo activo es el del mes siguiente
  let cicloActivoMes = m;
  let cicloActivoAnio = y;
  if (d >= tc.diaCorte) {
    cicloActivoMes = m + 1;
    if (cicloActivoMes > 12) { cicloActivoMes = 1; cicloActivoAnio = y + 1; }
  }

  const ciclos = [];
  for (let i = 0; i < 4; i++) {
    let mm = cicloActivoMes + i;
    let yy = cicloActivoAnio;
    while (mm > 12) { mm -= 12; yy++; }
    const key = `${yy}-${String(mm).padStart(2,'0')}`;
    const fechaCorte = `${tc.diaCorte} ${MONTHS[mm-1].slice(0,3)} ${yy}`;
    const vencDate = new Date(yy, mm - 1 + (d >= tc.diaCorte ? 1 : 0), tc.diaCorte + tc.diasVencimiento);
    const fechaVenc = `${vencDate.getDate()} ${MONTHS[vencDate.getMonth()].slice(0,3)} ${vencDate.getFullYear()}`;
    ciclos.push({ key, label: MONTHS[mm-1] + ' ' + yy, fechaCorte, fechaVenc });
  }
  return ciclos;
}

  // Botón agregar tarjeta + config
  html+=`<div class="card">

}

function previewCuotaTC() {
  const tipo=document.getElementById('tc-tipo')?.value;
  const wrap=document.getElementById('tc-ncuotas-wrap');
  if(wrap) wrap.style.display=tipo!=='contado'?'block':'none';
  const monto=parseFloat(document.getElementById('tc-monto')?.value)||0;
  const cuotas=tipo==='contado'?1:(parseInt(document.getElementById('tc-ncuotas')?.value)||2);
  const prev=document.getElementById('tc-preview');
  if(!prev||monto<=0) return;
  const d=getData(); const tc=d.tarjetas.find(t=>t.id===_tcIdActualCompra)||d.tarjetas[0];
  const r=(tc.tasaMin||1.5)/100;
  let montoCuota;
  if(tipo==='contado'||tipo==='sin_interes') montoCuota=monto/cuotas;
  else montoCuota=monto*(r*Math.pow(1+r,cuotas))/(Math.pow(1+r,cuotas)-1);
  const timbres=cuotas>1?Math.round(monto*TIMBRES_ESTAMPILLAS*cuotas):0;
  const interes=tipo==='con_interes'?Math.round(montoCuota*cuotas-monto):0;
  prev.innerHTML=`<div class="credito-resumen">
    <div class="credito-resumen-row"><span>Valor cuota</span><span>${fmt(Math.round(montoCuota))} × ${cuotas}</span></div>
    ${timbres>0?`<div class="credito-resumen-row"><span>Timbres y estampillas (DL 3475)</span><span>${fmt(timbres)}</span></div>`:''}
    ${interes>0?`<div class="credito-resumen-row"><span style="color:var(--red)">Interés total</span><span style="color:var(--red)">${fmt(interes)}</span></div>`:''}
    <div class="credito-resumen-row highlight"><span>Total a pagar</span><span>${fmt(Math.round(montoCuota*cuotas+timbres))}</span></div>
    ${tipo==='sin_interes'?`<div style="font-size:11px;color:var(--green);margin-top:6px">✅ Sin interés — paga el total cada mes para mantener el beneficio</div>`:''}
    ${interes>0?`<div style="font-size:11px;color:var(--red);margin-top:6px">⚠️ Costo extra por financiar: ${fmt(interes+timbres)} (${((interes/monto)*100).toFixed(1)}% sobre el precio)</div>`:''}
  </div>`;
}

function saveCompraTC() {
  const desc=document.getElementById('tc-desc').value.trim();
  if(!desc){alert('Ingresa una descripción');return;}
  const monto=parseFloat(document.getElementById('tc-monto').value);
  if(!monto||monto<=0){alert('Ingresa un monto válido');return;}
  const tipo=document.getElementById('tc-tipo').value;
  const cuotas=tipo==='contado'?1:(parseInt(document.getElementById('tc-ncuotas')?.value)||2);
  const cicloInicio=document.getElementById('tc-ciclo').value;
  const d=getData();
  const tc=d.tarjetas.find(t=>t.id===_tcIdActualCompra)||d.tarjetas[0];
  const r=(tc.tasaMin||1.5)/100;
  let montoCuota;
  if(tipo==='contado'||tipo==='sin_interes') montoCuota=Math.round(monto/cuotas);
  else montoCuota=Math.round(monto*(r*Math.pow(1+r,cuotas))/(Math.pow(1+r,cuotas)-1));
  const timbres=cuotas>1?Math.round(monto*TIMBRES_ESTAMPILLAS*cuotas):0;
  tc.compras.push({id:Date.now().toString(),desc,monto,tipo,cuotas,cicloInicio,montoCuota,timbres,emoji:window._tcEmojiSelected||'🛍️',activa:true});

}

function previewEstadoCuenta() {
  const monto=parseFloat(document.getElementById('ec-monto')?.value)||0;
  const total=parseInt(document.getElementById('ec-cuotas-total')?.value)||2;
  const pagadas=parseInt(document.getElementById('ec-cuotas-pagadas')?.value)||1;
  const tipo=document.getElementById('ec-tipo')?.value||'sin_interes';
  const prev=document.getElementById('ec-preview');
  if(!prev||monto<=0) return;
  const d=getData(); const tc=d.tarjetas.find(t=>t.id===_tcIdActualCompra)||d.tarjetas[0];
  const r=(tc.tasaMin||1.5)/100;
  let montoCuota;
  if(tipo==='sin_interes') montoCuota=Math.round(monto/total);
  else montoCuota=Math.round(monto*(r*Math.pow(1+r,total))/(Math.pow(1+r,total)-1));
  const restantes=Math.max(total-pagadas,0);
  prev.innerHTML=`<div class="credito-resumen">
    <div class="credito-resumen-row"><span>Cuota mensual</span><span>${fmt(montoCuota)}/mes</span></div>
    <div class="credito-resumen-row"><span>Cuotas restantes</span><span>${restantes}</span></div>
    <div class="credito-resumen-row highlight"><span>Deuda pendiente total</span><span>${fmt(montoCuota*restantes)}</span></div>
  </div>`;
}

function saveEstadoCuenta() {
  const desc=document.getElementById('ec-desc').value.trim();
  if(!desc){alert('Ingresa una descripción');return;}
  const monto=parseFloat(document.getElementById('ec-monto').value)||0;
  if(!monto){alert('Ingresa un monto');return;}
  const total=parseInt(document.getElementById('ec-cuotas-total').value)||2;
  const tipo=document.getElementById('ec-tipo').value;
  const inicio=document.getElementById('ec-inicio').value;
  const d=getData(); const tc=d.tarjetas.find(t=>t.id===_tcIdActualCompra)||d.tarjetas[0];
  const r=(tc.tasaMin||1.5)/100;
  let montoCuota;
  if(tipo==='sin_interes') montoCuota=Math.round(monto/total);
  else montoCuota=Math.round(monto*(r*Math.pow(1+r,total))/(Math.pow(1+r,total)-1));

function calcCuotasTC() {
  const monto=parseFloat(document.getElementById('calc-monto').value)||0;
  const cuotas=parseInt(document.getElementById('calc-cuotas').value)||1;
  const tipo=document.getElementById('calc-tipo').value;
  const el=document.getElementById('calc-resultado');
  if(!el||monto<=0){if(el)el.innerHTML='';return;}
  const d=getData();
  const tc=d.tarjetas[_tcTabActiva||0]||d.tarjetas[0];
  const r=(tc.tasaMin||1.5)/100;
  let montoCuota,interesTotal;
  if(cuotas===1||tipo==='sin_interes'){montoCuota=monto/cuotas;interesTotal=0;}
  else{montoCuota=monto*(r*Math.pow(1+r,cuotas))/(Math.pow(1+r,cuotas)-1);interesTotal=montoCuota*cuotas-monto;}
  const totalPagar=montoCuota*cuotas;
  const timbres=cuotas>1?monto*TIMBRES_ESTAMPILLAS*cuotas:0;
  el.innerHTML=`<div class="calc-result">
    <div class="calc-row"><span>Valor cuota</span><span style="font-weight:600;color:var(--accent)">${fmt(Math.round(montoCuota))}</span></div>
    <div class="calc-row"><span>Monto original</span><span>${fmt(monto)}</span></div>
    ${interesTotal>0?`<div class="calc-row"><span>Interés total</span><span style="color:var(--red)">${fmt(Math.round(interesTotal))}</span></div>`:''}
    ${timbres>0?`<div class="calc-row"><span>Timbres y estampillas</span><span style="color:var(--muted)">${fmt(Math.round(timbres))}</span></div>`:''}
    <div class="calc-row total"><span>Total real a pagar</span><span style="color:var(--text)">${fmt(Math.round(totalPagar+timbres))}</span></div>
    ${tipo==='sin_interes'&&cuotas>1?`<div style="font-size:11px;color:var(--green);margin-top:8px">✅ Sin interés — paga el estado completo cada mes para no perder el beneficio</div>`:''}
    ${interesTotal>0?`<div style="font-size:11px;color:var(--red);margin-top:8px">⚠️ Financiar te cuesta ${fmt(Math.round(interesTotal+timbres))} extra (${((interesTotal/monto)*100).toFixed(1)}% del precio)</div>`:''}
  </div>`;
}

function renderComparar() {
  const d = getData();

  // Obtener todos los meses con datos, ordenados
  const mesesConDatos = [...new Set(d.txs.map(t => t.month))]
    .filter(Boolean).sort();

  if (mesesConDatos.length === 0) {
    return `<div class="empty" style="margin-top:80px"><div class="empty-icon">📊</div><p>Sin datos aún.<br>Registra movimientos en al menos un mes.</p></div>`;
  }

  // Calcular totales por mes incluyendo ahorro
  const resumenMeses = mesesConDatos.map(mk => {
    const txs = d.txs.filter(t => t.month === mk);
    const ingresos = txs.filter(t => t.cat === 'ingreso').reduce((a,t)=>a+t.monto,0);
    const gastos   = txs.filter(t => t.cat !== 'ingreso').reduce((a,t)=>a+t.monto,0);
    const ahorro   = txs.filter(t => t.cat === 'ahorro').reduce((a,t)=>a+t.monto,0);
    const credito  = txs.filter(t => t.cat !== 'ingreso' && t.pago === 'credito').reduce((a,t)=>a+t.monto,0);
    const pctAhorro = ingresos > 0 ? (ahorro / ingresos * 100) : 0;
    const pctGasto  = ingresos > 0 ? (gastos / ingresos * 100) : 0;
    return { mk, ingresos, gastos, ahorro, balance: ingresos - gastos, credito, pctAhorro, pctGasto };
  }).reverse();

  const maxVal = Math.max(...resumenMeses.map(m => Math.max(m.ingresos, m.gastos)), 1);

  // ── GRÁFICO DE BARRAS SVG ──
  const n = Math.min(resumenMeses.length, 6);
  const mesesGrafico = resumenMeses.slice(0, n).reverse();
  const W = Math.max(n * 72, 280);
  const H = 130;
  const barW = 22;
  const gap = W / n;

  let bars = '';
  mesesGrafico.forEach((m, i) => {
    const x = i * gap + gap / 2;
    const hIng = m.ingresos > 0 ? Math.max((m.ingresos / maxVal) * (H - 30), 4) : 0;
    const hGas = m.gastos > 0   ? Math.max((m.gastos   / maxVal) * (H - 30), 4) : 0;
    const hAho = m.ahorro > 0   ? Math.max((m.ahorro   / maxVal) * (H - 30), 3) : 0;
    bars += `
      <rect x="${x - barW - 2}" y="${H - 20 - hIng}" width="${barW}" height="${hIng}" rx="4" fill="var(--green)" opacity=".85"/>
      <rect x="${x + 2}"         y="${H - 20 - hGas}" width="${barW}" height="${hGas}" rx="4" fill="var(--red)"   opacity=".75"/>
      ${hAho > 0 ? `<rect x="${x - barW/2 - 4}" y="${H - 20 - hAho}" width="${barW * 0.6}" height="${hAho}" rx="3" fill="var(--yellow)" opacity=".9"/>` : ''}
      <text x="${x}" y="${H - 4}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="Plus Jakarta Sans">${MONTHS[parseInt(m.mk.slice(5))-1].slice(0,3)}</text>
    `;
  });

  let html = `<div class="card">
    <div class="card-title">Evolución mensual</div>
    <div style="display:flex;gap:14px;margin-bottom:10px;font-size:11px;flex-wrap:wrap">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--green);border-radius:3px;margin-right:4px;opacity:.85"></span>Ingresos</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--red);border-radius:3px;margin-right:4px;opacity:.75"></span>Gastos</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--yellow);border-radius:3px;margin-right:4px;opacity:.9"></span>Ahorro</span>
    </div>
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="display:block;min-width:${W}px">
        <line x1="0" y1="${H-20}" x2="${W}" y2="${H-20}" stroke="var(--border)" stroke-width="1"/>
        ${bars}
      </svg>
    </div>
  </div>`;

  html += `<div class="card"><div class="card-title">Detalle por mes</div>`;
  resumenMeses.forEach(m => {
    const isCurrent = m.mk === monthKey(d);
    const balPos = m.balance >= 0;
    const pctGas = m.ingresos > 0 ? Math.min(m.gastos / m.ingresos * 100, 100) : 0;
    html += `<div class="comp-month-row" onclick="setMonth('${m.mk}');showTab('resumen')" style="${isCurrent?'background:rgba(184,92,56,.04);border-radius:10px;padding:12px 8px;':''}">
      <div class="comp-month-label">
        <div style="font-weight:${isCurrent?'600':'400'};color:${isCurrent?'var(--accent)':'var(--text)'}">${MONTHS[parseInt(m.mk.slice(5))-1].slice(0,3)}</div>
        <div style="font-size:11px;color:var(--muted)">${m.mk.slice(0,4)}</div>
        ${isCurrent ? `<div style="font-size:9px;color:var(--accent);font-weight:600;margin-top:2px">ACTIVO</div>` : ''}
      </div>
      <div class="comp-bars">
        <div class="comp-bar-row">
          <div class="comp-bar-bg"><div class="comp-bar-fill" style="width:${m.ingresos/maxVal*100}%;background:var(--green)"></div></div>
          <div class="comp-val" style="color:var(--green)">${fmt(m.ingresos)}</div>
        </div>
        <div class="comp-bar-row">
          <div class="comp-bar-bg"><div class="comp-bar-fill" style="width:${pctGas}%;background:var(--red)"></div></div>
          <div class="comp-val" style="color:var(--red)">${fmt(m.gastos)}</div>
        </div>
        ${m.ahorro > 0 ? `
        <div class="comp-bar-row">
          <div class="comp-bar-bg"><div class="comp-bar-fill" style="width:${Math.min(m.ahorro/maxVal*100,100)}%;background:var(--yellow)"></div></div>
          <div class="comp-val" style="color:var(--yellow)">${fmt(m.ahorro)}</div>
        </div>` : ''}
        <div style="display:flex;gap:8px;margin-top:3px;flex-wrap:wrap">
          <span style="font-size:10px;color:${balPos?'var(--green)':'var(--red)'};font-weight:600">${balPos?'▲':'▼'} ${fmt(Math.abs(m.balance))} balance</span>
          ${m.ahorro > 0 && m.ingresos > 0 ? `<span style="font-size:10px;color:var(--yellow);font-weight:600">💰 ${m.pctAhorro.toFixed(0)}% ahorro</span>` : ''}
          ${m.ingresos > 0 ? `<span style="font-size:10px;color:var(--muted)">${m.pctGasto.toFixed(0)}% gasto</span>` : ''}
        </div>
      </div>
    </div>`;
  });
  html += `</div>`;

  // ── DESGLOSE CRÉDITO ──
  const creditoTotal = resumenMeses.reduce((a,m)=>a+m.credito,0);
  if (creditoTotal > 0) {
    html += `<div class="card"><div class="card-title">💳 Gastos en crédito por mes</div>`;
    const maxCred = Math.max(...resumenMeses.map(m=>m.credito),1);
    resumenMeses.filter(m=>m.credito>0).forEach(m => {
      const pct = m.credito / maxCred * 100;
      html += `<div class="credito-item">
        <div style="width:68px;font-size:12px;color:var(--muted)">${MONTHS[parseInt(m.mk.slice(5))-1].slice(0,3)} ${m.mk.slice(2,4)}</div>
        <div style="flex:1">
          <div class="comp-bar-bg"><div class="comp-bar-fill" style="width:${pct}%;background:var(--purple)"></div></div>
        </div>
        <div style="font-size:13px;font-weight:600;font-family:'Lora',serif;color:var(--purple);width:80px;text-align:right">${fmt(m.credito)}</div>
      </div>`;
    });
    html += `<div style="display:flex;justify-content:space-between;padding:10px 0 0;border-top:1px solid var(--border);margin-top:4px">
      <span style="font-size:13px;font-weight:600;color:var(--muted)">Total histórico en crédito</span>
      <span style="font-size:15px;font-weight:600;font-family:'Lora',serif;color:var(--purple)">${fmt(creditoTotal)}</span>
    </div></div>`;
  }

  // ── PROMEDIO MENSUAL ──
  const n2 = resumenMeses.length;
  if (n2 > 1) {
    const avgIng = resumenMeses.reduce((a,m)=>a+m.ingresos,0)/n2;
    const avgGas = resumenMeses.reduce((a,m)=>a+m.gastos,0)/n2;
    const avgAho = resumenMeses.reduce((a,m)=>a+m.ahorro,0)/n2;
    const mejorMes = [...resumenMeses].sort((a,b)=>b.balance-a.balance)[0];
    const mejorAhorro = [...resumenMeses].filter(m=>m.ahorro>0).sort((a,b)=>b.pctAhorro-a.pctAhorro)[0];
    html += `<div class="card"><div class="card-title">Promedios (${n2} meses)</div>
      <div class="summary-grid" style="margin-bottom:10px">
        <div class="pill"><div class="pill-label">Ingreso prom.</div><div class="pill-val green">${fmt(Math.round(avgIng))}</div></div>
        <div class="pill"><div class="pill-label">Gasto prom.</div><div class="pill-val red">${fmt(Math.round(avgGas))}</div></div>
      </div>
      ${avgAho > 0 ? `<div class="pill" style="margin-bottom:10px;display:block">
        <div class="pill-label">Ahorro promedio</div>
        <div class="pill-val" style="color:var(--yellow)">${fmt(Math.round(avgAho))}</div>
      </div>` : ''}
      <div style="font-size:13px;color:var(--muted)">🏆 Mejor balance: <strong style="color:var(--green)">${monthLabel(mejorMes.mk)}</strong> · ${fmt(mejorMes.balance)}</div>
      ${mejorAhorro ? `<div style="font-size:13px;color:var(--muted);margin-top:6px">💰 Mayor ahorro: <strong style="color:var(--yellow)">${monthLabel(mejorAhorro.mk)}</strong> · ${mejorAhorro.pctAhorro.toFixed(1)}% del ingreso</div>` : ''}
    </div>`;
  }

  return html;
}

function renderMetas() {
  const d = getData();

  // Calcular ahorro total registrado en cat ahorro (histórico)
  const ahorroHistorico = d.txs
    .filter(t => t.cat === 'ahorro')
    .reduce((a, t) => a + t.monto, 0);

  // Ahorro comprometido en metas
  const ahorroEnMetas = d.metas.reduce((a, m) => {
    return a + (m.baseAhorrado||0) + (m.ahorroVinculado||0) + (m.ahorrado||0);
  }, 0);

  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-top:4px">
    <span style="font-size:16px;font-weight:600;font-family:'Lora',serif">Mis metas de ahorro</span>
    <button onclick="openAddMeta()" style="background:rgba(184,92,56,.12);border:1px solid rgba(184,92,56,.3);color:var(--accent);border-radius:10px;padding:7px 14px;font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;cursor:pointer;font-weight:600">+ Nueva</button>
  </div>`;

  // Panel resumen de ahorro
  if (ahorroHistorico > 0 || d.metas.length > 0) {
    html += `<div class="card" style="margin-bottom:14px">
      <div class="card-title">Resumen de ahorro</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div class="pill">
          <div class="pill-label">Total registrado</div>
          <div class="pill-val" style="color:var(--accent)">${fmt(ahorroHistorico)}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:3px">en categoría Ahorro</div>
        </div>
        <div class="pill">
          <div class="pill-label">Asignado a metas</div>
          <div class="pill-val" style="color:var(--green)">${fmt(ahorroEnMetas)}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:3px">${d.metas.length} meta${d.metas.length!==1?'s':''}</div>
        </div>
      </div>
      <div class="info-box" style="margin:0;font-size:12px">
        💡 Al registrar un gasto en categoría <strong>Ahorro</strong>, selecciona la meta a la que quieres abonar.
        El monto se descuenta directamente de su objetivo.
      </div>
    </div>`;
  }

  if (d.metas.length === 0) {
    return html + `<div class="empty" style="margin-top:20px"><div class="empty-icon">🎯</div><p>Sin metas todavía.<br>Crea una para empezar a seguir tu ahorro.</p></div>`;
  }

  // Separar metas activas y completadas
  const activas = d.metas.filter(m => !m.completada);
  const completadas = d.metas.filter(m => m.completada);

  const renderMeta = (m) => {
    const totalAhorrado = (m.baseAhorrado||0) + (m.ahorroVinculado||0) + (m.ahorrado||0);
    const pct = m.objetivo > 0 ? Math.min(totalAhorrado / m.objetivo * 100, 100) : 0;
    const restante = Math.max(m.objetivo - totalAhorrado, 0);
    const mesesRestantes = (m.mensual > 0 && restante > 0) ? Math.ceil(restante / m.mensual) : null;
    const barColor = pct >= 100 ? 'green' : pct >= 70 ? 'accent' : pct >= 40 ? 'yellow' : 'accent';

    // Calcular aportes del mes actual
    const mesActual = monthKey(d);
    const aporteMes = d.txs
      .filter(t => t.cat === 'ahorro' && t.month === mesActual && t.metaId === m.id)
      .reduce((a,t) => a+t.monto, 0);

    return `<div class="meta-card" onclick="openEditMeta('${m.id}')">
      <div class="meta-top">
        <div style="flex:1">
          <div style="font-size:16px;font-weight:600;font-family:'Lora',serif">${m.emoji||'🎯'} ${m.nombre}</div>
          <span class="meta-badge ${m.vinculado?'linked':'manual'}">${m.vinculado?'🔗 Auto desde Ahorro':'✏️ Manual'}</span>
        </div>
        <div style="text-align:right">
          <div class="meta-pct">${pct.toFixed(0)}%</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">${fmt(totalAhorrado)} / ${fmt(m.objetivo)}</div>
        </div>
      </div>

      <!-- Barra de progreso -->
      <div class="prog-bar" style="height:8px;margin:10px 0 6px">
        <div class="prog-fill ${barColor}" style="width:${pct}%;transition:width .5s ease"></div>
      </div>

      <!-- Desglose de ahorro -->
      <div class="meta-saving-info">
        ${m.baseAhorrado > 0 ? `
          <div class="meta-saving-row">
            <span>💰 Base inicial</span>
            <span>${fmt(m.baseAhorrado)}</span>
          </div>` : ''}
        ${m.ahorroVinculado > 0 ? `
          <div class="meta-saving-row">
            <span>🔗 Abonos registrados</span>
            <span style="color:var(--accent);font-weight:600">${fmt(m.ahorroVinculado)}</span>
          </div>` : ''}
        ${m.ahorrado > 0 && !m.vinculado ? `
          <div class="meta-saving-row">
            <span>💰 Ahorrado</span>
            <span style="color:var(--accent);font-weight:600">${fmt(m.ahorrado)}</span>
          </div>` : ''}
        ${aporteMes > 0 ? `
          <div class="meta-saving-row">
            <span>📅 Aporte este mes</span>
            <span style="color:var(--green);font-weight:600">+${fmt(aporteMes)}</span>
          </div>` : ''}
        <div class="meta-saving-row" style="padding-top:8px;border-top:1px solid var(--border);margin-top:6px">
          <span style="font-weight:600;color:var(--text)">Falta para completar</span>
          <span style="color:${restante>0?'var(--yellow)':'var(--green)'};font-weight:700;font-size:14px">
            ${restante > 0 ? fmt(restante) : '🎉 ¡Meta alcanzada!'}
          </span>
        </div>
        ${mesesRestantes ? `
          <div class="meta-saving-row" style="margin-top:4px">
            <span style="color:var(--muted)">A ${fmt(m.mensual)}/mes, llegas en</span>
            <span style="color:var(--muted)">${mesesRestantes} mes${mesesRestantes!==1?'es':''}</span>
          </div>` : ''}
      </div>

      ${pct >= 100 ? `<div style="margin-top:10px;padding:8px;background:var(--green-bg);border-radius:10px;text-align:center;font-size:13px;color:var(--green);font-weight:600">🎉 ¡Meta completada! ¡Felicitaciones!</div>` : ''}
    </div>`;
  };

  // Metas activas
  if (activas.length > 0) {
    activas.forEach(m => { html += renderMeta(m); });
  }

  // Metas completadas (colapsadas)
  if (completadas.length > 0) {
    html += `<div style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px;padding:0 4px">
      🏆 Completadas (${completadas.length})
    </div>`;
    completadas.forEach(m => { html += renderMeta(m); });
  }

  return html;
}

// ── CONFIG ───────────────────────────────────────────────────────────────────
function renderConfig() {
  const d = getData();
  const pres = d.presupuestos[monthKey(d)] || {};
  const mes = monthLabel(monthKey(d));
  const allCats = getAllCats();

  let html = `<div style="padding-top:4px">`;
  html += renderUserCard();
  html += `<div class="card"><div class="card-title">Mes activo</div>`;

  // Selector de mes
  const now = new Date();
  const months6 = [];
  for (let i = -1; i <= 4; i++) {
    const d2 = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = `${d2.getFullYear()}-${String(d2.getMonth()+1).padStart(2,'0')}`;
    months6.push({ key, label: MONTHS[d2.getMonth()].slice(0,3) + ' ' + d2.getFullYear() });
  }
  html += `<div class="month-grid">`;
  months6.forEach(m => {
    html += `<button class="month-btn ${m.key===monthKey(d)?'active':''}" onclick="setMonth('${m.key}')">${m.label}</button>`;
  });
  html += `</div></div>`;

  // Categorías personalizadas
  html += `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="card-title" style="margin-bottom:0">Categorías</div>
      <button onclick="openAddCat()" style="background:rgba(184,92,56,.12);border:1px solid rgba(184,92,56,.3);color:var(--accent);border-radius:8px;padding:5px 12px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;cursor:pointer;font-weight:600">+ Nueva</button>
    </div>`;

  // Categorías base (solo lectura)
  html += `<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">Predeterminadas</div>`;
  BASE_CATS.filter(c => c.id !== 'ingreso').forEach(cat => {
    html += `<div class="cat-manage-item">
      <div class="cat-manage-icon" style="background:${cat.color}">${cat.icon}</div>
      <span class="cat-manage-name">${cat.name}</span>
      <span style="font-size:11px;color:var(--muted)">Base</span>
    </div>`;
  });

  // Categorías personalizadas
  if (d.customCats && d.customCats.length > 0) {
    html += `<div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:12px 0 6px">Personalizadas</div>`;
    d.customCats.forEach(cat => {
      html += `<div class="cat-manage-item">
        <div class="cat-manage-icon" style="background:${cat.color}">${cat.icon}</div>
        <span class="cat-manage-name">${cat.name}</span>
        <div class="cat-manage-actions">
          <button class="btn-icon" onclick="openEditCat('${cat.id}')">✏️</button>
          <button class="btn-icon del" onclick="deleteCat('${cat.id}')">🗑️</button>
        </div>
      </div>`;
    });
  }
  html += `</div>`;

  // Presupuestos
  const totalPres = Object.values(pres).reduce((a, v) => a + (v || 0), 0);
  const { ingresos } = getTotals(d);
  const libre = ingresos - totalPres;
  const pctUsado = ingresos > 0 ? Math.min(totalPres / ingresos * 100, 100) : 0;
  const colorBarra = pctUsado > 100 ? 'red' : pctUsado > 85 ? 'yellow' : 'green';

  html += `<div class="card"><div class="card-title">Presupuesto para ${mes}</div>`;

  // Resumen total arriba
  if (totalPres > 0 || ingresos > 0) {
    html += `<div style="background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:14px;border:1px solid var(--border)">
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
        <div>
          <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px">Presupuestado</div>
          <div style="font-size:16px;font-weight:600;font-family:'DM Mono',monospace;color:var(--red)">${fmt(totalPres)}</div>
        </div>
        <div>
          <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px">Ingreso</div>
          <div style="font-size:16px;font-weight:600;font-family:'DM Mono',monospace;color:var(--green)">${ingresos > 0 ? fmt(ingresos) : '—'}</div>
        </div>
        <div>
          <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px">${libre >= 0 ? 'Disponible' : 'Déficit'}</div>
          <div style="font-size:16px;font-weight:600;font-family:'DM Mono',monospace;color:${libre >= 0 ? 'var(--accent)' : 'var(--red)'}">${ingresos > 0 ? fmt(Math.abs(libre)) : '—'}</div>
        </div>
      </div>
      ${ingresos > 0 ? `
        <div class="prog-bar" style="height:8px">
          <div class="prog-fill ${colorBarra}" style="width:${pctUsado}%"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px">
          <span>${pctUsado.toFixed(0)}% del ingreso presupuestado</span>
          <span style="color:${libre>=0?'var(--green)':'var(--red)'};font-weight:500">${libre >= 0 ? 'Superávit ✓' : '⚠️ Excede ingreso'}</span>
        </div>
      ` : `<div style="font-size:12px;color:var(--muted);text-align:center;padding:4px 0">Registra un ingreso este mes para ver la comparación</div>`}
    </div>`;
  }

  allCats.filter(c=>c.id!=='ingreso').forEach(cat => {
    html += `<div class="setting-row">
      <span class="setting-label">${cat.icon} ${cat.name}</span>
      <span class="setting-val" onclick="openEditPres('${cat.id}')">${pres[cat.id]?fmt(pres[cat.id]):'Fijar'}</span>
    </div>`;
  });

  if (totalPres > 0) {
    html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0 0;margin-top:4px;border-top:1px solid var(--border)">
      <span style="font-size:13px;font-weight:600">Total presupuestado</span>
      <span style="font-size:15px;font-weight:600;font-family:'DM Mono',monospace;color:var(--red)">${fmt(totalPres)}</span>
    </div>`;
  }

  html += `</div>`;

  // Datos
  html += `<div class="card"><div class="card-title">Datos y preferencias</div>
    <div class="dark-toggle">
      <div>
        <div style="font-size:14px;font-weight:500">Modo oscuro</div>
        <div style="font-size:11px;color:var(--muted);margin-top:1px">Fondo oscuro para usar de noche</div>
      </div>
      <button onclick="toggleDarkMode()" style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:15px;cursor:pointer">
        ${document.body.classList.contains('dark') ? '☀️ Claro' : '🌙 Oscuro'}
      </button>
    </div>
    <div class="setting-row"><span class="setting-label">Movimientos totales</span><span style="color:var(--muted)">${d.txs.length}</span></div>
    <div class="setting-row"><span class="setting-label">Meses con datos</span><span style="color:var(--muted)">${[...new Set(d.txs.map(t=>t.month).filter(Boolean))].length}</span></div>
    <div class="setting-row"><span class="setting-label" onclick="showTab('cobros')" style="cursor:pointer;color:var(--accent)">💸 Me deben →</span></div>
    <div class="setting-row"><span class="setting-label" style="color:var(--red);cursor:pointer" onclick="confirmClear()">Borrar todos los datos</span><span>🗑️</span></div>
  </div>`;

  // Recurrentes
  const recurrentes = d.recurrentes || [];
  html += `<div class="card"><div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
    <span>Movimientos recurrentes</span>
    <span style="font-size:11px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0">${recurrentes.length} activo${recurrentes.length!==1?'s':''}</span>
  </div>`;
  if (recurrentes.length === 0) {
    html += `<div style="text-align:center;padding:16px;font-size:13px;color:var(--muted)">Sin recurrentes. Al crear un movimiento activa<br>"Repetir cada mes".</div>`;
  } else {
    recurrentes.forEach(r => {
      const cat = getCat(r.cat);
      const pagoLabels = { efectivo:'💵', debito:'💳', credito:'🏦' };
      html += `<div class="recur-card">
        <div class="recur-icon" style="background:${cat.color}">${cat.icon}</div>
        <div class="recur-info">
          <div class="recur-name">${r.desc||cat.name}</div>
          <div class="recur-meta">${cat.name} · ${pagoLabels[r.pago]||''} ${r.pago||''} ${r.nota?'· '+r.nota:''}</div>
        </div>
        <div style="text-align:right">
          <div class="recur-amt" style="color:${r.tipo==='ing'?'var(--green)':'var(--red)'}">${r.tipo==='ing'?'+':'-'}${fmt(r.monto)}</div>

        </div>
      </div>`;
    });
  }
  html += `</div>`;

  html += `</div>`;
  return html;
}

function onCreditoChange() {
  const monto = parseFloat(document.getElementById('f-monto')?.value) || 0;
  const tipo = document.getElementById('tc-tipo-form')?.value || 'contado';
  const wrap = document.getElementById('tc-ncuotas-form-wrap');
  if (wrap) wrap.style.display = tipo !== 'contado' ? 'block' : 'none';
  const cuotas = tipo === 'contado' ? 1 : (parseInt(document.getElementById('tc-ncuotas-form')?.value) || 2);
  const resumen = document.getElementById('tc-resumen-form');
  if (!resumen || monto <= 0) return;

  const d = getData();
  const tcSelId = document.getElementById('f-tc-selector')?.value;
  const tc = (tcSelId ? d.tarjetas.find(t=>t.id===tcSelId) : null) || d.tarjetas[0];
  window._tcFormId = tc?.id;

  const mantencion = Math.round((tc.mantencionUF||0) * (tc.ufValue||38500));
  const r = ((tc.tasaMin||1.5)/100);
  let montoCuota;
  if (tipo === 'contado' || tipo === 'sin_interes') {
    montoCuota = Math.round(monto / cuotas);
  } else {
    montoCuota = Math.round(monto * (r * Math.pow(1+r,cuotas)) / (Math.pow(1+r,cuotas)-1));
  }
  const timbres = cuotas > 1 ? Math.round(monto * TIMBRES_ESTAMPILLAS * cuotas) : 0;
  const interesTotal = tipo === 'con_interes' ? Math.round(montoCuota*cuotas - monto) : 0;
  const ciclos = getCiclosTC(tc);
  const cicloActivo = ciclos[0];

  resumen.innerHTML = `<div class="credito-resumen">
    <div style="font-size:11px;font-weight:600;color:var(--purple);margin-bottom:8px">
      📋 ${tc.banco} · ${tc.alias||tc.tipo}
    </div>
    <div class="credito-resumen-row"><span>Fecha de vencimiento</span><span>${cicloActivo.fechaVenc}</span></div>
    <div class="credito-resumen-row"><span>Valor cuota</span><span>${fmt(montoCuota)}/mes × ${cuotas}</span></div>
    ${timbres > 0 ? `<div class="credito-resumen-row"><span>Timbres y estampillas (DL3475)</span><span>${fmt(timbres)}</span></div>` : ''}
    ${interesTotal > 0 ? `<div class="credito-resumen-row"><span style="color:var(--red)">Interés total</span><span style="color:var(--red)">${fmt(interesTotal)}</span></div>` : ''}
    <div class="credito-resumen-row"><span>Mantención ${tc.tipo}</span><span>${fmt(mantencion)}/mes</span></div>
    <div class="credito-resumen-row highlight">
      <span>Total próximo estado</span>
      <span>${fmt(montoCuota + (cuotas>1?timbres:0) + mantencion)}</span>
    </div>
    ${tipo==='sin_interes' ? `<div style="font-size:11px;color:var(--green);margin-top:6px">✅ Sin interés — paga el estado completo cada mes para mantener el beneficio</div>` : ''}

  </div>`;
}
